  else if (G.mode === 'INTERLUDE') updateInterlude();
  else updateBoss();
  updateEnemies();
  updateBullets();
  updatePShots();
  updateItems();
  updateParts();
  updateRings();
  if (shake > 0) shake *= 0.88;
  if (vignette > 0) vignette *= 0.94;
  if (flash > 0) flash *= 0.86;
  if (Net.isOnline()) netTick();
}

/* ── 온라인: 송신 주기 및 상대 기체 보간 ── */
// 동료들의 자탄을 쏜다.
//   호스트에서는 이게 실제 데미지 판정이 되고 (판정을 한 곳으로 모으기 위해),
//   클라이언트에서는 화면에만 나온다 (updatePShots 가 클라에서는 판정을 건너뛴다).
//   클라에서도 쏘지 않으면 동료 옆에서 적이 저절로 죽는 것처럼 보인다.
function fireMateShots(){
  for (let i=0;i<MAX_PLAYERS;i++){
    if (i === Net.mySlot) continue;
    const r = Net.players[i];
    if (!r.present || r.spectating || G.finished) continue;
    r.fireTick = (r.fireTick || 0) - 1;
    if (r.fireTick > 0) continue;
    const cfg = POWER_TABLE[Math.min(POWER_MAX, Math.floor(r.power))];
    r.fireTick = cfg.interval;
    const nz = 7 * PLAYER_SCALE, ny = 14 * PLAYER_SCALE;
    spawnPShot(r.x - nz, r.y - ny, 0, -16, cfg.dmg);
    spawnPShot(r.x + nz, r.y - ny, 0, -16, cfg.dmg);
    const extra = cfg.shots - 2;
    const ox = (r.slow ? 15 : 24) * PLAYER_SCALE, oy = (r.slow ? 6 : 14) * PLAYER_SCALE;
    for (let k=0;k<extra;k++){
      const side = (k % 2 === 0) ? -1 : 1, tier = Math.floor(k/2);
      const a = -side * (r.slow ? 0.075 : 0.040) * (1 + tier*0.6);
      spawnPShot(r.x + side*(ox + tier*11*PLAYER_SCALE), r.y + oy + tier*9*PLAYER_SCALE,
                 Math.sin(a)*14, -Math.cos(a)*14, cfg.dmg);
    }
  }
}

function netTick(){
  Net.sendTick++;
  if (Net.isHost()){
    if (Net.sendTick % 2 === 0 && Net.tp) Net.sendAll(encodeSnapshot());
  } else {
    // 호스트와 같은 30Hz. 예전에는 게스트만 스텝마다 보내서 2배(캐치업 시 최대 5배)였다.
    if (Net.sendTick % 2 === 0 && Net.tp) Net.sendUp(encodeClientState());
  }
  fireMateShots();
}

/* ── 클라이언트: 스냅샷 탄으로 자기 피격/그레이즈를 직접 판정 (입력 지연 없이) ── */
// 스냅샷은 탄을 매번 새로 만들어 보내므로 "이 탄을 이미 스쳤다" 는 표시를 탄에 붙일 수 없다.
// (예전에는 b._g 를 썼는데 스냅샷마다 초기화돼 초당 수백 번 Sound.graze() 가 터졌다 —
//  호스트 대비 17배. 오디오 노드가 쌓이면서 그게 게스트 화면 렉의 주범이었다.)
// 그래서 개수 차분으로 센다: 사거리 안의 탄 수가 늘어난 만큼만 새로 스친 것으로 본다.
let clientGrazeNear = 0;
function clientCollide(){
  if (G.spectating || G.finished){ clientGrazeNear = 0; return; }
  const bs = NetWorld.bullets;
  const gr = player.grazeR + 6, gr2 = gr*gr;
  const hr = player.hitR + 4.3, hr2 = hr*hr;
  let near = 0;
  for (let i=0;i<bs.length;i++){
    const b = bs[i];
    const dx = b.x - player.x, dy = b.y - player.y;
    const d2 = dx*dx + dy*dy;
    if (d2 > gr2) continue;
    near++;
    if (d2 < hr2 && player.invuln <= 0 && player.pendingDeath < 0){
      player.pendingDeath = 9;
      shake = Math.max(shake, 8);
    }
  }
  if (near > clientGrazeNear){
    const add = near - clientGrazeNear;
    for (let k=0;k<add;k++){ G.graze++; G.grazeCombo++; addScore(100 * D.grazeMul); }
    Sound.graze(G.grazeCombo);        // 소리는 묶어서 한 번만
  }
  clientGrazeNear = near;
}
const clientPicked = new Map();   // 아이템 id → 만료 프레임 (중복 획득 방지)
function clientPickup(){
  if (G.spectating) return;
  if (clientPicked.size > 200) clientPicked.clear();
  const its = NetWorld.items;
  for (let i=0;i<its.length;i++){
    const it = its[i];
    const ex = clientPicked.get(it.id);
    if (ex !== undefined){ if (frame < ex) continue; clientPicked.delete(it.id); }
    const dx = it.x - player.x, dy = it.y - player.y;
    const special = it.kind !== 'power' && it.kind !== 'score';
    const rr = ITEM_PICKUP_R + (special ? 6 : 0);
    if (dx*dx + dy*dy > rr*rr) continue;
    clientPicked.set(it.id, frame + 90);
    netSendEvent('pick', { id: it.id, x: it.x, y: it.y, ik: it.kind });
    if (it.kind === 'power'){ addPower(POWER_PER_ITEM); addScore(200); Sound.item(); }
    else if (it.kind === 'score'){ addScore(500); }
    else if (it.kind === 'homing'){
      player.homing = Math.min(HOMING_TIME*2, player.homing + HOMING_TIME);
      player.homingTick = 1; addScore(3000); G.pickups.homing++;
      G.banner = 70; G.bannerText = 'HOMING MISSILE'; Sound.powerUp();
    } else if (it.kind === 'bomb'){
      G.bombs = Math.min(BOMB_MAX, G.bombs + 1); addScore(3000); G.pickups.bomb++;
      G.banner = 70; G.bannerText = 'BOMB +1'; Sound.powerUp();
    } else if (it.kind === 'shield'){
      player.shield = Math.min(SHIELD_MAX, player.shield + 1); addScore(3000); G.pickups.shield++;
      G.banner = 70; G.bannerText = 'SHIELD ON'; Sound.powerUp();
    }
  }
}

/* ═══════════════════════════════════════════════════
   렌더링
   ═══════════════════════════════════════════════════ */
// 고고도 하늘 — 위는 성층권처럼 어둡고, 아래로 갈수록 푸르게.
// 탄막 가독성을 위해 아래쪽도 지나치게 밝아지지 않도록 억제한다.
function drawBackground(t){
  const sky = ctx.createLinearGradient(0, 0, 0, LH);
  sky.addColorStop(0,    '#02040e');
  sky.addColorStop(0.26, '#061630');
  sky.addColorStop(0.58, '#0b2a54');
  sky.addColorStop(1,    '#123c6f');
  ctx.fillStyle = sky;
  ctx.fillRect(0,0,LW,LH);

  ctx.save();
  ctx.beginPath(); ctx.rect(PF.x, PF.y, PF.w, PF.h); ctx.clip();

  // 별 (상층부에서만 보이도록 위쪽일수록 진하게)
  for (let i=0;i<starLayout.length;i++){
    const s = starLayout[i];
    const y = PF.y + ((s.y0 + t*s.v) % PF.h);
    const fade = Math.max(0, 1 - (y - PF.y) / (PF.h*0.75));
    if (fade <= 0) continue;
    ctx.globalAlpha = s.a * fade;
    ctx.fillStyle = '#dff0ff';
    ctx.fillRect(s.x, y, s.r, s.r);
  }

  // 구름층 — 아래로 흘러가며 전진하는 느낌을 준다
  for (let i=0;i<cloudLayout.length;i++){
    const cl = cloudLayout[i];
    const img = CLOUD_IMGS[cl.img];
    if (!img) continue;
    const w = img.width * cl.s, h = img.height * cl.s;
    const span = PF.h + h;
    const y = PF.y - h + ((cl.y0 + t*cl.v) % span);
    const depth = Math.min(1, Math.max(0, (y - PF.y) / PF.h));
    ctx.globalAlpha = cl.a * (0.35 + depth * 0.65);
    ctx.drawImage(img, cl.x - w/2, y, w, h);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // 페이즈 색조 (하늘 위에 옅게)
  if ((state === S.PLAY || state === S.PAUSE) && G && G.mode === 'BOSS'){
    ctx.save();
    ctx.globalAlpha = 0.20;
    const g = ctx.createRadialGradient(LW/2, PF.y+120, 20, LW/2, PF.y+120, 420);
    g.addColorStop(0, G.tint);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0,0,LW,LH);
    ctx.restore();
  }
}

function drawSprite(spr, x, y, rot, alpha, scale){
  if (!spr) return;
  const s = scale || 1;
  ctx.save();
  ctx.translate(x, y);
  if (rot) ctx.rotate(rot);
  if (alpha !== undefined) ctx.globalAlpha = alpha;
  const h = spr.half * s;
  ctx.drawImage(spr.canvas, -h, -h, h*2, h*2);
  ctx.restore();
}

function drawBullets(){
  ctx.save();
  ctx.beginPath(); ctx.rect(PF.x-30, PF.y-30, PF.w+60, PF.h+60); ctx.clip();
  const pulse = 1 + Math.sin(frame*0.4)*0.14;
  // 현재 CTM(스케일 + 화면 흔들림)을 직접 재구성해 save/restore 비용 제거
  const sx = shakeX * drawScale, sy = shakeY * drawScale;
  for (let i=0;i<active.length;i++){
    const b = active[i];
    if (!b.on) continue;
    const k = b.kind;
    if (k === 'burst'){
      // 둥근 예광탄 — 회전 불필요 (가장 흔한 경로)
      const h = b.spr.half;
      ctx.drawImage(b.spr.canvas, b.x-h, b.y-h, h*2, h*2);
    } else {
      // 미사일·예광탄 라인 — 진행 방향으로 정렬 (회전값은 생성 시 캐시된 것)
      const sc = ((k === 'seed') ? pulse : 1) * drawScale;
      const cos = b.rc*sc, sin = b.rs*sc;
      ctx.setTransform(cos, sin, -sin, cos, b.x*drawScale + sx, b.y*drawScale + sy);
      const h = b.spr.half;
      ctx.drawImage(b.spr.canvas, -h, -h, h*2, h*2);
      ctx.setTransform(drawScale, 0, 0, drawScale, sx, sy);
    }
  }
  ctx.restore();
}

function drawPShots(){
  ctx.save();
  for (let i=0;i<MAX_PSHOT;i++){
    const s = pshots[i];
    if (!s.on) continue;
    if (s.homing) drawSprite(SPR.hmiss, s.x, s.y, Math.atan2(s.vy,s.vx)+Math.PI/2, 1);
    else          drawSprite(SPR.pshot, s.x, s.y, s.rot, 0.8);
  }
  ctx.restore();
}

function drawItems(){
  for (let i=0;i<MAX_ITEM;i++){
    const it = items[i];
    if (!it.on) continue;
    // 배지는 살짝 기울여 흔들리게 — 탄(직선 비행)과 움직임으로도 구분되게 한다
    const wob = Math.sin((frame + it.life*3) * 0.06) * 0.28;
    if (it.kind === 'power'){
      const pulse = 1 + Math.sin((frame + it.life)*0.16)*0.10;
      drawSprite(SPR.power, it.x, it.y, wob, 1, pulse);
    } else {
      drawSprite(SPR.item, it.x, it.y, wob, 0.95, 0.9);
    }
  }
}

function drawEnemies(){
  for (let i=0;i<MAX_ENEMY;i++){
    const e = enemies[i];
    if (!e.on) continue;
    ctx.save();
    ctx.translate(e.x, e.y);
    const hit = e.hitFlash > 0;

    if (e.type === 'midboss'){
      for (const [rad, spd2, col] of [[34, 0.02, C.eRing], [24, -0.03, C.eLaser]]){
        ctx.save(); ctx.rotate(e.t*spd2);
        ctx.strokeStyle = col; ctx.globalAlpha = 0.6; ctx.lineWidth = 2;
        ctx.setLineDash([10, 8]);
        ctx.beginPath(); ctx.arc(0,0,rad,0,TAU); ctx.stroke();
        ctx.restore();
      }
      ctx.setLineDash([]);
      const g = ctx.createRadialGradient(0,0,2, 0,0, 22);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(0.55, hit ? '#ffffff' : 'rgba(255,154,213,0.85)');
      g.addColorStop(1, 'rgba(255,47,208,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0,0,22,0,TAU); ctx.fill();
    } else {
      const key = MIG_OF[e.type];
      // 엔진 배기
      ctx.save();
      ctx.globalAlpha = 0.6;
      const eg = ctx.createLinearGradient(0, -e.r*0.7, 0, -e.r*2.0);
      eg.addColorStop(0, 'rgba(255,210,150,0.85)');
      eg.addColorStop(1, 'rgba(255,120,60,0)');
      ctx.fillStyle = eg;
      ctx.fillRect(-e.r*0.42, -e.r*2.0, e.r*0.84, e.r*1.35);
      ctx.restore();

      drawSprite(SPR[key], 0, 0, 0, 1, PLANE_SCALE);
      if (hit) drawSprite(SPR[key + 'f'], 0, 0, 0, 0.85, PLANE_SCALE);

      // 체력이 깎이면 테두리 호로 표시
      if (e.hp < e.maxHp){
        ctx.globalAlpha = 0.75;
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.arc(0, 0, e.r*1.5, -Math.PI/2, -Math.PI/2 + TAU*(e.hp/e.maxHp));
        ctx.stroke();
      }
    }
    ctx.restore();
  }
}

const _sparkGroups = new Map();
function drawParts(){
  ctx.save();
  ctx.lineCap = 'round';
  _sparkGroups.clear();

  for (let i=0;i<MAX_PART;i++){
    const p = parts[i];
    if (!p.on) continue;
    const t = Math.max(0, p.life / p.max);

    if (p.kind === 'spark'){
      // 파티클마다 beginPath/stroke를 하면 비싸다 → 색상+굵기별로 모아 한 번에
      const key = p.col + '|' + (Math.round(p.size * 6.5) / 10);
      let arr = _sparkGroups.get(key);
      if (!arr){ arr = []; _sparkGroups.set(key, arr); }
      arr.push(p.x, p.y, p.x - p.vx * 2.6, p.y - p.vy * 2.6, t);

    } else if (p.kind === 'smoke'){
      const r = p.size * (1 + (1 - t) * 2.0);
      ctx.globalAlpha = t * t * 0.55;
      ctx.drawImage(SPR.smoke.canvas, p.x - r, p.y - r, r*2, r*2);

    } else if (p.kind === 'debris'){
      const r = p.size * 1.1;
      const c2 = Math.cos(p.rot), s2 = Math.sin(p.rot);
      ctx.globalAlpha = t;
      ctx.setTransform(c2*drawScale, s2*drawScale, -s2*drawScale, c2*drawScale,
                       p.x*drawScale + shakeX*drawScale, p.y*drawScale + shakeY*drawScale);
      ctx.drawImage(SPR.chip.canvas, -r, -r, r*2, r*2);
      ctx.setTransform(drawScale, 0, 0, drawScale, shakeX*drawScale, shakeY*drawScale);

    } else {
      ctx.globalAlpha = t * 0.9;
      ctx.fillStyle = p.col;
      ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
    }
  }

  // 모아둔 스파크를 그룹당 한 번씩만 stroke
  for (const [key, arr] of _sparkGroups){
    const bar = key.indexOf('|');
    ctx.strokeStyle = key.slice(0, bar);
    ctx.lineWidth = parseFloat(key.slice(bar + 1)) || 1;
    ctx.globalAlpha = 0.9;
    ctx.beginPath();
    for (let k = 0; k < arr.length; k += 5){
      ctx.moveTo(arr[k], arr[k+1]);
      ctx.lineTo(arr[k+2], arr[k+3]);
    }
    ctx.stroke();
  }
  ctx.restore();
}

function drawPlayer(){
  if (G.finished || G.spectating) return;   // 리절트·관전 중에는 자기를 숨김
  const blink = player.invuln > 0 && (frame % 8 < 4);

  // 트레일
  ctx.save();
  for (let i = player.trail.length-1; i >= 1; i--){
    const t = player.trail[i];
    ctx.globalAlpha = 0.10 * (1 - i/player.trail.length);
    ctx.fillStyle = C.player;
    ctx.beginPath(); ctx.arc(t.x, t.y, player.drawR*0.7, 0, TAU); ctx.fill();
  }
  ctx.restore();

  // 봄 충격파
  if (player.bombTime > 0){
    const p = (180 - player.bombTime) / 180;
    ctx.save();
    ctx.globalAlpha = (1-p) * 0.5;
    ctx.strokeStyle = C.player; ctx.lineWidth = 6 * (1-p) + 1;
    ctx.beginPath(); ctx.arc(player.x, player.y, 90 + p*420, 0, TAU); ctx.stroke();
    ctx.globalAlpha = (1-p) * 0.22;
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(player.x, player.y, 60 + p*330, 0, TAU); ctx.stroke();
    ctx.restore();
  }

  ctx.save();
  ctx.globalAlpha = blink ? 0.42 : 1;
  ctx.translate(player.x, player.y);

  // ── 뱅킹: 롤에 따라 기수를 살짝 틀고 주익 폭을 눌러 3D처럼 보이게
  ctx.save();
  ctx.rotate(player.bank * 0.20);
  ctx.scale(Math.cos(player.bank * 0.92), 1);

  // 옵션 포드 = 소형 무인기 (살짝 위아래로 흔들림)
  for (const p of podPositions()){
    const bob = Math.sin(frame*0.09 + p.tier*1.3 + (p.side>0?1.6:0)) * 1.6;
    drawSprite(SPR.pod, p.x, p.y + bob, 0, 0.95, PLAYER_SCALE);
  }

  // 애프터버너
  const ab = 1 + Math.sin(frame*0.5)*0.25;
  for (const ox of [-3.4*PLAYER_SCALE, 3.4*PLAYER_SCALE]){
    const len = 26 * ab * PLAYER_SCALE;
    const y0 = 21 * PLAYER_SCALE;
    const fg = ctx.createLinearGradient(0, y0, 0, y0 + len);
    fg.addColorStop(0,    'rgba(255,255,255,0.95)');
    fg.addColorStop(0.22, 'rgba(150,245,255,0.85)');
    fg.addColorStop(0.6,  'rgba(60,170,255,0.45)');
    fg.addColorStop(1,    'rgba(20,90,220,0)');
    ctx.fillStyle = fg;
    ctx.beginPath();
    const hw = 3.2 * PLAYER_SCALE;
    ctx.moveTo(ox-hw, y0); ctx.lineTo(ox+hw, y0); ctx.lineTo(ox, y0 + len);
    ctx.closePath(); ctx.fill();
  }

  // F-22 본체
  drawSprite(SPR.f22s[Net.isOnline() ? Net.mySlot : 0], 0, 0, 0, 1, PLAYER_SCALE);
  ctx.restore();   // ← 뱅킹 해제. 아래 판정/실드 표시는 항상 원형이어야 한다

  // 실드 링
  if (player.shield > 0){
    for (let i=0;i<player.shield;i++){
      const rr = 24 + i*5 + Math.sin(frame*0.08 + i)*1.5;
      ctx.globalAlpha = 0.55 - i*0.15;
      ctx.strokeStyle = C.itemShield; ctx.lineWidth = 1.6;
      ctx.setLineDash([7, 6]);
      ctx.save(); ctx.rotate(frame * (i%2 ? -0.02 : 0.024));
      ctx.beginPath(); ctx.arc(0, 0, rr, 0, TAU); ctx.stroke();
      ctx.restore();
    }
    ctx.setLineDash([]);
    ctx.globalAlpha = blink ? 0.42 : 1;
  }

  // 히트박스 표시 — 판정이 기체 크기만큼 커졌으므로 상시 표시한다
  ctx.save();
  ctx.globalAlpha = player.slow ? 0.95 : 0.42;
  ctx.strokeStyle = player.slow ? '#ff5c7a' : 'rgba(255,120,150,0.9)';
  ctx.lineWidth = player.slow ? 1.6 : 1;
  ctx.beginPath(); ctx.arc(0, 0, player.hitR, 0, TAU); ctx.stroke();
  if (player.slow){
    ctx.globalAlpha = 0.16; ctx.fillStyle = '#ff5c7a';
    ctx.beginPath(); ctx.arc(0, 0, player.hitR, 0, TAU); ctx.fill();
    ctx.globalAlpha = 0.7;
    ctx.rotate(frame*0.04);
    ctx.setLineDash([4,6]);
    ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(0,0, player.grazeR, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.restore();
  ctx.restore();
}

// 상대 기체 — 자기 기체와 구분되도록 주황 계열 틴트 + 이름표
function drawRemotes(){
  if (!Net.isOnline()) return;
  const now = performance.now();
  for (let i=0;i<MAX_PLAYERS;i++){
    if (i === Net.mySlot) continue;
    const r = Net.players[i];
    if (!r.present || r.spectating) continue;
    if (now - r.seen > 3000) continue;         // 오래 못 받았으면 숨김
    ctx.save();
    ctx.translate(r.x, r.y);
    ctx.save();
    ctx.rotate(r.bank * 0.20);
    ctx.scale(Math.cos(r.bank * 0.92), 1);
    const ab = 1 + Math.sin(frame*0.5)*0.25;
    for (const ox of [-3.4*PLAYER_SCALE, 3.4*PLAYER_SCALE]){
      const len = 24 * ab * PLAYER_SCALE, y0 = 21 * PLAYER_SCALE;
      const fg = ctx.createLinearGradient(0, y0, 0, y0 + len);
      fg.addColorStop(0, 'rgba(255,255,255,0.9)');
      fg.addColorStop(0.25, SLOT_EDGE[i]);
      fg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = fg;
      const hw = 3.0 * PLAYER_SCALE;
      ctx.beginPath();
      ctx.moveTo(ox-hw, y0); ctx.lineTo(ox+hw, y0); ctx.lineTo(ox, y0+len);
      ctx.closePath(); ctx.fill();
    }
    ctx.globalAlpha = r.invuln ? 0.5 : 1;
    drawSprite(SPR.f22s[i], 0, 0, 0, 1, PLAYER_SCALE);
    ctx.restore();

    ctx.globalAlpha = 0.9;
    ctx.fillStyle = SLOT_COLOR[i];
    ctx.font = 'bold 8px Menlo, monospace';
    ctx.textAlign = 'center';
    ctx.fillText(SLOT_LABEL[i], 0, -22);
    if (r.shield > 0){
      ctx.globalAlpha = 0.4;
      ctx.strokeStyle = C.itemShield; ctx.lineWidth = 1.4;
      ctx.setLineDash([6,6]);
      ctx.beginPath(); ctx.arc(0, 0, 22, 0, TAU); ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.restore();
  }
}

// 클라이언트: 스냅샷으로 받은 월드를 그린다
function drawNetWorld(){
  drawNetItems();
  drawNetEnemies();
  drawNetBullets();
}

function drawNetItems(){
  for (let i=0;i<NetWorld.items.length;i++){
    const it = NetWorld.items[i];
    if (it._got) continue;
    const spr = (it.kind === 'power') ? SPR.power
              : (it.kind === 'score') ? SPR.item : SPR[it.kind];
    drawSprite(spr || SPR.item, it.x, it.y, 0, 1, 1);
  }
}

function drawNetEnemies(){
  for (let i=0;i<NetWorld.enemies.length;i++){
    const e = NetWorld.enemies[i];
    if (e.type === 'midboss'){
      ctx.save(); ctx.translate(e.x, e.y);
      const g = ctx.createRadialGradient(0,0,2, 0,0, 22);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(0.55, 'rgba(255,154,213,0.85)');
      g.addColorStop(1, 'rgba(255,47,208,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0,0,22,0,TAU); ctx.fill();
      ctx.restore();
    } else {
      const key = MIG_OF[e.type];
      ctx.save(); ctx.translate(e.x, e.y);
      drawSprite(SPR[key], 0, 0, 0, 1, PLANE_SCALE);
      ctx.restore();
    }
  }
}

function drawNetBullets(){
  ctx.save();
  ctx.beginPath(); ctx.rect(PF.x-30, PF.y-30, PF.w+60, PF.h+60); ctx.clip();
  const sx = shakeX * drawScale, sy = shakeY * drawScale;
  for (let i=0;i<NetWorld.bullets.length;i++){
    const b = NetWorld.bullets[i];
    const spr = SPR[b.kind];
    if (!spr) continue;
    if (b.kind === 'burst'){
      ctx.drawImage(spr.canvas, b.x - spr.half, b.y - spr.half, spr.half*2, spr.half*2);
    } else {
      const c2 = Math.cos(b.rot)*drawScale, s2 = Math.sin(b.rot)*drawScale;
      ctx.setTransform(c2, s2, -s2, c2, b.x*drawScale + sx, b.y*drawScale + sy);
      ctx.drawImage(spr.canvas, -spr.half, -spr.half, spr.half*2, spr.half*2);
      ctx.setTransform(drawScale, 0, 0, drawScale, sx, sy);
    }
  }
  ctx.restore();
}

function drawBoss(){
  if (G.mode === 'STAGE') return;
  const b = G.boss;
  const netClient = Net.isOnline() && !Net.isHost();
  if (!netClient && !b.alive && b.deadTimer <= 0) return;
  if (netClient && !NetWorld.boss.alive) return;
  ctx.save();
  ctx.translate(b.x, b.y);
  const alive = b.alive ? 1 : Math.max(0, b.deadTimer/110);
  ctx.globalAlpha = alive;

  // 회전 링 3겹
  const rings = [[46, 0.013, C.eRing], [34, -0.021, C.eLaser], [58, 0.008, '#00f0ff']];
  for (const [rad, spd2, col] of rings){
    ctx.save();
    ctx.rotate(b.t * spd2);
    ctx.strokeStyle = col; ctx.globalAlpha = alive * 0.55; ctx.lineWidth = 2;
    ctx.setLineDash([12, 9]);
    ctx.beginPath(); ctx.arc(0,0, rad, 0, TAU); ctx.stroke();
    ctx.restore();
  }
  ctx.setLineDash([]);

  // 코어
  const pulse = 1 + Math.sin(b.t*0.06)*0.08;
  const g = ctx.createRadialGradient(0,0,2, 0,0, 30*pulse);
  g.addColorStop(0, '#ffffff');
  g.addColorStop(0.4, 'rgba(255,255,255,0.85)');
  g.addColorStop(0.75, 'rgba(255,47,208,0.55)');
  g.addColorStop(1, 'rgba(255,47,208,0)');
  ctx.globalAlpha = alive;
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0,0, 30*pulse, 0, TAU); ctx.fill();

  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(0,0, 11*pulse, 0, TAU); ctx.fill();
  ctx.restore();
}

function fmt(n){ return Math.floor(n).toLocaleString('en-US'); }

function drawPowerGauge(cx, cy){
  const lv = powerLv();
  const segW = 15, segH = 7, gap = 3;
  const total = POWER_MAX * segW + (POWER_MAX-1) * gap;
  const x0 = cx - total/2;
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '9px Menlo, monospace';
  ctx.fillStyle = C.dim;
  ctx.fillText('POWER', cx, cy - 11);
  for (let i=0;i<POWER_MAX;i++){
    const x = x0 + i*(segW+gap);
    const fill = Math.max(0, Math.min(1, player.power - i));
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    ctx.fillRect(x, cy, segW, segH);
    if (fill > 0){
      ctx.fillStyle = (lv >= POWER_MAX) ? '#ffe66d' : '#ff4d6d';
      ctx.fillRect(x, cy, segW*fill, segH);
    }
  }
  ctx.font = 'bold 10px Menlo, monospace';
  ctx.fillStyle = (lv >= POWER_MAX) ? '#ffe66d' : C.text;
  ctx.fillText(lv >= POWER_MAX ? 'MAX' : ('Lv.' + lv), cx + total/2 + 20, cy + segH/2);
  ctx.restore();
}

function drawHUD(){
  // ── 상단

  ctx.fillStyle = 'rgba(3,5,14,0.92)';
  ctx.fillRect(0,0,LW,PF.y);
  ctx.fillStyle = 'rgba(0,240,255,0.18)';

  ctx.textBaseline = 'middle';
  ctx.fillStyle = C.dim; ctx.textAlign = 'left';
  ctx.fillText('SCORE', 48, 13);

  ctx.fillText(fmt(G.score), 48, 28);

  ctx.textAlign = 'right';
  ctx.font = '13px Menlo, monospace'; ctx.fillStyle = C.dim;
  ctx.fillText('GRAZE', LW-14, 13);
  ctx.fillStyle = G.grazeCombo > 0 ? '#ffffff' : C.text;
  ctx.font = 'bold 15px Menlo, monospace';
  ctx.fillText(fmt(G.graze), LW-14, 28);

  drawPowerGauge(240, 20);

  // 온라인: 동료 상태 요약 (최대 3명)
  if (Net.isOnline()){
    ctx.save();
    ctx.textAlign = 'right'; ctx.font = '9px Menlo, monospace';
    const now = performance.now();
    let cx = LW - 14;
    if (!Net.connected){
      ctx.fillStyle = '#ff6b6b';
      ctx.fillText('DISCONNECTED', cx, 40);
    } else {
      for (let k = MAX_PLAYERS - 1; k >= 0; k--){
        const p = Net.players[k];
        if (!p.present || k === Net.mySlot) continue;
        const stale = now - p.seen > 2000;
        const txt = p.spectating
          ? SLOT_LABEL[k] + ' DOWN'
          : SLOT_LABEL[k] + '♥' + Math.max(0, p.lives) + '·L' + Math.floor(p.power);
        ctx.fillStyle = p.spectating ? '#ff6b6b' : (stale ? '#ffd23d' : SLOT_COLOR[k]);
        ctx.fillText(txt, cx, 40);
        cx -= ctx.measureText(txt).width + 8;
      }
    }
    ctx.restore();
  }
  if (G.spectating){
    ctx.save();
    ctx.textAlign = 'center'; ctx.fillStyle = '#ff6b6b';
    ctx.font = 'bold 15px Menlo, monospace';
    ctx.fillText('SPECTATING — 다음 구간에 부활', LW/2, PF.y + PF.h/2);
    ctx.restore();
  }

  // 일시정지 버튼
  const pb = UI.pauseBtn;
  ctx.globalAlpha = 0.75;
  ctx.strokeStyle = C.dim; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(pb.x, pb.y, pb.r, 0, TAU); ctx.stroke();
  ctx.fillStyle = C.text;
  ctx.fillRect(pb.x-5, pb.y-6, 3.2, 12);
  ctx.fillRect(pb.x+2, pb.y-6, 3.2, 12);
  ctx.restore();

  // ── 스테이지 / 인터루드 구간: 진행 표시 + 중간보스 HP
  if (G.mode === 'STAGE' || G.mode === 'INTERLUDE'){
    ctx.save();
    const bx = 70, bw = LW-140, by = PF.y + 8;
    ctx.font = '10px Menlo, monospace'; ctx.textAlign = 'left';
    ctx.fillStyle = G.mode === 'INTERLUDE' ? '#ffd23d' : C.dim;
    // 클라이언트는 G.interlude 를 직접 돌리지 않는다(호스트 권위) — 없으면 이름만 표시
    const nx = (G.interlude && SPELLS[G.interlude.idx + 1]) ? SPELLS[G.interlude.idx + 1].sub : null;
    ctx.fillText(G.mode === 'INTERLUDE'
      ? (G.stage.waveName + (nx ? ('   —   NEXT: ' + nx) : ''))
      : (G.stage.label + '   ' + G.stage.waveName), bx, by + 4);
    const mb = G.stage.midboss;
    if (mb && mb.on){
      const bh = 4;
      ctx.fillStyle = 'rgba(255,255,255,0.10)';
      ctx.fillRect(bx, by + 12, bw, bh);
      const g = ctx.createLinearGradient(bx,0,bx+bw,0);
      g.addColorStop(0, '#c77dff'); g.addColorStop(1, '#ff9ad5');
      ctx.fillStyle = g;
      ctx.fillRect(bx, by + 12, bw * Math.max(0, mb.hp/mb.maxHp), bh);
    }
    ctx.textAlign = 'right'; ctx.fillStyle = C.dim;
    ctx.fillText('ENEMY ' + liveEnemies(), bx + bw, by + 4);
    ctx.restore();
  }

  // ── 보스 HP 바
  if (G.mode === 'BOSS' && G.boss.alive){
    const bx = 70, bw = LW-140, by = PF.y + 8, bh = 5;
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    ctx.fillRect(bx, by, bw, bh);
    const ratio = Math.max(0, G.phaseHP / G.phaseHPMax);
    const g = ctx.createLinearGradient(bx,0,bx+bw,0);
    g.addColorStop(0, '#ff2fd0'); g.addColorStop(1, '#00f0ff');
    ctx.fillStyle = g;
    ctx.fillRect(bx, by, bw * ratio, bh);
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.fillRect(bx + bw*ratio - 1.5, by-1, 2, bh+2);

    // 페이즈 도트
    for (let i=0;i<SPELLS.length;i++){
      const dx2 = bx + bw + 12 + i*11;
      ctx.beginPath(); ctx.arc(dx2, by+bh/2, 3.2, 0, TAU);
      ctx.fillStyle = i > G.phase ? 'rgba(255,255,255,0.22)' : '#ff2fd0';
      ctx.fill();
    }
    // 페이즈 타이머
    ctx.font = '11px Menlo, monospace'; ctx.textAlign = 'right';
    ctx.fillStyle = G.phaseTimer < 600 ? '#ff6b6b' : C.dim;
    ctx.fillText(String(Math.ceil(G.phaseTimer/60)).padStart(2,'0'), bx-8, by+3);
    ctx.textAlign = 'left';
    ctx.fillStyle = C.dim; ctx.font = '10px Menlo, monospace';
    ctx.fillText(SPELLS[G.phase].sub, bx, by + 16);
    ctx.restore();
  }

  // ── 하단
  const byTop = PF.y + PF.h;
  ctx.save();
  ctx.fillStyle = 'rgba(3,5,14,0.92)';
  ctx.fillRect(0, byTop, LW, LH-byTop);
  ctx.fillStyle = 'rgba(0,240,255,0.18)';
  ctx.fillRect(0, byTop, LW, 1);

  // 잔기 하트
  ctx.textBaseline = 'middle';
  ctx.font = '11px Menlo, monospace';
  ctx.fillStyle = C.dim; ctx.textAlign='left';
  ctx.fillText('LIFE', 14, byTop+13);
  for (let i=0;i<Math.max(0,G.lives);i++){
    const x = 16 + i*16, y = byTop + 29;
    ctx.fillStyle = '#ff5c8a';
    ctx.beginPath();
    ctx.moveTo(x, y+4);
    ctx.bezierCurveTo(x-6, y-2, x-2, y-7, x, y-3);
    ctx.bezierCurveTo(x+2, y-7, x+6, y-2, x, y+4);
    ctx.fill();
  }
  // 봄 별
  ctx.fillStyle = C.dim; ctx.fillText('BOMB', 130, byTop+13);
  for (let i=0;i<G.bombs;i++){
    const x = 134 + i*16, y = byTop + 27;
    ctx.fillStyle = '#ffe66d';
    ctx.beginPath();
    for (let k=0;k<10;k++){
      const a = -Math.PI/2 + k*Math.PI/5;
      const rr = (k%2===0) ? 6 : 2.6;
      k===0 ? ctx.moveTo(x+Math.cos(a)*rr, y+Math.sin(a)*rr)
            : ctx.lineTo(x+Math.cos(a)*rr, y+Math.sin(a)*rr);
    }
    ctx.closePath(); ctx.fill();
  }

  // 보조 아이템 상태 (실드 / 유도 미사일) — 하단 바 높이(40px) 안에 들어오도록 배치
  ctx.textAlign = 'left';
  ctx.font = '9px Menlo, monospace';
  ctx.fillStyle = player.shield > 0 ? C.itemShield : C.dim;
  ctx.fillText('S', 224, byTop+13);
  for (let i=0;i<player.shield;i++){
    const x = 240 + i*13, y = byTop + 13;
    ctx.strokeStyle = C.itemShield; ctx.lineWidth = 1.6; ctx.globalAlpha = 0.95;
    ctx.beginPath(); ctx.arc(x, y, 5, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 0.3; ctx.fillStyle = C.itemShield;
    ctx.beginPath(); ctx.arc(x, y, 5, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = player.homing > 0 ? C.itemHoming : C.dim;
  ctx.fillText('H', 224, byTop+30);
  ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(236, byTop+26, 46, 5);
  if (player.homing > 0){
    ctx.fillStyle = C.itemHoming;
    ctx.fillRect(236, byTop+26, 46 * Math.min(1, player.homing / (HOMING_TIME*2)), 5);
  }

  // 난이도 + 타이머
  ctx.textAlign = 'center';
  ctx.fillStyle = D.color; ctx.font = 'bold 11px Menlo, monospace';
  ctx.fillText(D.key.toUpperCase(), 322, byTop+13);
  const sec = Math.floor(G.totalFrames/60);
  ctx.fillStyle = C.dim; ctx.font = '12px Menlo, monospace';
  ctx.fillText(String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0'), 322, byTop+30);

  // 봄 버튼
  const bb = UI.bombBtn;
  ctx.globalAlpha = G.bombs>0 ? 1 : 0.28;
  const bg2 = ctx.createRadialGradient(bb.x,bb.y,2,bb.x,bb.y,bb.r);
  bg2.addColorStop(0,'rgba(255,230,109,0.30)');
  bg2.addColorStop(1,'rgba(255,230,109,0.02)');
  ctx.fillStyle = bg2;
  ctx.beginPath(); ctx.arc(bb.x,bb.y,bb.r,0,TAU); ctx.fill();
  ctx.strokeStyle = '#ffe66d'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(bb.x,bb.y,bb.r,0,TAU); ctx.stroke();
  ctx.fillStyle = '#ffe66d'; ctx.font='bold 12px Menlo, monospace'; ctx.textAlign='center';
  ctx.fillText('BOMB', bb.x, bb.y-4);
  ctx.font='bold 13px Menlo, monospace';
  ctx.fillText('×'+G.bombs, bb.x, bb.y+9);
  ctx.restore();
}

/* ── 블룸 (화면 전체 후처리) ──────────────────────────────
   렌더된 프레임을 1/3로 축소 → 블러 → lighter로 다시 얹는다.
   배경이 어둡고 오브젝트가 밝아서 별도 bright-pass 없이도 밝은 부분만 번진다.
   HUD 전에 호출해야 UI 글자가 번지지 않는다. */
let glowA = null, glowActx = null, glowB = null, glowBctx = null;
let BLOOM_STRENGTH = 0.55;
const BLOOM_A = 4, BLOOM_B = 8;   // 1/4 → 1/8 축소 단계
/* 메인 캔버스를 되읽으면(drawImage(cv,...)) GPU 텍스처 리드백이 걸려 매우 느리다
   (실측: 200탄 60 → 21 FPS). 대신 발광 오브젝트만 1/4 크기 캔버스에 다시 그린다.
   면적이 1/16이라 재렌더 비용이 싸고, 배경이 번지지 않아 그림도 더 깨끗하다. */
function applyBloom(){
  if (BLOOM_STRENGTH <= 0) return;
  const wA = Math.max(1, Math.round(cv.width / BLOOM_A)), hA = Math.max(1, Math.round(cv.height / BLOOM_A));
  const wB = Math.max(1, Math.round(cv.width / BLOOM_B)), hB = Math.max(1, Math.round(cv.height / BLOOM_B));
  if (!glowA){
    glowA = document.createElement('canvas'); glowActx = glowA.getContext('2d');
    glowB = document.createElement('canvas'); glowBctx = glowB.getContext('2d');
  }
  if (glowA.width !== wA || glowA.height !== hA){ glowA.width = wA; glowA.height = hA; }
  if (glowB.width !== wB || glowB.height !== hB){ glowB.width = wB; glowB.height = hB; }

  // ── 발광 패스: ctx를 잠시 축소 캔버스로 바꿔 같은 draw 함수를 재사용
  const gs = wA / LW;
  glowActx.setTransform(1,0,0,1,0,0);
  glowActx.clearRect(0,0,wA,hA);
  const prevCtx = ctx, prevScale = drawScale;
  ctx = glowActx; drawScale = gs;
  ctx.setTransform(gs, 0, 0, gs, shakeX*gs, shakeY*gs);
  if (G && state !== S.TITLE && state !== S.MODE && state !== S.LOBBY){
    // 호스트는 글로우 버퍼에 자탄+적탄만 넣는다. 게스트도 똑같이 맞춘다.
    // 예전에는 게스트만 drawNetWorld() 전체를 넣어서 적·아이템에 글로우가 한 겹 더 얹혔고
    // (게스트 화면만 색이 밝게 보이는 원인) 그 전부를 프레임당 2번 그렸다.
    if (Net.isOnline() && !Net.isHost()){ drawNetBullets(); drawPShots(); }
    else { drawPShots(); drawBullets(); }
    drawParts();
    drawRings();
  }
  ctx = prevCtx; drawScale = prevScale;

  // ── 1/8로 한 번 더 줄여 번짐 폭 확보 (양선형 보간이 블러 역할)
  glowBctx.setTransform(1,0,0,1,0,0);
  glowBctx.clearRect(0,0,wB,hB);
  glowBctx.drawImage(glowA, 0, 0, wB, hB);

  ctx.save();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = BLOOM_STRENGTH;
  ctx.drawImage(glowB, 0, 0, cv.width, cv.height);
  ctx.globalAlpha = BLOOM_STRENGTH * 0.5;
  ctx.drawImage(glowA, 0, 0, cv.width, cv.height);   // 코어 쪽 타이트한 글로우
  ctx.restore();
}

function drawOverlayFX(){
  if (vignette > 0.01){

    g.addColorStop(0, 'rgba(255,0,60,0)');
    g.addColorStop(1, 'rgba(255,0,60,'+(vignette*0.55).toFixed(3)+')');

    ctx.save();
    ctx.globalAlpha = flash * 0.5;
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,LW,LH);
    ctx.restore();
  }
}

const uiBtns = [];   // {x,y,w,h,id}
// 긴 안내문을 폭에 맞춰 줄바꿈해서 그린다 (연결 실패 안내가 화면 밖으로 나가지 않게)
function drawWrap(text, cx, y, maxW, lineH){
  const words = String(text).split(' ');
  let line = '', n = 0;
  for (let i=0;i<words.length;i++){
    const t = line ? (line + ' ' + words[i]) : words[i];
    if (ctx.measureText(t).width > maxW && line){
      ctx.fillText(line, cx, y + n*lineH); n++; line = words[i];
    } else line = t;
  }
  if (line) ctx.fillText(line, cx, y + n*lineH);
  return n + 1;
}

function btn(x, y, w, h, id, label, sub, on, col){
  uiBtns.push({ x, y, w, h, id });

  ctx.strokeStyle = on ? (col || C.player) : 'rgba(255,255,255,0.18)';
  ctx.lineWidth = on ? 2 : 1;
  ctx.strokeRect(x, y, w, h);
  ctx.shadowBlur = 0;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = on ? (col || C.player) : C.text;

  ctx.fillText(label, x + w/2, y + (sub ? h/2 - 8 : h/2));

}

/* 릴레이 주소 결정
   - server.js 가 서빙하면 자기 오리진의 /ws 를 쓴다 (참가자는 주소만 열면 끝)
   - 다른 곳에 올린 파일이면 ?ws=wss://주소/ws 로 직접 지정 */
const wsRelayUrl = (function(){
  if (typeof location === 'undefined') return '';
  const m = /[?&]ws=([^&]+)/.exec(location.search);
  // 서브경로로 서빙될 수도 있다 (nginx 로 /neotone/ 아래에 붙이는 경우).
  // 그래서 현재 페이지의 디렉터리를 기준으로 /ws 를 붙인다.
  const auto = () => {
    const dir = location.pathname.replace(/[^/]*$/, '');      // /neotone/index.html → /neotone/
    return (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + dir + 'ws';
  };
  if (m){
    const u = decodeURIComponent(m[1]);
    return (u === '1' || u === 'auto') ? auto() : u;
  }
  if (typeof window !== 'undefined' && window.__NEOTONE_WS) return auto();
  return '';
})();
let netTransportKind = (typeof location !== 'undefined' &&
  /[?&]net=bc/.test(location.search)) ? 'bc' : (wsRelayUrl ? 'ws' : 'peer');
let joinCode = '';       // 참가 코드 입력 버퍼
let lobbyRole = '';      // 'host' | 'client'

/* ═══════════════════════════════════════════════════
   메인 루프
   ═══════════════════════════════════════════════════ */
function uiHit(tap){
  if (!tap) return null;
  for (const b of uiBtns){
    if (tap.x >= b.x && tap.x <= b.x+b.w && tap.y >= b.y && tap.y <= b.y+b.h) return b.id;
  }
  return null;
}

function handleStateInput(){
  if (Input.wasPressed('MUTE')) { Sound.toggleMute(); Sound.ui(); }

  // ── 모드 선택
  if (state === S.MODE){
    const id = uiHit(Input.consumeUiTap());
    if (id === 'solo'){ Net.close(); state = S.TITLE; Sound.ui(); }
    else if (id === 'host'){
      lobbyRole = 'host';
      Net.start('host', makeRoomCode(), netTransportKind);
      state = S.LOBBY; Sound.ui();
    }
    else if (id === 'join'){ lobbyRole = 'joininput'; joinCode = ''; Net.error=''; state = S.LOBBY; Sound.ui(); }
    else if (id === 'back'){ state = S.TITLE; Sound.ui(); }
    return;
  }

  // ── 대기실 (코드 입력 포함)
  if (state === S.LOBBY){
    const tap = Input.consumeUiTap();
    const id = uiHit(tap);
    if (lobbyRole === 'joininput'){
      if ((id === 'joingo' || Input.wasPressed('OK')) && joinCode.length === 4){
        lobbyRole = 'client';
        Net.start('client', joinCode, netTransportKind);
        Sound.ui();
      } else if (id === 'back'){ Net.close(); state = S.MODE; Sound.ui(); }
      return;
    }
    if (id && !id.startsWith('kick')) kickArm = { slot: -1, until: 0 };
    if (id === 'ready' || Input.wasPressed('SHOT')){
      const me = Net.players[Net.mySlot];
      me.ready = !me.ready;
      if (Net.isHost()) Net.broadcastLobby(); else Net.sendUp({ t:'ready', v: me.ready });
      Sound.ui();
    } else if (id === 'start' || (Input.wasPressed('OK') && Net.isHost())){
      if (Net.isHost() && Net.allReady()){
        Net.sendAll({ t:'start', diff: D.key });
        newRun(); state = S.PLAY; Sound.ui();
      }
    } else if (id === 'back'){ Net.close(); state = S.MODE; Sound.ui(); }
    else if (id && id.startsWith('kick') && Net.isHost()){
      const k = parseInt(id.slice(4), 10);
      const now = performance.now();
      if (kickArm.slot === k && now < kickArm.until){
        kickArm = { slot: -1, until: 0 };
        if (Net.kick(k)) Sound.hit();
      } else {
        kickArm = { slot: k, until: now + 2000 };   // 한 번 더 눌러야 실행
        Sound.ui();
      }
    }
    else if (id && id.startsWith('diff') && Net.isHost()){
      diffIdx = parseInt(id.slice(4), 10); D = DIFF_LIST[diffIdx];
      Net.sendAll({ t:'diff', v: D.key }); Sound.ui();
    }
    if (Net.isHost()){
      if (Input.wasPressed('L')){ diffIdx = (diffIdx+2)%3; D = DIFF_LIST[diffIdx]; Net.sendAll({t:'diff',v:D.key}); Sound.ui(); }
      if (Input.wasPressed('R')){ diffIdx = (diffIdx+1)%3; D = DIFF_LIST[diffIdx]; Net.sendAll({t:'diff',v:D.key}); Sound.ui(); }
    }
    if (Input.wasPressed('PAUSE')){ Net.close(); state = S.MODE; Sound.ui(); }
    return;
  }

  if (state === S.TITLE){
    if (Input.wasPressed('L')) { diffIdx = (diffIdx+2)%3; Sound.ui(); }
    if (Input.wasPressed('R')) { diffIdx = (diffIdx+1)%3; Sound.ui(); }
    const tap = Input.consumeUiTap();
    let started = false;
    if (tap){
      let hitBtn = false;
      for (const b of titleBtns){
        if (tap.x>=b.x && tap.x<=b.x+b.w && tap.y>=b.y && tap.y<=b.y+b.h){
          if (diffIdx === b.idx) started = true;
          diffIdx = b.idx; Sound.ui(); hitBtn = true;
        }
      }
      if (!hitBtn) started = true;
    }
    if (tap && tap.y >= 596 && tap.y <= 632 && tap.x >= 118 && tap.x <= 362){
      Net.error = ''; state = S.MODE; Sound.ui(); return;
    }
    if (Input.wasPressed('MODE_KEY')){ Net.error=''; state = S.MODE; Sound.ui(); return; }
    if (Input.wasPressed('SHOT') || Input.wasPressed('OK') || started){
      D = DIFF_LIST[diffIdx];
      Net.close();
      newRun();
      state = S.PLAY;
      Sound.ui();
    }
    return;
  }

  if (state === S.PLAY){
    if (Input.wasPressed('PAUSE')){ state = S.PAUSE; Sound.ui(); Input.consumeUiTap(); }
    return;
  }

  if (state === S.PAUSE){
    Input.consumeUiTap();
    if (Input.wasPressed('PAUSE') || Input.tapAnywhere){ state = S.PLAY; Sound.ui(); }
    if (Input.wasPressed('RETRY')){ newRun(); state = S.PLAY; Sound.ui(); }
    return;
  }

  if (state === S.GAMEOVER || state === S.CLEAR){
    Input.consumeUiTap();
    if (Net.isOnline()){
      // 온라인 협동은 각자 리트라이하면 어긋나므로 대기실로 돌아간다
      if (Input.wasPressed('RETRY') || Input.wasPressed('SHOT') ||
          Input.wasPressed('OK') || Input.wasPressed('PAUSE') || Input.tapAnywhere){
        Net.players.forEach(p => p.ready = false);
        if (Net.isHost()) Net.broadcastLobby(); else Net.sendUp({ t:'ready', v:false });
        state = S.LOBBY; Sound.ui();
      }
      return;
    }
    if (Input.wasPressed('RETRY') || Input.wasPressed('SHOT') ||
        Input.wasPressed('OK') || Input.tapAnywhere){
      newRun(); state = S.PLAY; Sound.ui();
    } else if (Input.wasPressed('PAUSE')){
      state = S.TITLE; Sound.ui();
    }
    return;
  }
}

// 성능 자동 조정
let fpsSamples = [], lastPerfCheck = 0;
function perfAdjust(now){
  if (now - lastPerfCheck < 1000) return;
  lastPerfCheck = now;
  if (fpsSamples.length < 10) return;
  const avg = fpsSamples.reduce((a,b)=>a+b,0)/fpsSamples.length;
  fpsSamples.length = 0;
  if (avg < 55){
    if (partQuality > 0.3) partQuality = Math.max(0.3, partQuality - 0.2);
    else if (BLOOM_STRENGTH > 0) BLOOM_STRENGTH = 0;   // 그래도 느리면 블룸을 끈다
  } else if (avg > 58){
    if (BLOOM_STRENGTH === 0) BLOOM_STRENGTH = 0.55;
    else if (partQuality < 1) partQuality = Math.min(1, partQuality + 0.2);
  }
}

let acc = 0, last = 0;
function loop(now){
  requestAnimationFrame(loop);
  if (!last) last = now;
  let dt = now - last; last = now;
  if (dt > 200) dt = 200;                 // 탭 전환 등으로 인한 폭주 방지
  fpsSamples.push(1000 / Math.max(1, dt));
  if (fpsSamples.length > 60) fpsSamples.shift();
  perfAdjust(now);

  acc += dt;
  let steps = 0;
  while (acc >= FIXED_DT && steps < 5){    // 고정 타임스텝 — 판정은 항상 프레임 단위
    acc -= FIXED_DT;
    steps++;
    frame++;
    handleStateInput();
    if (state === S.PLAY) updatePlay();
    else {
      if (shake > 0) shake *= 0.88;
      if (flash > 0) flash *= 0.86;
      if (vignette > 0) vignette *= 0.94;
      if (state === S.GAMEOVER || state === S.CLEAR){ updateParts(); updateRings(); }
    }
    Input.clearEdge();
  }

  // ── 렌더
  ctx.setTransform(renderScale, 0, 0, renderScale, 0, 0);
  shakeX = (Math.random()-0.5) * shake;
  shakeY = (Math.random()-0.5) * shake;

  if (state === S.TITLE){
    drawTitle(frame);
  } else if (state === S.MODE){
    drawModeSelect(frame);
  } else if (state === S.LOBBY){
    if (Net.isOnline() && !Net.isHost() && !Net.connected) lobbyWait++; else lobbyWait = 0;
    if (lobbyRole === 'joininput') drawJoinInput(frame); else drawLobby(frame);
  } else {
    ctx.save();
    ctx.translate(shakeX, shakeY);
    drawBackground(frame);
    const netClient = Net.isOnline() && !Net.isHost();
    if (netClient){
      drawNetWorld();
      drawBoss();
      drawParts();
      drawRings();
      drawPShots();      // ★ 빠져 있었다 — 클라이언트 화면에 자탄이 아예 안 그려졌다
      drawRemotes();
      drawPlayer();
    } else {
      drawItems();
      drawEnemies();
      drawBoss();
      drawParts();
      drawRings();
      drawPShots();
      drawRemotes();
      drawPlayer();
      drawBullets();
    }
    ctx.restore();
    applyBloom();                                   // ← HUD 전에 후처리
    ctx.setTransform(renderScale, 0, 0, renderScale, 0, 0);
    drawOverlayFX();
    drawHUD();
    drawBanner();
    if (state === S.PAUSE) drawPause();
    if (state === S.GAMEOVER) drawResult(false);
    if (state === S.CLEAR) drawResult(true);
  }
}

/* ═══════════════════════════════════════════════════
   부팅
   ═══════════════════════════════════════════════════ */
resize();
bakeAll();
// 자동 테스트용: ?net=bc&host=CODE / ?net=bc&join=CODE 로 즉시 방 진입
(function autoRoom(){
  if (typeof location === 'undefined') return;
  const mh = /[?&]host=([A-Za-z0-9]{1,8})/.exec(location.search);
  const mj = /[?&]join=([A-Za-z0-9]{1,8})/.exec(location.search);
  if (mh){ lobbyRole = 'host'; Net.start('host', mh[1].toUpperCase(), netTransportKind); state = S.LOBBY; }
  else if (mj){ lobbyRole = 'client'; Net.start('client', mj[1].toUpperCase(), netTransportKind); state = S.LOBBY; }
})();
requestAnimationFrame(loop);

// 디버그 훅 (자동 테스트용)
window.__game = {
  get state(){ return state; },
  set state(v){ state = v; },
  get G(){ return G; },
  get player(){ return player; },
  get bulletCount(){ return bulletCount; },
  get enemyCount(){ return liveEnemies(); },
  get power(){ return player.power; },
  set power(v){ player.power = v; },
  start(diff){ D = DIFF[diff] || DIFF.Normal; diffIdx = DIFF_LIST.indexOf(D); newRun(); state = S.PLAY; },
  jumpPhase(i){ if (!G) return; if (G.mode !== 'BOSS'){ G.mode='BOSS'; G.stage.done=true; clearEnemies(); } startPhase(i); },
  skipToBoss(){ if (G && G.mode === 'STAGE'){ G.stage.done = true; updateStage(); } },
  // 자동 테스트용 회피 AI — 근처 탄에서 밀려나며 목표 x로 이동
  autoDodge(targetX){
    if (!G || state !== S.PLAY) return 0;
    const R = 120, R2 = R*R;
    let fx = 0, fy = 0, danger = 0, near = 0;
    for (let i=0;i<active.length;i++){
      const b = active[i];
      if (!b.on) continue;
      const dx = player.x - b.x, dy = player.y - b.y;
      const d2 = dx*dx + dy*dy;
      if (d2 > R2) continue;
      const d = Math.sqrt(d2) || 1;
      const w = (R - d) / R;
      fx += dx/d * w * w; fy += dy/d * w * w;
      near++;
      if (d < player.hitR + 26) danger += 1;
    }
    // 목표 x 추적 + 화면 아래쪽 유지
    const tx = (targetX === undefined) ? player.x : targetX;
    fx += (tx - player.x) * 0.010;
    fy += ((PF.y + PF.h - 95) - player.y) * 0.010;
    // 벽에서 밀어내기 (구석에 몰리면 죽는다)
    const m = 70;
    if (player.x < PF.x + m) fx += (PF.x + m - player.x) * 0.05;
    if (player.x > PF.x + PF.w - m) fx -= (player.x - (PF.x + PF.w - m)) * 0.05;
    if (player.y < PF.y + 150) fy += (PF.y + 150 - player.y) * 0.04;
    if (player.y > PF.y + PF.h - 40) fy -= (player.y - (PF.y + PF.h - 40)) * 0.05;

    const mag = Math.hypot(fx, fy) || 1;
    const spd = near > 0 ? 4.6 : 5.0;
    player.x += fx/mag * spd;
    player.y += fy/mag * spd;
    player.x = Math.max(PF.x+10, Math.min(PF.x+PF.w-10, player.x));
    player.y = Math.max(PF.y+10, Math.min(PF.y+PF.h-10, player.y));
    player.slow = near > 3;
    // 위험하면 봄 사용 (사람과 비슷하게)
    if (danger >= 3 && G.bombs > 0 && player.bombTime <= 0 && player.invuln <= 0){
      Input.pressed.BOMB = true;
    }
    return danger;
  },
  aimTarget(){                 // 자동 테스트용: 지금 때려야 할 대상
    if (!G) return null;
    if (G.mode === 'BOSS' && G.boss.alive) return { x: G.boss.x, y: G.boss.y };
    let best = null, bestY = -1e9;
    // 온라인 클라이언트는 월드가 로컬에 없다 — 호스트가 보내준 NetWorld를 본다
    if (Net.isOnline() && !Net.isHost()){
      for (let i=0;i<NetWorld.enemies.length;i++){
        const e = NetWorld.enemies[i];
        if (e.y > bestY){ bestY = e.y; best = e; }
      }
    } else {
      for (let i=0;i<MAX_ENEMY;i++){
        const e = enemies[i];
        if (e.on && e.y > bestY){ bestY = e.y; best = e; }
      }
    }
    return best ? { x: best.x, y: best.y } : null;
  },
  nearestPower(){              // 자동 테스트용: 가장 가까운 파워 아이템
    let best = null, bd = 1e9;
    if (Net.isOnline() && !Net.isHost()){
      for (let i=0;i<NetWorld.items.length;i++){
        const it = NetWorld.items[i];
        if (it.kind !== 'power') continue;
        const d = Math.hypot(it.x-player.x, it.y-player.y);
        if (d < bd){ bd = d; best = it; }
      }
    } else {
      for (let i=0;i<MAX_ITEM;i++){
        const it = items[i];
        if (!it.on || it.kind !== 'power') continue;
        const d = Math.hypot(it.x-player.x, it.y-player.y);
        if (d < bd){ bd = d; best = it; }
      }
    }
    return best ? { x: best.x, y: best.y } : null;
  },
  kill(){ if (G) doDeath(); },
  bomb(){ Input.pressed.BOMB = true; },
  hurtBoss(n){ if (G) damageBoss(n); },
  get net(){ return { mode: Net.mode, room: Net.room, connected: Net.connected,
                      mySlot: Net.mySlot, presentCount: Net.presentCount(), allReady: Net.allReady(),
                      myReady: Net.me() ? Net.me().ready : false,
                      status: Net.status, error: Net.error, lobbyRole,
                      kickArm: kickArm.slot,
                      ice: (Net.tp && Net.tp.ice) || '', hasTurn: hasTurn(),
                      transport: (Net.tp && Net.tp.kind) || '', relay: wsRelayUrl,
                      players: Net.players.map(p => ({ slot: p.slot, present: p.present, ready: p.ready,
                                x: Math.round(p.x), y: Math.round(p.y),
                                lives: p.lives, power: +p.power.toFixed(2),
                                spectating: p.spectating })),
                      world: { bullets: NetWorld.bullets.length, enemies: NetWorld.enemies.length,
                               items: NetWorld.items.length, mode: NetWorld.mode, phase: NetWorld.phase } }; },
  uiTap(id){ for (const b of uiBtns) if (b.id === id){ Input.uiTap = { x: b.x + b.w/2, y: b.y + b.h/2 }; return true; } return false; },
  get screen(){ return state + (state === S.LOBBY ? ':' + lobbyRole : ''); },
  setBloom(v){ BLOOM_STRENGTH = v; },
  setPartQuality(v){ partQuality = v; },
  get partQualityNow(){ return partQuality; },
  get fps(){ if (!fpsSamples.length) return 0; return fpsSamples.reduce((a,b)=>a+b,0)/fpsSamples.length; },
  get pshotCount(){ let n=0; for (let i=0;i<MAX_PSHOT;i++) if (pshots[i].on) n++; return n; },
  get partCount(){ let n=0; for (let i=0;i<MAX_PART;i++) if (parts[i].on) n++; return n; },
  get bloom(){ return BLOOM_STRENGTH; },
  stress(n){   // 성능 측정용: 화면 안을 도는 탄을 n개 강제 생성
    for (let i=0;i<n;i++){
      const a = Math.random()*TAU;
      const b = spawnBullet(PF.x+20+Math.random()*(PF.w-40), PF.y+20+Math.random()*(PF.h-40),
                            a, 0.35, i%3===0 ? 'aim' : (i%3===1 ? 'ring' : 'burst'));
      if (b) b.life = -100000;
    }
    return bulletCount;
  },
};

})();
