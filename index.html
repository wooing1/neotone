    g.lineTo(s*hw, tail);
    g.closePath(); g.fill();
  }
  // 몸통 + 노즈콘
  g.beginPath();
  g.moveTo(0, nose);
  g.lineTo(hw, nose + h*0.26);
  g.lineTo(hw, tail);
  g.lineTo(-hw, tail);
  g.lineTo(-hw, nose + h*0.26);
  g.closePath(); g.fill();
  // 흰 코어 — 판정 위치를 명확히 (가독성 원칙)
  g.fillStyle = 'rgba(255,255,255,0.95)';
  g.beginPath(); g.arc(0, 0, hw*0.62, 0, TAU); g.fill();
  return { canvas:c, half:S/2 };
}

/* ── 아이템 배지 — 탄이 아니라 UI 픽업으로 읽히게 각지고 테두리 있는 형태 ── */
function bakeBadge(color, glyph, r){
  const S = Math.ceil(r*5);
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  const cx = S/2;
  g.translate(cx, cx);
  const gl = g.createRadialGradient(0,0,r*0.3, 0,0,r*2.3);
  gl.addColorStop(0, color); gl.addColorStop(0.4, color);
  gl.addColorStop(1, 'rgba(0,0,0,0)');
  g.globalAlpha = 0.42; g.fillStyle = gl;
  g.beginPath(); g.arc(0,0,r*2.3,0,TAU); g.fill();
  g.globalAlpha = 1;

  const rr = (x,y,w,h,rad) => {
    g.beginPath();
    if (g.roundRect) g.roundRect(x,y,w,h,rad); else g.rect(x,y,w,h);
  };
  rr(-r, -r, r*2, r*2, r*0.42);
  g.fillStyle = color; g.fill();
  g.strokeStyle = 'rgba(255,255,255,0.95)'; g.lineWidth = Math.max(1.2, r*0.22); g.stroke();
  // 안쪽 어두운 판 → 글자 대비 확보
  rr(-r*0.68, -r*0.68, r*1.36, r*1.36, r*0.28);
  g.fillStyle = 'rgba(10,26,20,0.55)'; g.fill();

  g.fillStyle = '#ffffff';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = 'bold ' + Math.round(r*1.25) + 'px Menlo, monospace';
  g.fillText(glyph, 0, r*0.06);
  return { canvas:c, half:S/2 };
}

/* ── 항공기 실루엣 ── */
// 팔레트: [상면, 하면, 엣지, 캐노피]
function aircraftPaint(g, top, bottom, y0, y1){
  const grd = g.createLinearGradient(0, y0, 0, y1);
  grd.addColorStop(0, top);
  grd.addColorStop(0.55, bottom);
  grd.addColorStop(1, bottom);
  return grd;
}

function bakeF22(white, slot){

  g.lineTo(5.2,23); g.lineTo(-5.2,23); g.lineTo(-6.6,14); g.lineTo(-6.2,-3);

      gr.addColorStop(0,'rgba(214,236,255,0.5)');
      gr.addColorStop(1,'rgba(214,236,255,0)');
      g.fillStyle = gr; g.beginPath(); g.arc(x,y,r,0,TAU); g.fill();

/* ═══════════════════════════════════════════════════
   사운드 (WebAudio 합성 — 외부 파일 없음)
   ═══════════════════════════════════════════════════ */
const Sound = (function(){
  let actx = null, master = null, muted = false, vol = 0.55;
  let noiseBuf = null;
  let lastShot = 0;

  function ensure(){
    if (actx) return actx;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      actx = new AC();
      master = actx.createGain();
      master.gain.value = vol;
      master.connect(actx.destination);
      // 노이즈 버퍼
      const len = Math.floor(actx.sampleRate * 0.5);
      noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i=0;i<len;i++) d[i] = Math.random()*2-1;
    } catch(e){ actx = null; }
    return actx;
  }
  function resume(){ const a = ensure(); if (a && a.state === 'suspended') a.resume(); }

  function tone(freq, dur, type, gain, sweepTo, delay){
    if (muted) return; const a = ensure(); if (!a) return;
    const t0 = a.currentTime + (delay||0);
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t0);
    if (sweepTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,sweepTo), t0+dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, gain), t0 + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function noise(dur, gain, filtFreq, sweepTo, delay){
    if (muted) return; const a = ensure(); if (!a || !noiseBuf) return;
    const t0 = a.currentTime + (delay||0);
    const s = a.createBufferSource(); s.buffer = noiseBuf;
    const f = a.createBiquadFilter(); f.type = 'bandpass';
    f.frequency.setValueAtTime(filtFreq, t0);
    if (sweepTo) f.frequency.exponentialRampToValueAtTime(Math.max(40,sweepTo), t0+dur);
    f.Q.value = 1.2;
    const g = a.createGain();
    g.gain.setValueAtTime(gain, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t0); s.stop(t0+dur+0.02);
  }

  return {
    resume, ensure,
    setVol(v){ vol = v; if (master) master.gain.value = v; },
    getVol(){ return vol; },
    toggleMute(){ muted = !muted; return muted; },
    isMuted(){ return muted; },
    shot(){
      const now = performance.now();
      if (now - lastShot < 55) return;   // 연사 소리 과밀 방지
      lastShot = now;
      tone(1760, 0.035, 'square', 0.028, 1200);
    },
    graze(combo){
      const step = Math.min(24, combo % 25);
      tone(880 * Math.pow(2, step/24), 0.06, 'sine', 0.10, null);
    },
    enemyShot(){ noise(0.07, 0.035, 900, 380); },
    hit(){
      tone(220, 0.45, 'sawtooth', 0.28, 45);
      noise(0.4, 0.22, 700, 90);
    },
    bomb(){
      tone(90, 0.9, 'sawtooth', 0.3, 900);
      noise(0.9, 0.3, 300, 4000);
      tone(1200, 0.5, 'sine', 0.12, 200, 0.05);
    },
    spell(){
      [0, 0.09, 0.18].forEach((d,i) =>
        tone([523.25, 659.25, 987.77][i], 0.4, 'triangle', 0.16, null, d));
    },
    defeat(){
      for (let i=0;i<6;i++){
        noise(0.5, 0.2, 1200 - i*140, 80, i*0.11);
        tone(400 - i*40, 0.5, 'sawtooth', 0.14, 60, i*0.11);
      }
    },
    item(){ tone(1320, 0.05, 'sine', 0.05, 1980); },
    enemyDie(){ noise(0.18, 0.11, 1500, 260); tone(320, 0.16, 'square', 0.07, 110); },
    powerUp(){ [0,0.06,0.12].forEach((d,i)=>tone([659.25,880,1318.5][i], 0.20, 'triangle', 0.13, null, d)); },
    homing(){ tone(1500, 0.09, 'sine', 0.05, 620); noise(0.10, 0.04, 1800, 500); },
    shieldBreak(){ tone(520, 0.35, 'triangle', 0.20, 130); noise(0.3, 0.14, 2200, 400); },
    squadWipe(){ [0,0.07,0.14,0.21].forEach((d,i)=>tone([784,988,1175,1568][i], 0.26, 'triangle', 0.13, null, d)); },
    ui(){ tone(660, 0.07, 'triangle', 0.10, 990); },
    extend(){ [0,0.1,0.2,0.3].forEach((d,i)=>tone([523,659,784,1047][i],0.3,'triangle',0.16,null,d)); },
  };
})();

const Input = {
  keys: Object.create(null),
  pressed: Object.create(null),   // 이번 프레임 눌림(엣지)
  touch: { active:false, x:0, y:0, px:0, py:0, speed:0, id:null },
  tapBomb: false,
  tapAnywhere: false,
  uiTap: null,                    // {x,y} 논리좌표
  consumeUiTap(){ const t = this.uiTap; this.uiTap = null; return t; },
  isDown(code){ return !!this.keys[code]; },
  wasPressed(code){ return !!this.pressed[code]; },
  clearEdge(){ this.pressed = Object.create(null); this.tapBomb = false; this.tapAnywhere = false; },
};

const KEYMAP = {
  ArrowLeft:'L', KeyA:'L', ArrowRight:'R', KeyD:'R',
  ArrowUp:'U', KeyW:'U', ArrowDown:'D', KeyS:'D',
  ShiftLeft:'SLOW', ShiftRight:'SLOW',
  KeyZ:'SHOT', KeyX:'BOMB', Space:'SHOT',
  Escape:'PAUSE', KeyP:'PAUSE', KeyR:'RETRY', Enter:'OK', KeyM:'MUTE', KeyO:'MODE_KEY',
};

window.addEventListener('keydown', e => {
  // 방 코드 입력 화면에서는 영숫자를 버퍼로 받는다
  if (state === S.LOBBY && lobbyRole === 'joininput'){
    if (e.key === 'Backspace'){ joinCode = joinCode.slice(0, -1); e.preventDefault(); return; }
    if (e.key === 'Enter'){ Input.pressed.OK = true; e.preventDefault(); return; }
    if (/^[a-zA-Z0-9]$/.test(e.key) && joinCode.length < 4){
      joinCode += e.key.toUpperCase(); e.preventDefault(); return;
    }
  }
  const k = KEYMAP[e.code];
  if (k){
    e.preventDefault();
    if (!Input.keys[k]) Input.pressed[k] = true;
    Input.keys[k] = true;
  }
  Sound.resume();
}, { passive:false });

window.addEventListener('keyup', e => {
  const k = KEYMAP[e.code];
  if (k){ e.preventDefault(); Input.keys[k] = false; }
}, { passive:false });

function toLogical(clientX, clientY){
  const r = cv.getBoundingClientRect();
  return {
    x: (clientX - r.left) / r.width  * LW,
    y: (clientY - r.top)  / r.height * LH,
  };
}

// 화면상 버튼 히트 영역 (렌더에서 갱신)
const UI = { bombBtn:{x:432, y:618, r:26}, pauseBtn:{x:24, y:20, r:18} };
function inCircle(p, c){ const dx=p.x-c.x, dy=p.y-c.y; return dx*dx+dy*dy <= (c.r+10)*(c.r+10); }

function handleTouchStart(e){
  Sound.resume();
  for (const t of e.changedTouches){
    const p = toLogical(t.clientX, t.clientY);
    Input.uiTap = p;
    Input.tapAnywhere = true;
    if (inCircle(p, UI.bombBtn)){ Input.tapBomb = true; Input.pressed.BOMB = true; continue; }
    if (inCircle(p, UI.pauseBtn)){ Input.pressed.PAUSE = true; continue; }
    if (Input.touch.id === null){
      Input.touch.id = t.identifier;
      Input.touch.active = true;
      Input.touch.x = p.x; Input.touch.y = p.y;
      Input.touch.px = p.x; Input.touch.py = p.y;
      Input.touch.speed = 0;
      Input.touch.grabDX = 0; Input.touch.grabDY = 0;
    }
  }
  e.preventDefault();
}
function handleTouchMove(e){
  for (const t of e.changedTouches){
    if (t.identifier === Input.touch.id){
      const p = toLogical(t.clientX, t.clientY);
      Input.touch.x = p.x; Input.touch.y = p.y;
    }
  }
  e.preventDefault();
}
function handleTouchEnd(e){
  for (const t of e.changedTouches){
    if (t.identifier === Input.touch.id){
      Input.touch.id = null; Input.touch.active = false; Input.touch.speed = 0;
    }
  }
  e.preventDefault();
}
cv.addEventListener('touchstart', handleTouchStart, { passive:false });
cv.addEventListener('touchmove',  handleTouchMove,  { passive:false });
cv.addEventListener('touchend',   handleTouchEnd,   { passive:false });
cv.addEventListener('touchcancel',handleTouchEnd,   { passive:false });

  if (inCircle(p, UI.bombBtn)) Input.pressed.BOMB = true;
  if (inCircle(p, UI.pauseBtn)) Input.pressed.PAUSE = true;
});

function makeBullet(){
  return { on:false, x:0,y:0, vx:0,vy:0, r:6, spr:null, grazed:false,
           kind:'ring', ang:0, spin:0, fuse:-1, burstN:0, burstSpd:0, life:0,
           rot:0, rc:0, rs:-1 };
}
// 프리 스택 + 액티브 배열 (스왑 제거) — 매 프레임 전체 풀을 훑지 않음
const bulletPool = new Array(MAX_BULLETS);
const bulletFree = [];
const active = [];
for (let i=0;i<MAX_BULLETS;i++){ bulletPool[i] = makeBullet(); bulletFree.push(bulletPool[i]); }
let bulletCount = 0;

function spawnBullet(x, y, ang, spd, kind, opt){
  const b = bulletFree.pop();
  if (!b) return null;
  b.on = true; active.push(b); bulletCount = active.length;
  b.x = x; b.y = y;
  b.vx = Math.cos(ang) * spd;
  b.vy = Math.sin(ang) * spd;
  b.ang = ang; b.spin = 0; b.grazed = false; b.life = 0;
  // 적탄은 등속 직선이라 진행 방향이 변하지 않는다 → 회전값을 생성 시 한 번만 계산
  b.rot = ang + Math.PI/2;
  b.rc = Math.cos(b.rot); b.rs = Math.sin(b.rot);
  b.fuse = -1; b.burstN = 0; b.burstSpd = 0;
  b.kind = kind;
  switch(kind){
    case 'ring':  b.r = 6;  b.spr = SPR.ring;  break;
    case 'fall':  b.r = 4.5;b.spr = SPR.fall;  break;
    case 'aim':   b.r = 5;  b.spr = SPR.aim;   break;
    case 'burst': b.r = 4;  b.spr = SPR.burst; break;
    case 'seed':  b.r = 8;  b.spr = SPR.seed;  break;
    case 'laser': b.r = 5;  b.spr = SPR.laser; break;
    default:      b.r = 6;  b.spr = SPR.ring;
  }
  if (opt){ if (opt.fuse!==undefined) b.fuse=opt.fuse;
            if (opt.burstN!==undefined) b.burstN=opt.burstN;
            if (opt.burstSpd!==undefined) b.burstSpd=opt.burstSpd; }
  return b;
}
// 실제 회수는 updateBullets의 스왑 제거에서 수행
function killBullet(b){ b.on = false; }
function clearBullets(toItems){
  for (let i=0;i<active.length;i++){
    const b = active[i];
    if (b.on && toItems) spawnItem(b.x, b.y);
    b.on = false;
    bulletFree.push(b);
  }
  active.length = 0;
  bulletCount = 0;
}
function countLiveBullets(){
  let n = 0;
  for (let i=0;i<active.length;i++) if (active[i].on) n++;
  return n;
}

// 자탄
// 4인 협동에서는 자탄이 4배로 나가므로 풀을 넉넉히 잡는다 (풀이 마르면 뒤에 발사한
// 플레이어의 탄이 통째로 사라져서 화력이 인원수만큼 오르지 않는다)
const MAX_PSHOT = 1100;
const pshots = [];
for (let i=0;i<MAX_PSHOT;i++) pshots.push({on:false,x:0,y:0,vx:0,vy:0,dmg:1,homing:false,life:0,rot:0});
let pshotCursor = 0;
function spawnPShot(x,y,vx,vy,dmg,homing){
  for (let n=0;n<MAX_PSHOT;n++){
    const i = pshotCursor; pshotCursor = (pshotCursor + 1) % MAX_PSHOT;
    const s = pshots[i];
    if (!s.on){
      s.on=true; s.x=x; s.y=y; s.vx=vx; s.vy=vy; s.dmg=dmg;
      s.homing = !!homing; s.life = 0;
      s.rot = Math.atan2(vy, vx) + Math.PI/2;
      return s;
    }
  }
  return null;
}
// 유도 미사일이 노릴 대상 (가장 가까운 적 → 없으면 보스)
function homingTarget(x, y){
  // 게스트는 로컬 적 배열이 비어 있다 — 호스트가 보내준 월드를 봐야 유도가 걸린다
  if (Net.isOnline() && !Net.isHost()){
    let best = null, bd = 1e9;
    if (G && G.mode === 'BOSS' && NetWorld.boss.alive) return { x: NetWorld.boss.x, y: NetWorld.boss.y };
    for (let i=0;i<NetWorld.enemies.length;i++){
      const e = NetWorld.enemies[i];
      const d = (e.x-x)*(e.x-x) + (e.y-y)*(e.y-y);
      if (d < bd){ bd = d; best = e; }
    }
    return best;
  }
  let best = null, bd = 1e9;
  for (let i=0;i<MAX_ENEMY;i++){
    const e = enemies[i];
    if (!e.on) continue;
    const d = (e.x-x)*(e.x-x) + (e.y-y)*(e.y-y);
    if (d < bd){ bd = d; best = e; }
  }
  if (best) return best;
  if (G && G.mode === 'BOSS' && G.boss.alive && G.transition <= 0) return G.boss;
  return null;
}

const MAX_RING = 48;
const rings = [];
for (let i=0;i<MAX_RING;i++) rings.push({on:false,x:0,y:0,r0:0,r1:0,life:0,max:1,col:'#fff',w:2});
function spawnRing(x,y,r1,life,col,w,r0){
  for (let i=0;i<MAX_RING;i++){
    const r = rings[i];
    if (!r.on){
      r.on=true; r.x=x; r.y=y; r.r0=r0||2; r.r1=r1;
      r.life=life; r.max=life; r.col=col; r.w=w||2;
      return;
    }
  }
}
function updateRings(){
  for (let i=0;i<MAX_RING;i++){ const r = rings[i]; if (r.on && --r.life <= 0) r.on = false; }
}
function drawRings(){
  ctx.save();
  for (let i=0;i<MAX_RING;i++){
    const r = rings[i];
    if (!r.on) continue;
    const t = 1 - r.life / r.max;              // 0 → 1
    const e = 1 - Math.pow(1 - t, 3);          // ease-out
    ctx.globalAlpha = (1 - t) * 0.85;
    ctx.strokeStyle = r.col;
    ctx.lineWidth = Math.max(0.4, r.w * (1 - t));
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r0 + (r.r1 - r.r0) * e, 0, TAU); ctx.stroke();
  }
  ctx.restore();
}

const S = { TITLE:'TITLE', MODE:'MODE', LOBBY:'LOBBY',
            PLAY:'PLAY', PAUSE:'PAUSE', GAMEOVER:'GAMEOVER', CLEAR:'CLEAR' };

/* ═══════════════════════════════════════════════════
   네트워크 — 전송 계층 추상화
   실사용은 WebRTC P2P(PeerJS 공개 브로커), 자동 테스트는 BroadcastChannel.
   게임 코드는 Transport 인터페이스만 알면 되도록 분리한다.
   ═══════════════════════════════════════════════════ */
const ROOM_NS = 'neotone-v2-';
const PEERJS_URL = 'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
const MAX_PLAYERS = 4;
// 슬롯별 도색 — 모든 참가자가 같은 색으로 서로를 본다 (P1=나 가 아니라 P1=방장)
const SLOT_COLOR = ['#7fb2cf', '#d1904f', '#6fcf8a', '#b98cd6'];
const SLOT_EDGE  = ['rgba(215,250,255,0.95)', 'rgba(255,230,190,0.95)',
                    'rgba(205,255,220,0.95)', 'rgba(235,215,255,0.95)'];
const SLOT_LABEL = ['P1', 'P2', 'P3', 'P4'];

function makeRoomCode(){
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';   // 헷갈리는 O0I1 제외
  let r = '';
  for (let i=0;i<4;i++) r += A[Math.floor(Math.random()*A.length)];
  return r;
}
function randId(){ return Math.random().toString(36).slice(2, 10); }
// 강퇴 대상을 새로고침 뒤에도 알아보려면 브라우저마다 고정된 식별자가 필요하다.
// 저장이 막힌 환경(사생활 보호 모드 등)에서는 임시 id로 떨어지고, 그때는
// 창을 새로 열면 다시 들어올 수 있다 — 친구끼리 하는 게임이라 여기까지만 막는다.
const MY_CID = (function(){
  try {
    let v = localStorage.getItem('neotone-cid');
    if (!v){ v = randId() + randId(); localStorage.setItem('neotone-cid', v); }
    return v;
  } catch(e){ return randId() + randId(); }
})();

/* ── BroadcastChannel 전송 (같은 오리진 탭. 자동 테스트 전용) ──
   버스 방식이라 메시지에 from/to를 실어 다자간을 흉내낸다. */
function BCTransport(){
  let ch = null, isHost = false, cb = {}, myId = randId(), peerIds = [], banned = [];
  return {
    kind: 'bc',
    open(room, host, handlers){
      isHost = host; cb = handlers;
      if (isHost) myId = 'host';
      ch = new BroadcastChannel(ROOM_NS + room);
      ch.onmessage = (e) => {
        const m = e.data;
        if (!m || m.from === myId) return;
        if (m.to && m.to !== myId) return;
        if (m.sys === 'join'){
          if (!isHost) return;
          if (banned.indexOf(m.from) >= 0){
            ch.postMessage({ from: myId, to: m.from, sys: 'kicked' });
            return;
          }
          if (peerIds.length >= MAX_PLAYERS - 1){
            ch.postMessage({ from: myId, to: m.from, sys: 'full' });
            return;
          }
          peerIds.push(m.from);
          ch.postMessage({ from: myId, to: m.from, sys: 'accept' });
          cb.onOpen && cb.onOpen(m.from);
        } else if (m.sys === 'accept'){
          if (isHost) return;
          peerIds = ['host'];
          cb.onOpen && cb.onOpen('host');
        } else if (m.sys === 'full'){
          cb.onError && cb.onError('방이 가득 찼습니다 (최대 4인)');
        } else if (m.sys === 'kicked'){
          cb.onKicked && cb.onKicked();
        } else if (m.sys === 'bye'){
          peerIds = peerIds.filter(x => x !== m.from);
          cb.onClose && cb.onClose(m.from);
        } else if (m.data !== undefined){
          cb.onData && cb.onData(m.from, m.data);
        }
      };
      cb.onReady && cb.onReady(room);
      if (!isHost) ch.postMessage({ from: myId, sys: 'join' });
    },
    send(to, d){ if (ch) ch.postMessage({ from: myId, to, data: d }); },
    broadcast(d){ if (ch) ch.postMessage({ from: myId, to: null, data: d }); },
    // 강제 퇴장 — 대상에게 통보하고 연결 목록에서 제외한다.
    // 같은 코드로 바로 다시 들어오지 못하도록 이 방이 열려 있는 동안은 차단 목록에 남긴다.
    drop(id){
      if (ch) ch.postMessage({ from: myId, to: id, sys: 'kicked' });
      peerIds = peerIds.filter(x => x !== id);
      if (banned.indexOf(id) < 0) banned.push(id);
    },
    close(){
      if (ch){ try{ ch.postMessage({ from: myId, sys:'bye' }); ch.close(); }catch(e){} ch = null; }
      peerIds = []; banned = [];
    },
    get peers(){ return peerIds.slice(); },
  };
}

/* ── ICE 설정 ──
   PeerJS 기본값에 들어 있는 TURN(eu-0/us-0.turn.peerjs.com)은 현재 응답하지 않는다
   (ICE 오류 701 = 서버 도달 불가). STUN 만으로는 대칭형 NAT·UDP 차단 회선을 뚫지 못하고,
   그때 연결이 "조용히" 실패한다. 그래서
     1) STUN 후보를 여러 곳 두고
     2) ?turn=turn:호스트:포트|아이디|비번  으로 릴레이를 직접 꽂을 수 있게 했다.
   여러 개를 넣으려면 콤마로 잇는다. */
const STUN_LIST = [
  'stun:stun.l.google.com:19302',
  'stun:stun1.l.google.com:19302',
  'stun:stun2.l.google.com:19302',
  'stun:stun.cloudflare.com:3478',
];
function iceServers(){
  const list = [{ urls: STUN_LIST }];
  const mt = /[?&]turn=([^&]+)/.exec(location.search);
  if (mt){
    decodeURIComponent(mt[1]).split(',').forEach(spec => {
      const q = spec.split('|');
      if (!q[0]) return;
      const e = { urls: q[0].trim() };
      if (q[1]) e.username = q[1].trim();
      if (q[2]) e.credential = q[2].trim();
      list.push(e);
    });
  }
  return list;
}
function hasTurn(){ return iceServers().some(e => /^turns?:/.test(e.urls)); }

/* ── PeerJS(WebRTC) 전송 — 호스트는 최대 3명을 동시에 받는다 ── */
let peerLibPromise = null;
function loadPeerLib(){
  if (window.Peer) return Promise.resolve();
  if (peerLibPromise) return peerLibPromise;
  peerLibPromise = new Promise((res, rej) => {
    const sc = document.createElement('script');
    sc.src = PEERJS_URL;
    sc.onload = () => res();
    sc.onerror = () => rej(new Error('PeerJS를 불러오지 못했습니다 (네트워크 확인)'));
    document.head.appendChild(sc);
  });
  return peerLibPromise;
}
function PeerTransport(){
  let peer = null, isHost = false, cb = {};
  const conns = new Map();          // peerId → DataConnection
  const banned = new Set();         // 강제 퇴장당한 peerId (이 방이 열려 있는 동안)
  let joinTimer = null;             // 클라이언트 연결 감시 타이머
  let iceState = '';                // 마지막 ICE 상태 (진단 표시용)
  function watchIce(c){
    // PeerJS 는 협상이 시작돼야 peerConnection 을 만든다 — 잠시 뒤부터 상태를 읽는다
    const t = setInterval(() => {
      const pc = c && c.peerConnection;
      if (pc){ iceState = pc.iceConnectionState || ''; if (/connected|completed|failed|closed/.test(iceState)) clearInterval(t); }
    }, 500);
    setTimeout(() => clearInterval(t), 40000);
  }
  function bind(c){
    const id = c.peer;
    watchIce(c);
    c.on('open', () => { if (joinTimer){ clearTimeout(joinTimer); joinTimer = null; }
                         conns.set(id, c); cb.onOpen && cb.onOpen(id); });
    c.on('data', d => cb.onData && cb.onData(id, d));
    c.on('close', () => { conns.delete(id); cb.onClose && cb.onClose(id); });
    c.on('error', () => { conns.delete(id); cb.onClose && cb.onClose(id); });
  }
  return {
    kind: 'peer',
    open(room, host, handlers){
      isHost = host; cb = handlers;
      loadPeerLib().then(() => {
        // ?peer=host:port[:/path] 로 자체 PeerServer 지정 가능 (공개 브로커가 막힌 망 대비)
        const opts = { config: { iceServers: iceServers(), sdpSemantics: 'unified-plan' } };
        const mp = /[?&]peer=([^&]+)/.exec(location.search);
        if (mp){
          const parts = decodeURIComponent(mp[1]).split(':');
          opts.host = parts[0];
          opts.port = parts[1] ? parseInt(parts[1],10) : 443;
          opts.path = parts[2] ? ('/' + parts[2].replace(/^\//,'')) : '/';
          opts.secure = location.protocol === 'https:';
        }
        peer = isHost ? new Peer(ROOM_NS + room, opts) : new Peer(undefined, opts);
        peer.on('open', () => {
          cb.onReady && cb.onReady(room);
          if (!isHost){
            bind(peer.connect(ROOM_NS + room, { reliable: true }));
            // ★ 조용한 실패를 막는다 — 방은 찾았는데 P2P 경로가 안 뚫리면
            //   예전에는 "연결 중..." 상태로 영원히 멈춰 있었다.
            joinTimer = setTimeout(() => {
              joinTimer = null;
              if (conns.size) return;
              cb.onError && cb.onError(hasTurn()
                ? ('릴레이로도 연결되지 않았습니다 (ICE: ' + (iceState || '대기') + ')')
                : '방은 찾았지만 직접 연결이 안 됩니다 — 회선이 P2P를 막고 있습니다 (README의 TURN 설정 참고)');
            }, 15000);
          }
        });
        if (isHost) peer.on('connection', c => {
          if (banned.has(c.peer)){
            try { c.on('open', () => { c.send({ t:'kick' }); setTimeout(()=>c.close(), 300); }); } catch(e){}
            return;
          }
          if (conns.size >= MAX_PLAYERS - 1){
            try { c.on('open', () => { c.send({ t:'full' }); setTimeout(()=>c.close(), 300); }); } catch(e){}
            return;
          }
          bind(c);
        });
        peer.on('error', e => {
          const msg = (e && e.type === 'unavailable-id') ? '이미 사용 중인 방 코드입니다'
                    : (e && e.type === 'peer-unavailable') ? '방을 찾을 수 없습니다'
                    : ('브로커 오류: ' + (e && e.type || '알 수 없음'));
          cb.onError && cb.onError(msg);
        });
      }).catch(err => cb.onError && cb.onError(err.message));
    },
    send(to, d){ const c = conns.get(to); if (c) { try { c.send(d); } catch(e){} } },
    broadcast(d){ conns.forEach(c => { try { c.send(d); } catch(e){} }); },
    // 강제 퇴장 — 통보가 도착할 시간을 준 뒤 끊고, 같은 세션 동안 재입장을 막는다
    drop(id){
      const c = conns.get(id);
      banned.add(id);
      if (c){ try { c.send({ t:'kick' }); } catch(e){}
              setTimeout(() => { try { c.close(); } catch(e){} }, 300); }
      conns.delete(id);
    },
    get ice(){ return iceState; },
    close(){
      if (joinTimer){ clearTimeout(joinTimer); joinTimer = null; }
      conns.forEach(c => { try { c.close(); } catch(e){} });
      conns.clear(); banned.clear();
      try { if (peer) peer.destroy(); } catch(e){}
      peer = null;
    },
    get peers(){ return Array.from(conns.keys()); },
  };
}

/* ── WebSocket 릴레이 전송 ──
   P2P(WebRTC)는 양쪽 회선이 서로 뚫려야 붙는다. 회사·학교망처럼 NAT이 까다로우면
   TURN 릴레이 없이는 아예 연결되지 않는다. 그래서 "게임 데이터를 통째로 중계하는
   서버"를 하나 띄우는 길을 열어 뒀다 — 이건 그냥 바깥으로 나가는 WebSocket 하나라
   NAT을 탈 일이 없다. (server.js + cloudflared 로 2분이면 띄운다. README 참고)

   프레임 규약 — 게임 → 서버
     binary : [to(1B, 255=broadcast)][payload...]
     text   : {"to": n|null, "d": {...}}
   서버 → 게임 (서버가 보낸 사람 번호로 바꿔 준다)
     binary : [from(1B)][payload...]
     text   : {"from": n, "d": {...}}                                       */
function WSTransport(url){
  let ws = null, isHost = false, cb = {}, myId = -1, peerIds = [], opened = false;
  let refused = false;   // 서버가 거절 사유를 이미 알려준 경우 (닫힘 메시지로 덮어쓰지 않는다)
  const sid = n => 'p' + n;
  function ctrl(o){ if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }
  return {
    kind: 'ws',
    open(room, host, handlers){
      isHost = host; cb = handlers; refused = false; opened = false;
      try { ws = new WebSocket(url); }
      catch(e){ cb.onError && cb.onError('릴레이 주소가 잘못되었습니다'); return; }
      ws.binaryType = 'arraybuffer';
      ws.onopen = () => ctrl({ sys:'join', room, host: !!host });
      ws.onerror = () => { if (!opened && !refused) cb.onError && cb.onError('릴레이 서버에 연결하지 못했습니다'); };
      ws.onclose = () => {
        if (refused) return;
        if (!opened){ cb.onError && cb.onError('릴레이 서버와 연결이 끊겼습니다'); return; }
        peerIds.slice().forEach(id => cb.onClose && cb.onClose(id));
        peerIds = [];
      };
      ws.onmessage = (e) => {
        if (typeof e.data !== 'string'){
          const b = new Uint8Array(e.data);
          cb.onData && cb.onData(sid(b[0]), e.data.slice(1));
          return;
        }
        let m; try { m = JSON.parse(e.data); } catch(_){ return; }
        if (m.sys === 'id'){
          opened = true; myId = m.id;
          cb.onReady && cb.onReady(room);
          if (!isHost){ peerIds = [sid(m.hostId)]; cb.onOpen && cb.onOpen(sid(m.hostId)); }
        }
        else if (m.sys === 'open'){ peerIds.push(sid(m.id)); cb.onOpen && cb.onOpen(sid(m.id)); }
        else if (m.sys === 'close'){
          peerIds = peerIds.filter(x => x !== sid(m.id));
          cb.onClose && cb.onClose(sid(m.id));
        }
        else if (m.sys === 'full'){ refused = true; cb.onError && cb.onError('방이 가득 찼습니다 (최대 4인)'); }
        else if (m.sys === 'nohost'){ refused = true; cb.onError && cb.onError('방을 찾을 수 없습니다'); }
        else if (m.sys === 'taken'){ refused = true; cb.onError && cb.onError('이미 사용 중인 방 코드입니다'); }
        else if (m.sys === 'kicked'){ refused = true; cb.onKicked && cb.onKicked(); }
        else if (m.from !== undefined){ cb.onData && cb.onData(sid(m.from), m.d); }
      };
    },
    send(to, d){
      if (!ws || ws.readyState !== 1) return;
      const n = (typeof to === 'string' && to[0] === 'p') ? parseInt(to.slice(1), 10) : 255;
      if (d instanceof ArrayBuffer){
        const src = new Uint8Array(d), out = new Uint8Array(src.length + 1);
        out[0] = n; out.set(src, 1); ws.send(out.buffer);
      } else ws.send(JSON.stringify({ to: n, d }));
    },
    broadcast(d){
      if (!ws || ws.readyState !== 1) return;
      if (d instanceof ArrayBuffer){
        const src = new Uint8Array(d), out = new Uint8Array(src.length + 1);
        out[0] = 255; out.set(src, 1); ws.send(out.buffer);
      } else ws.send(JSON.stringify({ to: null, d }));
    },
    drop(id){
      const n = (typeof id === 'string' && id[0] === 'p') ? parseInt(id.slice(1), 10) : -1;
      if (n >= 0) ctrl({ sys:'drop', id: n });
      peerIds = peerIds.filter(x => x !== id);
    },
    get ice(){ return 'relay'; },
    close(){
      // 핸들러부터 떼어낸다 — 안 그러면 '방이 가득 찼습니다' 같은 사유가
      // 뒤따라오는 onclose 메시지에 덮여 버린다
      if (ws){ ws.onopen = ws.onerror = ws.onclose = ws.onmessage = null;
               try { ws.close(); } catch(e){} ws = null; }
      peerIds = []; opened = false;
    },
    get peers(){ return peerIds.slice(); },
  };
}

/* ── 슬롯 하나 = 플레이어 한 명 ── */
function makeSlot(i){
  return {
    slot: i, present: false, ready: false, peerId: null, cid: null,
    x: LW/2, y: PF.y + PF.h - 110 + i*10, bank: 0,
    power: 0, lives: 3, bombs: 3, shield: 0, score: 0,
    invuln: 0, slow: false, spectating: false, seen: 0, fireTick: 0,
  };
}

const Net = {
  mode: 'off',            // 'off' | 'host' | 'client'
  tp: null,
  room: '',
  mySlot: 0,
  status: '', error: '',
  connected: false,
  sendTick: 0,
  bannedCids: [],         // 이 방에서 강제 퇴장당한 브라우저들
  players: [makeSlot(0), makeSlot(1), makeSlot(2), makeSlot(3)],

  isOnline(){ return this.mode !== 'off'; },
  isHost(){ return this.mode === 'host'; },
  me(){ return this.players[this.mySlot]; },
  others(){ return this.players.filter(p => p.slot !== this.mySlot && p.present); },
  presentCount(){ return this.players.filter(p => p.present).length; },
  allReady(){
    const ps = this.players.filter(p => p.present);
    return ps.length >= 2 && ps.every(p => p.ready);
  },
  slotOfPeer(id){ return this.players.findIndex(p => p.peerId === id); },
  // 방장이 특정 슬롯을 강제 퇴장시킨다 (대기실에서만 — 게임 중에는 잠근다)
  kick(slot){
    if (!this.isHost() || slot <= 0 || slot >= MAX_PLAYERS) return false;
    const p = this.players[slot];
    if (!p.present || !p.peerId) return false;
    const pid = p.peerId;
    if (p.cid && this.bannedCids.indexOf(p.cid) < 0) this.bannedCids.push(p.cid);
    this.players[slot] = makeSlot(slot);
    if (this.tp && this.tp.drop) this.tp.drop(pid);
    else if (this.tp) this.tp.send(pid, { t:'kick' });
    this.connected = this.presentCount() > 1;
    this.status = this.connected ? '연결됨' : '상대를 기다리는 중';
    this.broadcastLobby();
    return true;
  },
  freeSlot(){ for (let i=1;i<MAX_PLAYERS;i++) if (!this.players[i].present) return i; return -1; },

  reset(){
    this.players = [makeSlot(0), makeSlot(1), makeSlot(2), makeSlot(3)];
    this.connected = false; this.mySlot = 0;
  },

  start(kind, room, transportKind){
    this.close();
    this.reset();
    this.mode = kind;
    this.room = room;
    this.error = '';
    this.bannedCids = [];
    this.status = kind === 'host' ? '방을 여는 중...' : '방에 접속 중...';
    if (kind === 'host'){
      this.mySlot = 0;
      const me = this.players[0];
      me.present = true; me.peerId = 'me';
    }
    const TP = (transportKind === 'bc') ? BCTransport
             : (transportKind === 'ws') ? (() => WSTransport(wsRelayUrl))
             : PeerTransport;
    this.tp = TP();
    this.tp.open(room, kind === 'host', {
      onReady: () => { this.status = kind === 'host' ? '상대를 기다리는 중' : '연결 중...'; },
      onOpen: (peerId) => {
        this.connected = true;
        if (this.isHost()){
          const idx = this.freeSlot();
          if (idx < 0){ this.tp.send(peerId, { t:'full' }); return; }
          const p = this.players[idx];
          p.present = true; p.ready = false; p.peerId = peerId; p.seen = performance.now();
          this.status = '연결됨';
          this.tp.send(peerId, { t:'welcome', slot: idx, diff: D.key });
          this.broadcastLobby();
        } else {
          this.status = '연결됨';
          this.sendUp({ t:'hello', cid: MY_CID });
        }
      },
      onData: (peerId, d) => this.onData(peerId, d),
      onClose: (peerId) => {
        if (this.isHost()){
          const idx = this.slotOfPeer(peerId);
          if (idx > 0){
            this.players[idx] = makeSlot(idx);
            this.broadcastLobby();
          }
          this.connected = this.presentCount() > 1;
          this.status = this.connected ? '연결됨' : '상대를 기다리는 중';
        } else {
          this.connected = false;
          this.status = '방장과의 연결이 끊겼습니다';
          if (G && (state === S.PLAY || state === S.PAUSE)) G.netDropped = true;
        }
      },
      onError: (m) => {
        this.error = m; this.status = '';
        // 아직 아무도 못 붙은 상태의 실패라면 대기실에 갇히지 않게 모드 선택으로 되돌린다
        if (!this.connected){
          this.close();
          this.error = m;
          lobbyRole = ''; joinCode = '';
          if (state === S.LOBBY) state = S.MODE;
        }
      },
      onKicked: () => this.beKicked(),
    });
  },
  close(){
    if (this.tp) this.tp.close();
    this.tp = null; this.mode = 'off'; this.connected = false;
    this.reset();
  },
  // 내가 강제 퇴장당했을 때 — 대기실이든 게임 중이든 모드 선택 화면으로 돌아간다
  beKicked(){
    this.close();
    this.error = '방장이 퇴장시켰습니다';
    lobbyRole = ''; joinCode = '';
    if (state !== S.TITLE) state = S.MODE;
  },
  toHost(o){ if (this.tp) this.tp.send('__host__', o); },
  sendAll(o){ if (this.tp) this.tp.broadcast(o); },
  // 클라이언트는 상대가 방장 하나뿐이라 broadcast가 곧 호스트 전송
  sendUp(o){ if (this.tp) this.tp.broadcast(o); },

  broadcastLobby(){
    if (!this.isHost()) return;
    this.sendAll({ t:'lobby', p: this.players.map(p => ({ present:p.present, ready:p.ready })) });
  },

  onData(peerId, d){
    if (d instanceof ArrayBuffer){ netApplyBinary(peerId, d); return; }
    if (ArrayBuffer.isView(d)){ netApplyBinary(peerId, d.buffer); return; }
    if (!d || typeof d !== 'object') return;
    switch(d.t){
      case 'full':
        this.error = '방이 가득 찼습니다 (최대 4인)';
        this.close();
        break;
      case 'kick':                          // 방장이 나를 퇴장시킴
        if (!this.isHost()) this.beKicked();
        break;
      case 'hello':                         // 참가자 신원 — 강퇴 명단과 대조한다
        if (this.isHost()){
          const hi = this.slotOfPeer(peerId);
          if (hi > 0){
            this.players[hi].cid = d.cid;
            if (d.cid && this.bannedCids.indexOf(d.cid) >= 0) this.kick(hi);
          }
        }
        break;
      case 'welcome':                       // 호스트가 내 슬롯을 알려줌
        this.mySlot = d.slot;
        this.players[d.slot].present = true;
        this.players[0].present = true;
        D = DIFF[d.diff] || D;
        diffIdx = DIFF_LIST.indexOf(D);
        break;
      case 'lobby':                         // 대기실 상태 동기화
        if (!this.isHost()){
          d.p.forEach((v, i) => {
            this.players[i].present = v.present;
            if (i !== this.mySlot) this.players[i].ready = v.ready;
          });
        }
        break;
      case 'ready':
        if (this.isHost()){
          const idx = this.slotOfPeer(peerId);
          if (idx >= 0){ this.players[idx].ready = !!d.v; this.broadcastLobby(); }
        }
        break;
      case 'diff':
        if (!this.isHost()){ D = DIFF[d.v] || D; diffIdx = DIFF_LIST.indexOf(D); }
        break;
      case 'start':
        if (!this.isHost()){
          D = DIFF[d.diff] || DIFF.Normal;
          diffIdx = DIFF_LIST.indexOf(D);
          newRun(); state = S.PLAY; Sound.ui();
        }
        break;
      case 'ev':
        netApplyEvent(d);
        if (this.isHost()) this.sendAll(d);   // 다른 참가자에게 중계
        break;
    }
  },
};
let state = S.TITLE;
let diffIdx = 1;
const DIFF_LIST = [DIFF.Easy, DIFF.Normal, DIFF.Hard];
let D = DIFF.Normal;

let G = null;      // 현재 런 데이터
let shake = 0, shakeX = 0, shakeY = 0;
let vignette = 0;
let flash = 0;
let frame = 0;
let bestScore = 0;

const player = {
  x: LW/2, y: PF.y + PF.h - 90,
  hitR: 15 * PLAYER_SCALE,   // 주익 포함 기체 실루엣에 맞춘 판정 (8.25px)
  drawR: 20 * PLAYER_SCALE,
  grazeR: 15 * PLAYER_SCALE + 20, // 판정 반경 + 20px 밴드 (기체 축소와 무관하게 유지)
  slow: false, invuln: 0, alive: true,
  fireTick: 0, trail: [],
  pendingDeath: -1,
  bombTime: 0,
  power: 0,
  vxSmooth: 0,    // 뱅킹 계산용 좌우 속도(평활)
  bank: 0,        // 롤 각 (rad)
  homing: 0,      // 유도 미사일 남은 시간(프레임)
  homingTick: 0,
  shield: 0,      // 피격 1회 무효화 스택
};
const powerLv = () => Math.min(POWER_MAX, Math.floor(player.power));
// 옵션(포드) 위치 — 발사와 렌더가 같은 값을 쓰도록 한 곳에서 계산
function podPositions(){
  const extra = POWER_TABLE[powerLv()].shots - 2;
  const ox = (player.slow ? 15 : 24) * PLAYER_SCALE;
  const oy = (player.slow ? 6 : 14) * PLAYER_SCALE;
  const out = [];
  for (let k=0;k<extra;k++){
    const side = (k % 2 === 0) ? -1 : 1;
    const tier = Math.floor(k/2);
    out.push({ x: side*(ox + tier*11*PLAYER_SCALE), y: oy + tier*9*PLAYER_SCALE, side, tier });
  }
  return out;
}
function addPower(n){
  const before = powerLv();
  player.power = Math.max(0, Math.min(POWER_MAX, player.power + n));
  if (powerLv() > before){ Sound.powerUp(); G.banner = 70; G.bannerText = 'POWER UP  Lv.' + powerLv(); }
}

function newRun(){
  clearBullets(false);
  clearEnemies();
  for (const s of pshots) s.on = false;
  for (const p of parts) p.on = false;
  for (const r of rings) r.on = false;
  for (const it of items) it.on = false;
  squadSeq = 0;

  player.x = LW/2; player.y = PF.y + PF.h - 90;
  player.invuln = 120; player.alive = true; player.fireTick = 0;
  player.trail.length = 0; player.pendingDeath = -1; player.bombTime = 0;
  player.power = 0;
  player.homing = 0; player.homingTick = 0; player.shield = 0;

  G = {
    mode: 'STAGE',                 // 'STAGE' → 'BOSS' ↔ 'INTERLUDE'
    score: 0, graze: 0, grazeCombo: 0,
    lives: D.lives, bombs: 3,
    phase: 0, phaseHP: PHASE_HP * D.hp * coopHP(), phaseHPMax: PHASE_HP * D.hp * coopHP(),
    phaseTimer: PHASE_TIME, phaseNoMiss: true, phaseNoBomb: true,
    bonusNoMiss: 0, bonusNoBomb: 0,
    bonusSquad: 0, squadsWiped: 0, enemiesKilled: 0, shieldsUsed: 0,
    spectating: false, netDropped: false,
    pickups: { homing:0, bomb:0, shield:0 },
    interlude: null,
    transition: 0, banner: 0, bannerText: null,
    runner: null, boss: { x: LW/2, y: PF.y + 120, t: 0, alive:true, deadTimer:0 },
    totalFrames: 0, finished: false,
    tint: '#12203a',
    nextExtendAt: 1000000,
    squads: {},
    stage: { label: 'STAGE 1', waveName: '', runner: null, done: false, midboss: null },
  };
  G.stage.runner = new PatternRunner(stageScript());
  G.banner = 140; G.bannerText = 'STAGE 1';
}

function addScore(n){
  const before = G.score;
  G.score += Math.round(n);
  if (before < G.nextExtendAt && G.score >= G.nextExtendAt){
    G.lives++; G.nextExtendAt += 2000000; Sound.extend();
    G.banner = 90; G.bannerText = 'EXTEND — 잔기 +1';
  }
}

/* ═══════════════════════════════════════════════════
   탄막 패턴 (제너레이터 기반 — 추가는 함수 하나로 끝)
   ═══════════════════════════════════════════════════ */
function PatternRunner(gen){ this.gen = gen; this.wait = 0; this.done = false; }
PatternRunner.prototype.step = function(){
  if (this.done) return;
  if (this.wait > 0){ this.wait--; return; }
  const r = this.gen.next();
  if (r.done){ this.done = true; return; }
  this.wait = Math.max(0, Math.round(r.value || 0));
};

// 히트박스가 기체 크기로 커지면서 피격 면적이 25배가 되었으므로,
// 회피가 성립하도록 전역 밀도/속도를 함께 내린다. (실측으로 역산한 값)
const DENS_SCALE = 0.75;
const SPD_SCALE  = 0.82;
const iv = n => Math.max(2, Math.round(n / (D.dens * DENS_SCALE)));  // 간격: 밀도 높을수록 짧게
const sp = v => v * D.spd * SPD_SCALE;                                // 속도 배율
function aimAngle(fx, fy){ return Math.atan2(player.y - fy, player.x - fx); }
const bs = () => G.boss;

// ── Phase 0 : 논스펠 「난사」
function* pat_nonspell(){
  let t = 0;
  while (true){
    const b = bs();
    // 조준 3-way
    const a = aimAngle(b.x, b.y);
    for (let i=-1;i<=1;i++) spawnBullet(b.x, b.y, a + i*0.26, sp(2.5), 'aim');
    Sound.enemyShot();
    yield iv(20);
    // 낙하탄
    for (let k=0;k<2;k++){
      spawnBullet(PF.x + 20 + Math.random()*(PF.w-40), PF.y - 10,
                  Math.PI/2 + (Math.random()-0.5)*0.5, sp(1.7 + Math.random()*0.6), 'fall');
    }
    t++;
    yield iv(18);
  }
}

// 틈이 있는 낙하 벽 (읽고 파고드는 재미)
function wallDrop(count, gapW, speed, kind){
  const gapAt = 1 + Math.floor(Math.random() * (count - gapW - 1));
  const step = PF.w / (count - 1);
  for (let i=0;i<count;i++){
    if (i >= gapAt && i < gapAt + gapW) continue;
    spawnBullet(PF.x + i*step, PF.y - 12, Math.PI/2, speed, kind || 'fall');
  }
}

// ── Phase 1 : 「환상의 회전목마」
function* pat_ring(){
  let ang = 0;
  let wave = 0;
  while (true){
    const b = bs();
    const count = 10;
    for (let i=0;i<count;i++){
      spawnBullet(b.x, b.y, ang + i*TAU/count, sp(2.2), 'ring');
    }
    // 역회전 보조 링 (간헐)
    if (wave % 4 === 3){
      for (let i=0;i<6;i++) spawnBullet(b.x, b.y, -ang*1.6 + i*TAU/6, sp(1.5), 'burst');
    }
    Sound.enemyShot();
    ang += GOLDEN;
    wave++;
    yield iv(15);
  }
}

// ── Phase 2 : 「추격의 십자포화」  (세로 낙하벽 × 가로 레이저 = 십자)
function* pat_cross(){
  let t = 0;
  while (true){
    const b = bs();
    // 조준 5-way
    const a = aimAngle(b.x, b.y);
    for (let i=-1;i<=1;i++) spawnBullet(b.x, b.y, a + i*0.22, sp(3.0), 'aim');
    Sound.enemyShot();
    yield iv(20);

    // 좌우 벽 수평 레이저탄
    const fromLeft = (t % 2 === 0);
    const y0 = PF.y + 70 + Math.random()*(PF.h - 170);
    for (let k=0;k<3;k++){
      spawnBullet(fromLeft ? PF.x-12 : PF.x+PF.w+12, y0 + k*26,
                  fromLeft ? 0 : Math.PI, sp(5.2), 'laser');
    }
    yield iv(18);

    // 조준 3-way (빠른 추격탄)
    const a2 = aimAngle(b.x, b.y);
    for (let i=-1;i<=1;i++) spawnBullet(b.x, b.y, a2 + i*0.11, sp(3.8), 'aim');
    yield iv(18);

    // 틈 있는 낙하벽 (2사이클마다)
    if (t % 2 === 1) wallDrop(9, 3, sp(1.9), 'fall');
    t++;
    yield iv(18);
  }
}

// ── Phase 3 : 「종막・만개」
function* pat_bloom(){
  let ang = 0, t = 0;
  while (true){
    const b = bs();
    // 회전 링 (약간 느리게)
    for (let i=0;i<9;i++) spawnBullet(b.x, b.y, ang + i*TAU/9, sp(2.0), 'ring');
    ang += GOLDEN;
    yield iv(13);

    // 조준 산탄
    const a = aimAngle(b.x, b.y);
    for (let i=-1;i<=1;i++) spawnBullet(b.x, b.y, a + i*0.30, sp(2.9), 'aim');
    Sound.enemyShot();
    yield iv(13);

    // 폭발 씨앗탄
    const seedA = aimAngle(b.x, b.y) + (Math.random()-0.5)*0.9;
    spawnBullet(b.x, b.y, seedA, sp(1.6), 'seed',
                { fuse: 58, burstN: 10, burstSpd: sp(2.1) });
    yield iv(13);

    // 4사이클마다 레이저 교차 (앞 페이즈 요소 회수)
    if (t % 4 === 3){
      const fromLeft = Math.random() < 0.5;
      const y0 = PF.y + 90 + Math.random()*(PF.h - 200);
      for (let k=0;k<3;k++)
        spawnBullet(fromLeft ? PF.x-12 : PF.x+PF.w+12, y0 + k*28,
                    fromLeft ? 0 : Math.PI, sp(5.0), 'laser');
    }
    t++;
    yield iv(13);
  }
}

const PATTERNS = [pat_nonspell, pat_ring, pat_cross, pat_bloom];

/* ═══════════════════════════════════════════════════
   스테이지 구간 — 적 웨이브 + 중간보스
   ═══════════════════════════════════════════════════ */
function newSquad(count){
  const id = squadSeq++;
  G.squads[id] = { total: count, escaped: false, rewarded: false };
  return id;
}
function markEscaped(id){ const r = G.squads[id]; if (r) r.escaped = true; }
function checkSquadWipe(id, x, y){
  const r = G.squads[id];
  if (!r || r.rewarded || r.escaped) return;
  if (squadAlive(id)) return;
  r.rewarded = true;
  G.squadsWiped++;
  G.bonusSquad += 20000;
  addScore(20000);
  spawnPower(x, y, 3);
  if (Math.random() < 0.55) spawnSpecial(x, y);   // 편대 전멸 보상 (희소성 유지를 위해 확률)
  G.banner = 80; G.bannerText = 'SQUAD WIPE  +20,000';
  Sound.squadWipe();
  spawnRing(x, y, 92, 34, '#ffe66d', 3);
  for (let k=0;k<18;k++){
    const a = Math.random()*TAU, v = 1.5+Math.random()*4.5;
    spawnPart(x, y, Math.cos(a)*v, Math.sin(a)*v, 26+Math.random()*18, '#ffe66d', 2.2, 'spark');
  }
}

function killEnemy(e){
  e.on = false;
  G.enemiesKilled++;
  const boss = (e.type === 'midboss');
  addScore(boss ? 80000 : (e.type === 'turret' ? 5000 : 3000));
  // 협동에서는 아이템을 나눠 먹으므로 인원수에 맞춰 드랍을 늘린다
  const cn = coopAlive();
  spawnPower(e.x, e.y, e.dropPower * cn);   // 인원수만큼 드랍 — 각자 솔로만큼 파밍되게
  if (boss){ for (let k=0;k<cn;k++){ spawnSpecial(e.x - 22 + k*14, e.y); spawnSpecial(e.x + 22 - k*14, e.y); } }
  else if (e.type === 'turret' && Math.random() < 0.25 * cn) spawnSpecial(e.x, e.y);
  explode(e.x, e.y, boss ? 3.2 : 1.0, boss ? '#fff0b0' : '#ffd07a', boss ? '#7a5560' : '#6b4a52');
  if (boss){ shake = Math.max(shake, 16); flash = 0.6; Sound.defeat(); clearBullets(true); }
  else Sound.enemyDie();
  if (e.squad >= 0) checkSquadWipe(e.squad, e.x, e.y);
}

function updateEnemies(){
  for (let i=0;i<MAX_ENEMY;i++){
    const e = enemies[i];
    if (!e.on) continue;
    e.t++;
    if (e.hitFlash > 0) e.hitFlash--;

    switch(e.type){
      case 'straight':
        e.x += e.vx; e.y += e.vy;
        if (--e.fireTick <= 0){
          e.fireTick = iv(80);
          spawnBullet(e.x, e.y, aimAngle(e.x, e.y), sp(2.6), 'aim');
          Sound.enemyShot();
        }
        break;

      case 'sine':
        if (e.y < e.homeY && !e.leaving) e.y += sp(2.2);
        else if (!e.leaving){
          e.x = e.baseX + Math.sin(e.t*0.028)*e.amp;
          e.y = e.homeY + Math.sin(e.t*0.019)*14;
          if (--e.fireTick <= 0){
            e.fireTick = iv(95);
            const a = aimAngle(e.x, e.y);
            for (let k=-1;k<=1;k++) spawnBullet(e.x, e.y, a + k*0.22, sp(2.3), 'fall');
            Sound.enemyShot();
          }
        }
        if (e.t > 560) e.leaving = true;
        if (e.leaving) e.y += sp(2.6);
        break;

      case 'turret':
        if (e.y < e.homeY && !e.leaving) e.y += sp(1.6);
        else if (!e.leaving){
          if (--e.fireTick <= 0){
            e.fireTick = iv(105);
            e.bursts = (e.bursts || 0) + 1;
            const base = Math.random()*TAU, n = 7;
            for (let k=0;k<n;k++) spawnBullet(e.x, e.y, base + k*TAU/n, sp(1.9), 'burst');
            Sound.enemyShot();
            if (e.bursts >= 3) e.leaving = true;
          }
        } else e.y -= sp(1.5);
        break;

      case 'midboss':
        if (e.y < e.homeY) e.y += sp(1.5);
        else {
          e.x = e.baseX + Math.sin(e.t*0.014)*115;
          e.y = e.homeY + Math.sin(e.t*0.02)*16;
          if (--e.fireTick <= 0){
            if (Math.floor(e.t / 300) % 2 === 0){       // 나선 링
              e.fireTick = Math.max(3, iv(16));
              e.ang = (e.ang || 0) + 0.42;
              for (let k=0;k<5;k++) spawnBullet(e.x, e.y, e.ang + k*TAU/5, sp(2.1), 'ring');
            } else {                                     // 조준 산탄
              e.fireTick = iv(40);
              const a = aimAngle(e.x, e.y);
              for (let k=-1;k<=1;k++) spawnBullet(e.x, e.y, a + k*0.26, sp(2.7), 'aim');
            }
            Sound.enemyShot();
          }
        }
        break;
    }

    // 화면 밖 이탈 (스폰 직후 40프레임은 유예)
    if (e.type !== 'midboss' && e.t > 40 &&
        (e.y > PF.y+PF.h+40 || e.y < PF.y-130 || e.x < PF.x-90 || e.x > PF.x+PF.w+90)){
      if (e.squad >= 0) markEscaped(e.squad);
      e.on = false;
    }
  }
}

/* ── 편대 정의 ── */
function* squadStraight(count, dir){
  const id = newSquad(count);
  const x = dir > 0 ? PF.x + 70 : PF.x + PF.w - 70;
  for (let i=0;i<count;i++){
    spawnEnemy(x, PF.y - 20, 'straight', id, { vy: sp(1.9), vx: dir*0.55 });
    yield 12;
  }
}
function* squadSine(count){
  const id = newSquad(count);
  for (let i=0;i<count;i++){
    const bx = PF.x + 95 + (i % 3) * 145;
    spawnEnemy(bx, PF.y - 20, 'sine', id, { homeY: PF.y + 105 + (i%2)*62, baseX: bx, amp: 68 });
    yield 14;
  }
}
function* squadTurret(count){
  const id = newSquad(count);
  for (let i=0;i<count;i++){
    const bx = PF.x + 110 + i * 130;
    spawnEnemy(bx, PF.y - 20, 'turret', id, { homeY: PF.y + 118 + (i%2)*44 });
    yield 20;
  }
}

/* ── 스테이지 진행 스크립트 (약 60초) ── */
function* stageScript(){
  yield 100;

  G.stage.waveName = 'WAVE 1';
  G.banner = 80; G.bannerText = 'WAVE 1';
  yield* squadStraight(5, 1);
  yield 100;
  yield* squadStraight(5, -1);
  yield 230;

  G.stage.waveName = 'WAVE 2';
  G.banner = 80; G.bannerText = 'WAVE 2';
  yield* squadSine(6);
  yield 180;
  yield* squadStraight(6, 1);
  yield 140;
  yield* squadStraight(6, -1);
  yield 240;

  G.stage.waveName = 'WAVE 3';
  G.banner = 80; G.bannerText = 'WAVE 3';
  yield* squadTurret(3);
  yield 200;
  yield* squadSine(6);
  yield 160;
  yield* squadStraight(6, 1);
  yield 250;

  G.stage.waveName = 'MID-BOSS';
  G.banner = 120; G.bannerText = 'MID-BOSS';
  Sound.spell();
  const mb = spawnEnemy(LW/2, PF.y - 60, 'midboss', -1, { homeY: PF.y + 130, baseX: LW/2 });
  G.stage.midboss = mb;
  while (mb && mb.on) yield 8;
  G.stage.midboss = null;
  yield 100;

  G.stage.done = true;
}

function updateStage(){
  const r = G.stage.runner;
  if (r && !r.done) r.step();
  if (G.stage.done && G.mode === 'STAGE'){
    G.mode = 'BOSS';
    clearBullets(true);
    clearEnemies();
    G.boss.t = 0;
    startPhase(0);
  }
}

/* ═══════════════════════════════════════════════════
   보스 페이즈 사이 잡몹 구간 (인터루드)
   논스펠 → 잡몹 → 스펠1 → 잡몹 → 스펠2 → 잡몹 → 스펠3
   ═══════════════════════════════════════════════════ */
// 뒤로 갈수록 무겁게. 보스전 사이의 숨통이자 파워 보충 기회.
function* interlude0(){          // 논스펠 직후 — 가볍게 (약 16초)
  yield 70;
  yield* squadStraight(5, 1);
  yield 230;
  yield* squadStraight(5, -1);
  yield 240;
  yield* squadStraight(6, 1);
  yield 170;
}
function* interlude1(){          // 스펠1 직후 — 중간 (약 19초)
  yield 70;
  yield* squadSine(6);
  yield 270;
  yield* squadStraight(6, -1);
  yield 220;
  yield* squadSine(6);
  yield 200;
  yield* squadStraight(6, 1);
  yield 160;
}
function* interlude2(){          // 스펠2 직후 — 가장 무겁게 (약 22초)
  yield 70;
  yield* squadTurret(3);
  yield 290;
  yield* squadSine(6);
  yield 210;
  yield* squadStraight(6, 1);
  yield 150;
  yield* squadStraight(6, -1);
  yield 180;
}
const INTERLUDES = [interlude0, interlude1, interlude2];

function startInterlude(afterPhase){
  reviveIfDown();
  G.mode = 'INTERLUDE';
  G.interlude = {
    idx: afterPhase,
    runner: new PatternRunner(INTERLUDES[afterPhase]()),
    waitOut: 0,
  };
  G.stage.waveName = 'INTERCEPT ' + (afterPhase + 1);
  G.banner = 110; G.bannerText = 'INTERCEPT ' + (afterPhase + 1);
  Sound.spell();
}

function updateInterlude(){
  const il = G.interlude;
  // 보스는 위로 이탈했다가 다음 스펠카드에서 재진입
  const b = G.boss;
  b.t++;
  b.y += ((PF.y - 100) - b.y) * 0.045;
  b.x += ((LW/2) - b.x) * 0.03;

  if (il.runner && !il.runner.done) il.runner.step();
  else if (liveEnemies() === 0){
    // 편대를 다 정리했으면 잠깐 숨 고르고 다음 스펠카드로
    if (++il.waitOut > 70){
      G.mode = 'BOSS';
      clearBullets(true);
      startPhase(il.idx + 1);
    }
  }
}

function reviveIfDown(){
  if (!Net.isOnline() || !G.spectating) return;
  G.spectating = false;
  if (Net.players[Net.mySlot]) Net.players[Net.mySlot].spectating = false;
  G.lives = 1;
  player.power = 0; player.shield = 0; player.homing = 0;
  player.invuln = 180; player.pendingDeath = -1;
  player.x = LW/2; player.y = PF.y + PF.h - 90;
  G.banner = 130; G.bannerText = 'RESPAWN';
  Sound.extend();
}

function startPhase(i){
  reviveIfDown();
  G.phase = i;
  G.phaseHPMax = PHASE_HP * D.hp * (PHASE_HP_SCALE[i] || 1) * coopHP();
  G.phaseHP = G.phaseHPMax;
  G.phaseTimer = PHASE_TIME;
  G.phaseNoMiss = true; G.phaseNoBomb = true;
  G.runner = new PatternRunner(PATTERNS[i]());
  G.transition = 50;
  G.banner = 150;
  G.bannerText = null;
  G.tint = SPELLS[i].tint;
  clearBullets(false);
  Sound.spell();
}

/* ═══════════════════════════════════════════════════
   업데이트
   ═══════════════════════════════════════════════════ */
function updatePlayer(){
  if (G.spectating){ if (player.invuln > 0) player.invuln--; return; }
  // ── 이동
  let dx = 0, dy = 0;
  let usingTouch = Input.touch.active;

  if (usingTouch){
    const tx = Input.touch.x;
    const ty = Input.touch.y - 60;   // 손가락 위 60px에 자기 배치
    const ddx = tx - player.x, ddy = ty - player.y;
    const dist = Math.hypot(ddx, ddy);
    // 손가락 이동 속도로 저속 자동 판정
    const moved = Math.hypot(Input.touch.x - Input.touch.px, Input.touch.y - Input.touch.py);
    Input.touch.speed = Input.touch.speed * 0.7 + moved * 0.3;
    Input.touch.px = Input.touch.x; Input.touch.py = Input.touch.y;
    player.slow = Input.touch.speed < 1.6;
    const maxStep = player.slow ? 2.6 : 6.5;
    if (dist > 0.5){
      const step = Math.min(dist, maxStep);
      dx = ddx / dist * step; dy = ddy / dist * step;
    }
  } else {
    player.slow = Input.isDown('SLOW');
    const sp2 = player.slow ? 2.0 : 5.0;
    if (Input.isDown('L')) dx -= 1;
    if (Input.isDown('R')) dx += 1;
    if (Input.isDown('U')) dy -= 1;
    if (Input.isDown('D')) dy += 1;
    if (dx && dy){ const k = Math.SQRT1_2; dx*=k; dy*=k; }
    dx *= sp2; dy *= sp2;
  }

  // 뱅킹용 좌우 속도 평활 (키보드·터치 양쪽 모두 실제 이동량 기준)
  player.vxSmooth = player.vxSmooth * 0.80 + dx * 0.20;
  const bankTarget = Math.max(-1, Math.min(1, player.vxSmooth / 4.2)) * 0.95;
  player.bank += (bankTarget - player.bank) * 0.16;

  player.x += dx; player.y += dy;
  const m = 10;
  player.x = Math.max(PF.x+m, Math.min(PF.x+PF.w-m, player.x));
  player.y = Math.max(PF.y+m, Math.min(PF.y+PF.h-m, player.y));

  // 트레일
  player.trail.unshift({x:player.x, y:player.y});
  if (player.trail.length > 9) player.trail.pop();

  // ── 자동 발사 (파워 레벨에 따라 화력 상승)
  player.fireTick--;
  if (player.fireTick <= 0 && !G.finished && !G.spectating){
    const cfg = POWER_TABLE[powerLv()];
    player.fireTick = cfg.interval;
    // 정면 2줄은 항상
    const nz = 7 * PLAYER_SCALE, ny = 14 * PLAYER_SCALE;
    spawnPShot(player.x - nz, player.y - ny, 0, -16, cfg.dmg);
    spawnPShot(player.x + nz, player.y - ny, 0, -16, cfg.dmg);
    // 옵션 — 파워 레벨만큼 늘어남
    for (const p of podPositions()){
      // 포드는 살짝 안쪽으로 수렴 — 벌어지면 보스에게 거의 맞지 않는다
      const a = -p.side * (player.slow ? 0.075 : 0.040) * (1 + p.tier*0.6);
      spawnPShot(player.x + p.x, player.y + p.y, Math.sin(a)*14, -Math.cos(a)*14, cfg.dmg);
    }
    Sound.shot();
  }

  // ── 유도 미사일
  if (player.homing > 0 && !G.finished){
    player.homing--;
    if (--player.homingTick <= 0){
      player.homingTick = HOMING_EVERY;
      for (const s of [-1, 1]){
        const m = spawnPShot(player.x + s*16, player.y + 6, s*3.2, -4, HOMING_DMG, true);
        if (m) m.life = 0;
      }
      Sound.homing();
    }
  }

  // ── 봄
  if (Input.wasPressed('BOMB') && player.bombTime <= 0 && G.bombs > 0 && !G.finished){
    G.bombs--;
    G.phaseNoBomb = false;
    G.grazeCombo = 0;                 // 봄 = 그레이즈 콤보 리셋
    player.bombTime = 180;            // 3초
    player.invuln = Math.max(player.invuln, 180);
    if (player.pendingDeath >= 0){ player.pendingDeath = -1; }  // 데스봄 성립
    // 탄 소거 → 점수 아이템
    addScore(countLiveBullets() * 10);
    clearBullets(true);
    flash = 1.0; shake = 16;
    netSendEvent('bomb', { x: player.x, y: player.y });
    spawnRing(player.x, player.y, 520, 70, C.player, 5);
    spawnRing(player.x, player.y, 300, 46, '#ffffff', 3);
    for (let i=0;i<40;i++){
      const a = Math.random()*TAU, v = 4+Math.random()*7;
      spawnPart(player.x, player.y, Math.cos(a)*v, Math.sin(a)*v, 34+Math.random()*24, C.player, 2.4, 'spark');
    }
    Sound.bomb();
  }
  if (player.bombTime > 0){
    player.bombTime--;
    if (G.mode === 'BOSS' && G.boss.alive) damageBoss(30/60);
    else if (G.mode === 'STAGE'){
      for (let i=0;i<MAX_ENEMY;i++){
        const e = enemies[i];
        if (e.on){ e.hp -= 45/60; e.hitFlash = 3; if (e.hp <= 0) killEnemy(e); }
      }
    }
    // 봄 중에도 새로 들어온 탄은 계속 소거
    const rad = 90 + (180-player.bombTime)*2.2, rad2 = rad*rad;
    for (let i=0;i<active.length;i++){
      const b = active[i];
      if (!b.on) continue;
      const dx = b.x-player.x, dy = b.y-player.y;
      if (dx*dx+dy*dy < rad2){ killBullet(b); spawnItem(b.x,b.y); addScore(10); }
    }
  }

  // ── 데스봄 유예 처리
  if (player.pendingDeath >= 0){
    player.pendingDeath--;
    if (player.pendingDeath < 0) doDeath();
  }

  if (player.invuln > 0) player.invuln--;
}

function doDeath(){
  // 실드가 있으면 피격 1회를 대신 막는다 (잔기·파워 보존)
  if (player.shield > 0){
    player.shield--;
    player.invuln = Math.max(player.invuln, 100);
    addScore(countLiveBullets() * 10);
    clearBullets(true);
    shake = 12; flash = 0.35;
    spawnRing(player.x, player.y, 120, 30, C.itemShield, 3.2);
    for (let i=0;i<26;i++){
      const a = Math.random()*TAU, v = 2.5+Math.random()*4.5;
      spawnPart(player.x, player.y, Math.cos(a)*v, Math.sin(a)*v, 22+Math.random()*16, C.itemShield, 2, 'spark');
    }
    G.banner = 70; G.bannerText = 'SHIELD BROKEN';
    G.shieldsUsed++;
    Sound.shieldBreak();
    return;
  }
  G.lives--;
  G.phaseNoMiss = false;
  G.grazeCombo = 0;
  player.invuln = 120;
  player.bombTime = 0;
  G.bombs = 3;
  addScore(countLiveBullets() * 10);
  clearBullets(true);
  // 피격 = 파워 한 단계 강등. 바로 아래 레벨의 바닥까지 떨어진다 (예: 3.8 → 2.0)
  const target = Math.max(0, Math.floor(player.power) - 1);
  const lost = player.power - target;
  if (lost > 0){
    player.power = target;
    const n = Math.min(18, Math.round(lost / POWER_PER_ITEM));
    for (let k=0;k<n;k++)
      spawnItem(player.x + (Math.random()-0.5)*150,
                player.y - 30 - Math.random()*110, 'power');
  }
  shake = 22; vignette = 1.0; flash = 0.5;
  explode(player.x, player.y, 2.4, '#ffd0a0', '#7a4550');
  spawnRing(player.x, player.y, 150, 40, '#ff4466', 3);
  netSendEvent('hit', { x: player.x, y: player.y });
  Sound.hit();
  // 리스폰 위치
  player.x = LW/2; player.y = PF.y + PF.h - 90;
  if (G.lives < 0){
    if (Net.isOnline()){
      // 온라인 협동: 잔기가 떨어지면 관전 → 다음 구간에서 부활
      G.spectating = true;
      G.lives = 0;
      G.banner = 140; G.bannerText = 'DOWN — 다음 구간에 부활';
      Net.players[Net.mySlot].spectating = true;
      netSendEvent('over', {});
      // 참가자 전원이 관전 상태면 게임오버
      const alive = Net.players.filter(p => p.present && !p.spectating).length;
      if (alive === 0) endRun(false);
    } else {
      endRun(false);
    }
  }
}

function damageBoss(dmg){
  if (!G.boss.alive || G.transition > 0) return;
  const applied = Math.min(dmg, G.phaseHP);   // 오버킬 분은 점수에 넣지 않음
  G.phaseHP -= applied;
  addScore(applied * 50);
  if (G.phaseHP <= 0){
    G.phaseHP = 0;
    finishPhase(true);
  }
}

function finishPhase(cleared){
  if (cleared){
    if (G.phaseNoMiss){ G.bonusNoMiss += 50000; addScore(50000); }
    if (G.phaseNoBomb){ G.bonusNoBomb += 30000; addScore(30000); }
  }
  clearBullets(true);   // 남은 탄 → 점수 아이템
  flash = 0.8; shake = 12;
  explode(G.boss.x, G.boss.y, 3.0, '#ffd6f0', '#6b3a58');
  spawnRing(G.boss.x, G.boss.y, 340, 52, C.eRing, 4);
  if (G.phase >= SPELLS.length - 1){
    G.boss.alive = false;
    G.boss.deadTimer = 110;
    Sound.defeat();
  } else {
    startInterlude(G.phase);   // 다음 스펠카드 전에 잡몹 요격 구간
  }
}

function updateBoss(){
  const b = G.boss;
  if (!b.alive){
    if (b.deadTimer > 0){
      b.deadTimer--;
      if (b.deadTimer % 6 === 0){
        explode(b.x + (Math.random()-0.5)*60, b.y + (Math.random()-0.5)*60,
                1.8, '#fff0c0', '#6b4a58');
        shake = Math.max(shake, 8);
      }
      if (b.deadTimer === 0) endRun(true);
    }
    return;
  }
  b.t++;
  // 페이즈별 이동
  const cx = LW/2;
  let tx = b.x, ty = b.y;
  switch(G.phase){
    case 0: tx = cx + Math.sin(b.t*0.018)*110; ty = PF.y + 110 + Math.sin(b.t*0.031)*18; break;
    case 1: tx = cx + Math.sin(b.t*0.012)*70;  ty = PF.y + 125 + Math.cos(b.t*0.016)*30; break;
    case 2: tx = cx + Math.sin(b.t*0.024)*120; ty = PF.y + 100 + Math.sin(b.t*0.05)*12;  break;
    case 3: tx = cx + Math.sin(b.t*0.02)*95 + Math.sin(b.t*0.007)*30;
            ty = PF.y + 120 + Math.cos(b.t*0.023)*36; break;
  }
  if (G.transition > 0){   // 잡몹 구간에서 물러났다가 부드럽게 재진입
    b.x += (tx - b.x) * 0.12;
    b.y += (ty - b.y) * 0.12;
  } else { b.x = tx; b.y = ty; }

  if (G.transition > 0){ G.transition--; return; }

  G.runner.step();
  G.phaseTimer--;
  if (G.phaseTimer <= 0) finishPhase(false);   // 타임아웃 — 보너스 없음
}

function updateBullets(){
  // 뒤에서부터 순회 + 스왑 제거 (이번 프레임에 새로 생긴 탄은 다음 프레임부터 처리)
  for (let i = active.length - 1; i >= 0; i--){
    const b = active[i];
    if (!b.on){
      active[i] = active[active.length-1]; active.pop(); bulletFree.push(b);
      continue;
    }
    b.x += b.vx; b.y += b.vy; b.life++;

    // 폭발 씨앗
    if (b.fuse > 0){
      b.fuse--;
      if (b.fuse === 0){
        const base = Math.random()*TAU;
        for (let k=0;k<b.burstN;k++)
          spawnBullet(b.x, b.y, base + k*TAU/b.burstN, b.burstSpd, 'burst');
        spawnRing(b.x, b.y, 40, 16, '#ff8a3d', 2);
        for (let k=0;k<8;k++){
          const a=Math.random()*TAU, v=1.4+Math.random()*3;
          spawnPart(b.x,b.y,Math.cos(a)*v,Math.sin(a)*v,16,'#ffb060',1.8,'spark');
        }
        Sound.enemyShot();
        b.on = false;
        active[i] = active[active.length-1]; active.pop(); bulletFree.push(b);
        continue;
      }
    }

    // 화면 밖 제거
    if (b.x < PF.x-40 || b.x > PF.x+PF.w+40 || b.y < PF.y-60 || b.y > PF.y+PF.h+50){
      b.on = false;
      active[i] = active[active.length-1]; active.pop(); bulletFree.push(b);
      continue;
    }

    // 판정 (무적/봄 중엔 그레이즈만)
    const dx = b.x - player.x, dy = b.y - player.y;
    const d2 = dx*dx + dy*dy;
    const gr = player.grazeR + b.r;
    if (d2 < gr*gr){
      if (!b.grazed){
        b.grazed = true;
        G.graze++; G.grazeCombo++;
        addScore(100 * D.grazeMul);
        Sound.graze(G.grazeCombo);
        const a = Math.atan2(dy,dx);
        spawnPart(b.x, b.y, Math.cos(a)*1.5, Math.sin(a)*1.5, 18, '#ffffff', 2);
      }
      const hr = player.hitR + b.r * 0.72;
      if (d2 < hr*hr && player.invuln <= 0 && player.pendingDeath < 0 && !G.finished){
        player.pendingDeath = 9;    // 0.15초 데스봄 유예
        shake = Math.max(shake, 8);
      }
    }
  }
  bulletCount = active.length;
}

function updatePShots(){
  const b = G.boss;
  const bossR = 42;   // 코어 + 안쪽 링에 맞춘 반경
  // 데미지 판정은 호스트 한 곳에서만 한다. 클라이언트는 자탄을 "보여주기 위해"
  // 똑같이 날려 보내기만 한다 (직선이라 호스트 쪽과 눈에 띄게 어긋나지 않는다).
  // 데미지 판정은 호스트만 한다. 다만 게스트에서도 "맞으면 사라지는" 것까지 막아 버리면
  // 자탄이 보스를 관통해 계속 날아가고 유도탄은 150프레임 내내 궤도를 돈다 —
  // 최종 보스에서 화면이 미사일 잔상으로 뒤덮이던 원인이다. 소멸은 양쪽에서 똑같이 한다.
  const visualOnly = Net.isOnline() && !Net.isHost();
  const bossAlive  = visualOnly ? NetWorld.boss.alive : b.alive;
  const bossHittable = (G.mode === 'BOSS' && bossAlive && G.transition <= 0);
  const bx = visualOnly ? NetWorld.boss.x : b.x;
  const by = visualOnly ? NetWorld.boss.y : b.y;
  for (let i=0;i<MAX_PSHOT;i++){
    const s = pshots[i];
    if (!s.on) continue;
    if (s.homing){
      s.life++;
      const t = homingTarget(s.x, s.y);
      if (t){
        const want = Math.atan2(t.y - s.y, t.x - s.x);
        const cur = Math.atan2(s.vy, s.vx);
        let dA = want - cur;
        while (dA >  Math.PI) dA -= TAU;
        while (dA < -Math.PI) dA += TAU;
        const turn = Math.max(-0.20, Math.min(0.20, dA));
        const spd = Math.min(13, Math.hypot(s.vx, s.vy) + 0.55);
        s.vx = Math.cos(cur + turn) * spd;
        s.vy = Math.sin(cur + turn) * spd;
      } else {
        s.vy -= 0.35;
      }
      if (s.life % 3 === 0)
        spawnPart(s.x, s.y, (Math.random()-0.5)*0.6, (Math.random()-0.5)*0.6, 14, 'rgba(160,240,255,1)', 2);
      if (s.life > 150){ s.on = false; continue; }
    }
    s.x += s.vx; s.y += s.vy;
    if (s.y < PF.y-30 || s.x < PF.x-40 || s.x > PF.x+PF.w+40 || s.y > PF.y+PF.h+40){ s.on=false; continue; }

    if (bossHittable){
      const dx = s.x-bx, dy = s.y-by;
      if (dx*dx+dy*dy < bossR*bossR){
        s.on = false;
        if (!visualOnly) damageBoss(s.dmg);
        for (let q=0;q<2;q++){
          const a = -Math.PI/2 + (Math.random()-0.5)*1.8, v = 1.2+Math.random()*2.2;
          spawnPart(s.x, s.y, Math.cos(a)*v, Math.sin(a)*v, 10+Math.random()*7, '#ffffff', 1.6, 'spark');
        }
        continue;
      }
    }
    // 잡몹 / 중간보스 피격
    if (visualOnly){
      // 게스트: 데미지는 없지만 같은 자리에서 사라지고 같은 불꽃을 낸다
      const es = NetWorld.enemies;
      for (let k=0;k<es.length;k++){
        const e = es[k];
        const r = ETYPE_R[e.type] || 15;
        const dx = s.x-e.x, dy = s.y-e.y;
        if (dx*dx+dy*dy < r*r){
          s.on = false;
          for (let q=0;q<2;q++){
            const a = -Math.PI/2 + (Math.random()-0.5)*1.6, v = 1.2+Math.random()*2;
            spawnPart(s.x, s.y, Math.cos(a)*v, Math.sin(a)*v, 10+Math.random()*7, '#ffffff', 1.6, 'spark');
          }
          break;
        }
      }
      continue;
    }
    for (let k=0;k<MAX_ENEMY;k++){
      const e = enemies[k];
      if (!e.on) continue;
      const dx = s.x-e.x, dy = s.y-e.y;
      if (dx*dx+dy*dy < e.r*e.r){
        s.on = false;
        e.hp -= s.dmg; e.hitFlash = 4;
        addScore(s.dmg * 20);
        for (let q=0;q<2;q++){
          const a = -Math.PI/2 + (Math.random()-0.5)*1.6, v = 1.2+Math.random()*2;
          spawnPart(s.x, s.y, Math.cos(a)*v, Math.sin(a)*v, 9+Math.random()*6, '#ffe9c0', 1.6, 'spark');
        }
        if (e.hp <= 0) killEnemy(e);
        break;
      }
    }
  }
}

// 협동에서는 아이템이 "가장 가까운 플레이어"에게 끌려가야 한다.
// (예전엔 호스트 기체만 끌어당겨서 클라이언트는 파워를 거의 못 먹었다)
const _magT = { x: 0, y: 0 };
function nearestCoopPlayer(x, y){
  _magT.x = player.x; _magT.y = player.y;
  if (!Net.isOnline()) return _magT;
  let bd = G.spectating ? Infinity : ((player.x-x)*(player.x-x) + (player.y-y)*(player.y-y));
  for (let i=0;i<MAX_PLAYERS;i++){
    if (i === Net.mySlot) continue;
    const q = Net.players[i];
    if (!q.present || q.spectating) continue;
    const dd = (q.x-x)*(q.x-x) + (q.y-y)*(q.y-y);
    if (dd < bd){ bd = dd; _magT.x = q.x; _magT.y = q.y; }
  }
  return _magT;
}

function updateItems(){
  for (let i=0;i<MAX_ITEM;i++){
    const it = items[i];
    if (!it.on) continue;
    it.life++;
    // 끌림은 가장 가까운 플레이어 기준, 실제 획득은 호스트 자기 기체만 (원격은 pick 이벤트로 처리)
    const mt = nearestCoopPlayer(it.x, it.y);
    const dx = mt.x - it.x, dy = mt.y - it.y;
    const d = Math.hypot(dx,dy) || 1;
    const sdx = player.x - it.x, sdy = player.y - it.y;
    const sd = Math.hypot(sdx, sdy) || 1;

    if (it.kind !== 'score'){
      // 파밍 대상 — 천천히 낙하하며, 어느 정도 가까워지면 끌려온다
      const special = it.kind !== 'power';
      const mag = special ? ITEM_MAGNET_R * 1.35 : ITEM_MAGNET_R;   // 보조 아이템은 더 잘 끌림
      it.vy += 0.050;
      if (d < mag){
        const s = 0.55 + (1 - d/mag) * 0.55;   // 가까울수록 강하게
        it.vx += dx/d * s; it.vy += dy/d * s;
      }
      it.vx *= 0.97;
      it.vy = Math.min(it.vy * 0.99, 3.1);
      it.x += it.vx; it.y += it.vy;
      if (sd < ITEM_PICKUP_R + (special ? 6 : 0) && !G.spectating){
        it.on = false;
        if (it.kind === 'power'){
          addPower(POWER_PER_ITEM); addScore(200);
          if (Math.random() < 0.5) Sound.item();
        } else if (it.kind === 'homing'){
          player.homing = Math.min(HOMING_TIME * 2, player.homing + HOMING_TIME);
          player.homingTick = 1;
          addScore(3000); G.pickups.homing++;
          G.banner = 70; G.bannerText = 'HOMING MISSILE';
          Sound.powerUp();
        } else if (it.kind === 'bomb'){
          G.bombs = Math.min(BOMB_MAX, G.bombs + 1);
          addScore(3000); G.pickups.bomb++;
          G.banner = 70; G.bannerText = 'BOMB +1';
          Sound.powerUp();
        } else if (it.kind === 'shield'){
          player.shield = Math.min(SHIELD_MAX, player.shield + 1);
          addScore(3000); G.pickups.shield++;
          G.banner = 70; G.bannerText = 'SHIELD ON';
          Sound.powerUp();
        }
        continue;
      }
      if (it.y > PF.y + PF.h + 24 || it.life > 900) it.on = false;
    } else {
      // 점수 아이템 — 강하게 흡수
      const pull = Math.min(0.9, it.life*0.012);
      it.vx += dx/d * pull; it.vy += dy/d * pull + 0.05;
      it.vx *= 0.94; it.vy *= 0.94;
      it.x += it.vx; it.y += it.vy;
      if (sd < 18 || it.life > 200){
        it.on = false;
        if (sd < 18){ addScore(500); if (Math.random()<0.25) Sound.item(); }
      }
    }
  }
}

function updateParts(){
  for (let i=0;i<MAX_PART;i++){
    const p = parts[i];
    if (!p.on) continue;
    p.x += p.vx; p.y += p.vy;
    if (p.kind === 'smoke'){       // 느리게 퍼지며 살짝 떠오름
      p.vx *= 0.90; p.vy = p.vy * 0.90 - 0.018;
    } else if (p.kind === 'spark'){
      p.vx *= 0.93; p.vy = p.vy * 0.93 + 0.07;
    } else {
      p.vx *= 0.94; p.vy = p.vy * 0.94 + 0.04;
      if (p.kind === 'debris') p.rot += p.spin;
    }
    if (--p.life <= 0) p.on = false;
  }
}

function endRun(cleared){
  G.finished = true;
  // 종료는 호스트 권위다. 예전에는 이걸 보내지 않아서 호스트가 CLEAR 로 가도
  // 게스트는 PLAY 에 영원히 멈춰 있었다.
  if (Net.isOnline() && Net.isHost()) netSendEvent('end', { c: cleared ? 1 : 0 });
  if (cleared){
    addScore(G.lives * 100000);
    addScore(G.bombs * 30000);
    state = S.CLEAR;
  } else {
    state = S.GAMEOVER;
  }
  if (G.score > bestScore) bestScore = G.score;
}

/* ═══════════════════════════════════════════════════
   동기화 — 호스트 권위(월드) + 클라이언트 권위(자기 기체·자기 피격)
   호스트가 탄·적·아이템·보스를 모두 시뮬레이션하고 30Hz로 스냅샷을 보낸다.
   클라이언트는 자기 기체만 로컬로 움직여 입력 지연이 없게 한다.
   ═══════════════════════════════════════════════════ */
const KIND_ID = { ring:0, fall:1, aim:2, laser:3, burst:4, seed:5 };
const ID_KIND = ['ring','fall','aim','laser','burst','seed'];
const ETYPE_ID = { straight:0, sine:1, turret:2, midboss:3 };
const ID_ETYPE = ['straight','sine','turret','midboss'];
const IKIND_ID = { score:0, power:1, homing:2, bomb:3, shield:4 };
const ID_IKIND = ['score','power','homing','bomb','shield'];
const MODE_ID = { STAGE:0, BOSS:1, INTERLUDE:2 };
const ID_MODE = ['STAGE','BOSS','INTERLUDE'];

// 클라이언트는 적의 반경을 스냅샷으로 받지 않는다 — 타입에서 되살린다
// (spawnEnemy 의 e.r 과 같은 값이어야 자탄이 호스트와 같은 지점에서 사라진다)
const ETYPE_R = { straight: 15*PLANE_SCALE, sine: 17*PLANE_SCALE, turret: 21*PLANE_SCALE, midboss: 30 };

const NET_MAX_B = 400, NET_MAX_E = 40, NET_MAX_I = 120;
// HUD 구간 이름도 1바이트로 실어 보낸다 (클라이언트 HUD가 옛 구간에서 멈추지 않게)
const SEG_NAMES = ['', 'WAVE 1', 'WAVE 2', 'WAVE 3', 'MID-BOSS', 'INTERCEPT 1', 'INTERCEPT 2', 'INTERCEPT 3'];
// 헤더(16) + 슬롯 수(1) + 슬롯 4개(60) + 각 배열 길이 필드 — 넉넉히 128바이트 확보
let snapBuf = new ArrayBuffer(128 + NET_MAX_B*6 + NET_MAX_E*6 + NET_MAX_I*7);
let snapView = new DataView(snapBuf);

function writeSlot(v, o, p){
  v.setUint8(o, p.slot); o += 1;
  v.setInt16(o, Math.round(p.x)); o += 2;
  v.setInt16(o, Math.round(p.y)); o += 2;
  v.setInt8(o, Math.round(p.bank * 100)); o += 1;
  v.setUint8(o, Math.round(Math.min(POWER_MAX, p.power) * 20)); o += 1;
  v.setUint8(o, Math.max(0, Math.min(255, p.lives))); o += 1;
  v.setUint8(o, p.bombs); o += 1;
  v.setUint8(o, p.shield); o += 1;
  v.setUint8(o, (p.spectating ? 4 : 0) | (p.slow ? 2 : 0) | (p.invuln > 0 ? 1 : 0)); o += 1;
  v.setUint32(o, Math.min(4294967295, Math.round(p.score))); o += 4;
  return o;
}
function readSlot(v, o, out){
  const idx = v.getUint8(o); o += 1;
  const p = out[idx] || out[0];
  p.x = v.getInt16(o); o += 2;
  p.y = v.getInt16(o); o += 2;
  p.bank = v.getInt8(o) / 100; o += 1;
  p.power = v.getUint8(o) / 20; o += 1;
  p.lives = v.getUint8(o); o += 1;
  p.bombs = v.getUint8(o); o += 1;
  p.shield = v.getUint8(o); o += 1;
  const fl = v.getUint8(o); o += 1;
  p.invuln = (fl & 1) ? 1 : 0;
  p.slow = !!(fl & 2);
  p.spectating = !!(fl & 4);
  p.score = v.getUint32(o); o += 4;
  p.seen = performance.now();
  p.present = true;
  return o;
}

// 호스트가 자기 상태를 슬롯 0에 반영
function syncHostSlot(){
  const p = Net.players[Net.mySlot];
  p.x = player.x; p.y = player.y; p.bank = player.bank;
  p.power = player.power; p.lives = Math.max(0, G.lives); p.bombs = G.bombs;
  p.shield = player.shield; p.invuln = player.invuln > 0 ? 1 : 0;
  p.slow = player.slow; p.spectating = G.spectating; p.score = G.score;
}

function encodeSnapshot(){
  syncHostSlot();
  const v = snapView;
  let o = 0;
  v.setUint8(o, 1); o += 1;
  v.setUint32(o, frame); o += 4;
  v.setUint8(o, MODE_ID[G.mode] || 0); o += 1;
  v.setUint8(o, G.phase); o += 1;
  v.setUint16(o, Math.max(0, Math.round(G.phaseHP))); o += 2;
  v.setUint16(o, Math.max(1, Math.round(G.phaseHPMax))); o += 2;
  v.setInt16(o, Math.round(G.boss.x)); o += 2;
  v.setInt16(o, Math.round(G.boss.y)); o += 2;
  v.setUint8(o, G.boss.alive ? 1 : 0); o += 1;
  { const si = SEG_NAMES.indexOf(G.stage.waveName); v.setUint8(o, si < 0 ? 0 : si); } o += 1;

  // 플레이어 슬롯 (present 인 것만)
  const pOff = o; o += 1;
  let np = 0;
  for (let i=0;i<MAX_PLAYERS;i++){
    if (!Net.players[i].present) continue;
    o = writeSlot(v, o, Net.players[i]);
    np++;
  }
  v.setUint8(pOff, np);

  const bOff = o; o += 2;
  let nb = 0;
  for (let i=0;i<active.length && nb<NET_MAX_B;i++){
    const b = active[i];
    if (!b.on) continue;
    v.setInt16(o, Math.round(b.x)); o += 2;
    v.setInt16(o, Math.round(b.y)); o += 2;
    v.setUint8(o, KIND_ID[b.kind] || 0); o += 1;
    v.setUint8(o, Math.round(((b.rot % TAU) + TAU) % TAU / TAU * 255)); o += 1;
    nb++;
  }
  v.setUint16(bOff, nb);

  const eOff = o; o += 1;
  let ne = 0;
  for (let i=0;i<MAX_ENEMY && ne<NET_MAX_E;i++){
    const e = enemies[i];
    if (!e.on) continue;
    v.setInt16(o, Math.round(e.x)); o += 2;
    v.setInt16(o, Math.round(e.y)); o += 2;
    v.setUint8(o, ETYPE_ID[e.type] || 0); o += 1;
    v.setUint8(o, Math.max(0, Math.min(255, Math.round(e.hp / e.maxHp * 255)))); o += 1;
    ne++;
  }
  v.setUint8(eOff, ne);

  const iOff = o; o += 1;
  let ni = 0;
  for (let i=0;i<MAX_ITEM && ni<NET_MAX_I;i++){
    const it = items[i];
    if (!it.on) continue;
    v.setUint16(o, i); o += 2;                     // 아이템 고유 id (풀 인덱스)
    v.setInt16(o, Math.round(it.x)); o += 2;
    v.setInt16(o, Math.round(it.y)); o += 2;
    v.setUint8(o, IKIND_ID[it.kind] || 0); o += 1;
    ni++;
  }
  v.setUint8(iOff, ni);

  return snapBuf.slice(0, o);
}

// 클라이언트가 그릴 월드
const NetWorld = {
  segName: '',
  bullets: [], enemies: [], items: [],
  _prevE: [], _bossWas: true,          // 격추 감지용 (직전 스냅샷의 적 / 보스 생존)
  boss: { x: LW/2, y: PF.y+120, alive: true },
  phaseHP: 1, phaseHPMax: 1, mode: 'STAGE', phase: 0, frame: 0,
};

function decodeSnapshot(buf){
  const v = new DataView(buf);
  let o = 1;
  NetWorld.frame = v.getUint32(o); o += 4;
  NetWorld.mode = ID_MODE[v.getUint8(o)]; o += 1;
  NetWorld.phase = v.getUint8(o); o += 1;
  NetWorld.phaseHP = v.getUint16(o); o += 2;
  NetWorld.phaseHPMax = v.getUint16(o); o += 2;
  NetWorld.boss.x = v.getInt16(o); o += 2;
  NetWorld.boss.y = v.getInt16(o); o += 2;
  NetWorld.boss.alive = !!v.getUint8(o); o += 1;
  NetWorld.segName = SEG_NAMES[v.getUint8(o)] || ''; o += 1;

  const np = v.getUint8(o); o += 1;
  const seen = [];
  for (let i=0;i<np;i++){
    const idx = v.getUint8(o);
    seen.push(idx);
    if (idx === Net.mySlot){ o += 15; continue; }   // 내 슬롯은 로컬이 권위
    o = readSlot(v, o, Net.players);
  }
  for (let i=0;i<MAX_PLAYERS;i++){
    if (i !== Net.mySlot && seen.indexOf(i) < 0) Net.players[i].present = false;
    else Net.players[i].present = true;
  }

  const nb = v.getUint16(o); o += 2;
  NetWorld.bullets.length = 0;
  for (let i=0;i<nb;i++){
    const x = v.getInt16(o); o += 2;
    const y = v.getInt16(o); o += 2;
    const k = ID_KIND[v.getUint8(o)] || 'ring'; o += 1;
    const rot = v.getUint8(o) / 255 * TAU; o += 1;
    NetWorld.bullets.push({ x, y, kind:k, rot });
  }
  const ne = v.getUint8(o); o += 1;
  // 폭발 이펙트는 스냅샷에 없다 (호스트 로컬). 그래서 게스트 화면은 늘 밋밋했다.
  // 직전 스냅샷에 있던 적이 사라졌으면 격추로 보고 같은 자리에서 터뜨린다.
  const prevE = NetWorld._prevE;
  prevE.length = 0;
  for (let i=0;i<NetWorld.enemies.length;i++){
    const e = NetWorld.enemies[i];
    prevE.push(e.x, e.y, e.type);
  }
  NetWorld.enemies.length = 0;
  for (let i=0;i<ne;i++){
    const x = v.getInt16(o); o += 2;
    const y = v.getInt16(o); o += 2;
    const t = ID_ETYPE[v.getUint8(o)] || 'straight'; o += 1;
    const hp = v.getUint8(o) / 255; o += 1;
    NetWorld.enemies.push({ x, y, type:t, hpPct:hp });
  }
  for (let i=0;i<prevE.length;i+=3){
    const px = prevE[i], py = prevE[i+1], pt = prevE[i+2];
    // 화면 밖으로 빠져나간 적은 격추가 아니다
    if (py < PF.y - 10 || py > PF.y + PF.h - 50) continue;
    if (px < PF.x - 10 || px > PF.x + PF.w + 10) continue;
    let alive = false;
    for (let k=0;k<NetWorld.enemies.length;k++){
      const e = NetWorld.enemies[k];
      if (e.type !== pt) continue;
      const dx = e.x - px, dy = e.y - py;
      if (dx*dx + dy*dy < 2500){ alive = true; break; }   // 50px 안이면 같은 적
    }
    if (!alive) explode(px, py, pt === 'midboss' ? 3.4 : 1.5, '#ffd08a', '#6b4a3a');
  }
  if (NetWorld._bossWas && !NetWorld.boss.alive)
    explode(NetWorld.boss.x, NetWorld.boss.y, 4.2, '#ffe6a0', '#7a5560');
  NetWorld._bossWas = NetWorld.boss.alive;
  const ni = v.getUint8(o); o += 1;
  NetWorld.items.length = 0;
  for (let i=0;i<ni;i++){
    const id = v.getUint16(o); o += 2;
    const x = v.getInt16(o); o += 2;
    const y = v.getInt16(o); o += 2;
    const k = ID_IKIND[v.getUint8(o)] || 'score'; o += 1;
    NetWorld.items.push({ id, x, y, kind:k });
  }
}

// 클라이언트 → 호스트 : 자기 슬롯 상태
function encodeClientState(){
  const b = new ArrayBuffer(20);
  const v = new DataView(b);
  v.setUint8(0, 2);
  const p = Net.players[Net.mySlot];
  p.x = player.x; p.y = player.y; p.bank = player.bank;
  p.power = player.power; p.lives = Math.max(0, G.lives); p.bombs = G.bombs;
  p.shield = player.shield; p.invuln = player.invuln > 0 ? 1 : 0;
  p.slow = player.slow; p.spectating = G.spectating; p.score = G.score;
  writeSlot(v, 1, p);
  return b;
}
function decodeClientState(peerId, buf){
  const v = new DataView(buf);
  readSlot(v, 1, Net.players);
}

function netApplyBinary(peerId, buf){
  const t = new DataView(buf).getUint8(0);
  if (t === 1 && !Net.isHost()) decodeSnapshot(buf);
  else if (t === 2 && Net.isHost()) decodeClientState(peerId, buf);
}

// 드문 이벤트는 JSON으로
function netApplyEvent(d){
  if (d.s === Net.mySlot) return;      // 내가 보낸 이벤트가 되돌아온 경우
  switch(d.k){
    case 'bomb':                       // 상대가 봄을 씀 → 월드에서 탄 제거는 호스트가
      if (Net.isHost()){
        addScore(countLiveBullets() * 5);
        clearBullets(true);
        spawnRing(d.x, d.y, 520, 70, C.player, 5);
        flash = 0.8; shake = 14;
        Sound.bomb();
      } else {
        spawnRing(d.x, d.y, 520, 70, C.player, 5);
        flash = 0.8; shake = 14;
        Sound.bomb();
      }
      break;
    case 'hit':                        // 상대가 피격 (자기 피격은 각자 권위)
      if (Net.isHost()) clearBullets(true);
      spawnRing(d.x, d.y, 150, 40, '#ff4466', 3);
      explode(d.x, d.y, 2.0, '#ffd0a0', '#7a4550');
      shake = Math.max(shake, 14);
      Sound.hit();
      break;
    case 'pick':                       // 클라이언트가 아이템을 주움 → 호스트가 제거
      if (Net.isHost()){
        let best = null;
        if (d.id !== undefined && items[d.id] && items[d.id].on && items[d.id].kind === d.ik){
          best = items[d.id];                       // id로 정확히 지목
        } else {                                    // 구버전 호환 — 가장 가까운 같은 종류
          let bd = 900;
          for (let i=0;i<MAX_ITEM;i++){
            const it = items[i];
            if (!it.on || it.kind !== d.ik) continue;
            const dd = (it.x-d.x)*(it.x-d.x) + (it.y-d.y)*(it.y-d.y);
            if (dd < bd){ bd = dd; best = it; }
          }
        }
        if (best) best.on = false;
      }
      break;
    case 'over':
      if (d.s !== undefined && Net.players[d.s]) Net.players[d.s].spectating = true;
      break;
    case 'end':                        // 호스트가 런을 끝냈다 → 게스트도 같이 끝낸다
      if (!Net.isHost() && G && !G.finished){
        G.finished = true;
        G.spectating = false;
        state = d.c ? S.CLEAR : S.GAMEOVER;
      }
      break;
  }
}

function netSendEvent(k, o){
  if (!Net.isOnline()) return;
  const msg = Object.assign({ t:'ev', k, s: Net.mySlot }, o || {});
  if (Net.isHost()) Net.sendAll(msg); else Net.sendUp(msg);
}

function updatePlay(){
  G.totalFrames++;
  // ── 온라인 클라이언트: 월드는 호스트가 돌린다. 자기 기체만 로컬로 움직인다.
  if (Net.isOnline() && !Net.isHost()){
    if (G.banner > (G.bannerPrev || 0)) G.bannerMax = G.banner;
    G.bannerPrev = G.banner;
    if (G.banner > 0) G.banner--;
    const segKey = NetWorld.mode + NetWorld.phase;
    if (G._segKey !== undefined && G._segKey !== segKey){
      reviveIfDown();
      // 배너와 틴트는 startPhase()/updateStage() 안에서 세팅되는데 그건 호스트만 돈다.
      // 그래서 게스트는 스펠 이름이 안 뜨고 배경색도 안 바뀌었다 — 복제된 구간 정보로 되살린다.
      if (NetWorld.mode === 'BOSS' && SPELLS[NetWorld.phase]){
        G.banner = 150; G.bannerText = null;      // null 이면 drawBanner 가 SPELLS[phase] 를 쓴다
        G.tint = SPELLS[NetWorld.phase].tint;
        Sound.spell();
      } else if (NetWorld.segName){
        G.banner = 100; G.bannerText = NetWorld.segName;
      }
    }
    G._segKey = segKey;
    G.mode = NetWorld.mode; G.phase = NetWorld.phase;
    G.phaseHP = NetWorld.phaseHP; G.phaseHPMax = NetWorld.phaseHPMax;
    G.boss.x = NetWorld.boss.x; G.boss.y = NetWorld.boss.y; G.boss.alive = NetWorld.boss.alive;
    G.stage.waveName = NetWorld.segName || '';
    updatePlayer();
    clientCollide();
    clientPickup();
    updatePShots();      // ★ 이게 빠져 있어서 자탄이 발사만 되고 멈춰 있었다
    updateParts();
    updateRings();
    if (shake > 0) shake *= 0.88;
    if (vignette > 0) vignette *= 0.94;
    if (flash > 0) flash *= 0.86;
    netTick();
    return;
  }
  // 배너가 새로 설정되면 그 값을 최대치로 기억 (페이드/슬라이드 계산용)
  if (G.banner > (G.bannerPrev || 0)) G.bannerMax = G.banner;
  G.bannerPrev = G.banner;
  if (G.banner > 0) G.banner--;
  updatePlayer();
  if (G.mode === 'STAGE') updateStage();
