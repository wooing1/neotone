<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>쌩쌩 추월</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#0a0d10;overflow:hidden;
    font-family:'Menlo','Consolas',monospace;-webkit-tap-highlight-color:transparent;
    touch-action:none;overscroll-behavior:none}
  #wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
  canvas{display:block;image-rendering:auto}
  #nick{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    width:220px;padding:12px 14px;font-size:17px;text-align:center;
    font-family:'Menlo','Consolas',monospace;color:#fff;background:#1b222a;
    border:2px solid #ffd257;border-radius:10px;outline:none;z-index:10}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<input id="nick" maxlength="8" autocomplete="off" spellcheck="false" placeholder="이름 (8자)">
<script>
/* 이 스크립트 전체를 IIFE 로 감싸 둔다.
   감싸지 않으면 최상위 function / var / const / let 이 전부 전역이 되어
   콘솔에서 G, Rank, crash, scoreOf 같은 이름에 그대로 닿고 재대입도 된다
   (const 는 window 프로퍼티가 아니라 안 새는 것처럼 보이지만,
    스크립트 전역 어휘 범위에 올라가 이름만으로 불린다).
   밖으로 내보내는 것은 window.__race 와 window.__input 둘뿐이다 —
   같은 파일의 arcade-rankui / arcade-bar 블록은 그 둘과 window.ArcadeRankUI 만 본다.
   (인라인 on... 핸들러는 이 페이지에 하나도 없다 — 있었으면 전역 함수를 찾지 못해 깨졌다)
   오염 표식(tainted) 이 사는 클로저도 바로 이것이다. */
(function(){
'use strict';
/* ═══════════════════════════════════════════════════════════════
   쌩쌩 추월 (OVERTAKE)
   톱뷰 · 자유 좌우 이동 · 가속만 (브레이크 없음) · 생존 시간 경쟁

   설계 메모
   - 논리 해상도 고정(400×700) + 레터박스. 어느 화면에서도 판정이 같다.
   - 고정 타임스텝 60fps + 누산기. 프레임이 밀려도 게임 속도는 일정하다.
   - 좌표계는 "도로 좌표"다. 스크롤은 내 속도만큼 흐르고,
     상대 차량은 (내 속도 - 상대 속도)만큼 화면에서 내려간다.
     브레이크가 없으니 가속은 되돌릴 수 없는 선택이다 — 밟는 만큼 추월이 늘지만
     앞 차가 닫히는 속도도 같이 커진다. 위험은 핸들로만 푼다.
   - 스프라이트는 전부 코드로 굽는다(오프스크린 캔버스). 외부 에셋 0개.
   - 온라인을 나중에 붙일 수 있게, "내 차"와 "남의 차"를 같은 draw 함수로 그리고
     월드 시뮬레이션을 updateWorld() 한 곳에 모아 두었다.
   ═══════════════════════════════════════════════════════════════ */

const LW = 400, LH = 700;                  // 논리 해상도
const ROAD = { x: 44, w: 312 };            // 도로 영역 (양옆은 가드레일/풀)
const LANES = 4;
const LANE_W = ROAD.w / LANES;             // 78
const laneX = i => ROAD.x + LANE_W * (i + 0.5);

// ── 속도 (도로 단위/프레임). 화면 픽셀과 1:1 로 쓴다.
//    브레이크는 없다. 가속 페달만 있고, 떼면 기본 속도로 서서히 돌아온다.
//    그래서 "속도를 죽여 시간을 버는" 선택지가 없고, 위험은 핸들로만 푼다.
//    대신 가속은 순수한 욕심 — 추월이 늘지만 닫히는 속도도 같이 커진다.
const SPD_BASE = 7.0, SPD_MAX = 22.5, SPD_START = SPD_BASE;
const SPD_MIN = SPD_BASE;                  // 이 아래로는 내려가지 않는다
// 최고 속도를 1.5배로 올리면서 가·감속률도 같은 비율로 올렸다.
// 그러지 않으면 최고 속도까지 1.5초 → 2.9초가 되어, 15초 안팎을 버티는 게임에서
// 최고 속도를 구경도 못 하게 된다. 밟는 느낌은 그대로 두고 위쪽만 늘린 셈이다.
const ACCEL = 0.135, COAST = 0.060;        // COAST = 페달 뗐을 때 기본 속도로 복귀
const KMH = 16;                            // 표시용 환산 (기본 112 / 최고 360 km/h)
// 기록은 시간이 아니라 거리다.
//   시간 기준이면 가속이 순수한 손해가 된다 — 밟으면 접근 속도가 올라가 더 빨리 죽는데
//   초는 오히려 줄어드니, 최적 전략이 "절대 안 밟기" 가 되어 가속 페달이 죽은 버튼이 된다.
//   거리로 재면 밟을수록 기록이 늘어서 위험과 보상이 맞물린다.
// 단위는 속도계에서 그대로 끌어온다: spd 는 프레임당 이동량이고 60fps 이므로
//   1초에 spd*60 유닛 = (spd*KMH)/3.6 미터  →  1 유닛 = KMH/3.6/60 미터.
const M_PER_UNIT = KMH / 3.6 / 60;         // ≈ 0.0741 m

const PLAYER = { w: 32, h: 56, y: LH - 150 };
// 판정 = 그려진 차체 그대로.
// 스프라이트 캔버스는 (w+8)×(h+8) 이지만 차체는 정확히 w×h 로 중앙에 그려진다.
// 예전에는 여기서 좌우 3 / 위아래 5 를 깎아 26×46 으로 판정했는데,
// 눈으로 보이는 차체(32×56)보다 작아서 "닿았는데 안 죽는" 위화감이 있었다.
// 이제 모서리 곡률(rr 의 r)까지 그대로 반영해 실루엣 그대로 판정한다.
const CAR_R = 7, TRUCK_R = 5;              // bakeCar / bakeTruck 의 모서리 반지름

const NEAR_MISS_X = 26;                    // 이 안으로 스치면 아슬아슬 보너스

/* ── 아슬아슬 보너스 ───────────────────────────────────────
   지금까지 아슬아슬은 세고 보여 주기만 했고 기록에는 1미터도 반영되지 않았다.
   즉 "안전하게 빈 차선만 달리기" 와 "차 사이를 스치며 뚫기" 가 완전히 같은 점수였다.
   이제 스칠 때마다 보너스 거리를 준다. 두 가지로 배율이 붙는다.

   ① 속도 — 360km/h 로 스치는 것과 112km/h 로 스치는 것은 위험이 다르다.
      기본 속도에서 1.0, 최고 속도에서 SPD_SCALE 배.
      가속이 거리(선형) 말고 보너스(추가)로도 값어치를 갖게 하는 장치다.
   ② 콤보 — COMBO_HOLD 프레임 안에 다음 아슬아슬이 나오면 이어진다.
      연속으로 뚫을수록 커져서, 한 번 위험한 라인에 들어가면 끝까지 갈 이유가 생긴다.

   단위는 '유닛'(프레임당 이동량)이라 거리와 그대로 더할 수 있다.
   NEAR_BASE = 160유닛 ≒ 12m. 최고 배율이면 한 번에 12 * 2.2 * 2.0 ≒ 53m. */
const NEAR_BASE  = 160;                    // 유닛. 기본 속도·콤보 없음 = 약 12m
const NEAR_SPD_SCALE = 2.2;                // 최고 속도에서의 배율
const NEAR_COMBO_MAX = 10;                 // 콤보 상한
const NEAR_COMBO_STEP = 0.1;               // 콤보 1당 +10%
const COMBO_HOLD = 150;                    // 2.5초 안에 이어야 콤보 유지

// 화면 위 가속 버튼 (▲). 모바일에서 끌면서 가속까지 하기 어려워 버튼을 따로 둔다.
const GAS = { x: LW - 62, y: LH - 78, r: 40 };
function inGas(x, y){ const dx = x - GAS.x, dy = y - GAS.y; return dx*dx + dy*dy < (GAS.r + 12) * (GAS.r + 12); }

/* ── 난이도 일정 (초 단위) ─────────────────────────────────
   요청하신 순서: 교통량·상대속도 → 앞 차 차선 변경 → 역주행
   "짧고 빠른 이동"을 만드는 장치로 밀집 편성(차량 벽)을 함께 넣었다. */
const T_LANECHANGE = 5;     // 차선 변경 NPC 등장
const T_WALL       = 11;    // 차량 벽(틈 하나) 편성 등장
const T_ONCOMING   = 18;    // 역주행 등장

/* ── 차선 안 좌우 흔들림 ───────────────────────────────────
   모든 차가 차선 정중앙만 달리면 "차선 경계선 위" 가 영구 안전지대가 된다.
   차선 폭 78 → 정중앙끼리 39px 간격, 충돌 판정은 26px.
   즉 경계선에 걸쳐 있으면 좌우 어느 차에도 닿지 않는다 (초반 무적 구간).
   그래서 차마다 차선 안에서 좌우로 천천히 흔들리게 했다.
   진폭을 차선 여유의 끝까지 주면 경계선까지 19px 로 좁혀져 판정 안에 들어온다. */
function laneAmp(w){ return Math.max(0, (LANE_W - w) * 0.5 - 3); }   // npc 20, 트럭 16
function laneOff(c){ return Math.sin(c.oxPh) * c.oxAmp; }
function initLaneOff(c, ampScale){
  c.oxAmp = laneAmp(c.w) * (ampScale === undefined ? 1 : ampScale);
  c.oxPh  = Math.random() * Math.PI * 2;
  // 화면에 머무는 2~4초 사이에 눈에 보일 만큼은 움직여야 한다
  c.oxSpd = (0.010 + Math.random() * 0.014) * (Math.random() < 0.5 ? -1 : 1);
}

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d', { alpha: false });

let renderScale = 1, drawScale = 1;
function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const availW = window.innerWidth, availH = window.innerHeight;
  const s = Math.min(availW / LW, availH / LH);
  cv.style.width = (LW * s) + 'px';
  cv.style.height = (LH * s) + 'px';
  cv.width = Math.round(LW * s * dpr);
  cv.height = Math.round(LH * s * dpr);
  renderScale = s * dpr;
  ctx.setTransform(renderScale, 0, 0, renderScale, 0, 0);
  ctx.imageSmoothingEnabled = true;
}
window.addEventListener('resize', resize);
resize();

/* ═══════════════════════════════════════════════════
   입력 — PC 키보드 + 모바일 드래그
   ═══════════════════════════════════════════════════ */
const Input = {
  left: false, right: false, up: false,
  touch: null,           // 조향용 {x, y, baseY}
  gas: false,            // ▲ 버튼을 누르고 있는지
  tapPos: null,          // 버튼 히트 테스트용 (누른 좌표)
  pressed: {},           // 한 번만 먹는 키
  tapAnywhere: false,
  wasPressed(k){ if (this.pressed[k]){ this.pressed[k] = false; return true; } return false; },
  consumeTap(){ const t = this.tapAnywhere; this.tapAnywhere = false; return t; },
  consumeTapPos(){ const p = this.tapPos; this.tapPos = null; return p; },
};
// id → {x, y, baseY, gas}
const touches = new Map();
function syncTouches(){
  let steer = null, gas = false;
  touches.forEach(t => { if (t.gas) gas = true; else steer = t; });
  Input.touch = steer;
  Input.gas = gas;
}
const KEYMAP = {
  ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right',
  ArrowUp:'up', KeyW:'up',        // 브레이크 없음 — 아래 방향키는 쓰지 않는다
};
addEventListener('keydown', e => {
  const k = KEYMAP[e.code];
  if (k){ Input[k] = true; e.preventDefault(); }
  if (e.code === 'KeyR') Input.pressed.RETRY = true;
  if (e.code === 'KeyM') Input.pressed.MUTE = true;
  if (e.code === 'Space' || e.code === 'Enter'){ Input.pressed.OK = true; Input.tapAnywhere = true; e.preventDefault(); }
  if (e.code === 'Escape') Input.pressed.PAUSE = true;
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) Input[k] = false; });

// 화면을 끌면 손가락 x 로 차가 따라오고, 위/아래로 끌면 가속/브레이크
function toLogical(cx, cy){
  const r = cv.getBoundingClientRect();
  return { x: (cx - r.left) / r.width * LW, y: (cy - r.top) / r.height * LH };
}
function onDown(id, cx, cy){
  const p = toLogical(cx, cy);
  // 플레이 중에 ▲ 버튼 위를 누르면 그 손가락은 가속 전용이 된다
  const isGas = (state === S.PLAY) && inGas(p.x, p.y);
  touches.set(id, { x: p.x, y: p.y, baseY: p.y, gas: isGas });
  syncTouches();
  Input.tapAnywhere = true;
  Input.tapPos = { x: p.x, y: p.y };
  // iOS 는 사용자 제스처와 "같은 틱"에서 focus() 를 불러야 키보드를 올린다.
  // handleInput() 은 다음 rAF 에서 도니까 거기서 openNick() 을 부르면 이미 늦다.
  // (이 파일에도 그렇게 적혀 있었지만 실제 호출 경로는 rAF 안이었다 — 여기서 직접 연다.)
  if (state === S.RANK && uiHit(p) === 'name') openNick();
}
function onMove(id, cx, cy){
  const t = touches.get(id);
  if (!t) return;
  const p = toLogical(cx, cy);
  t.x = p.x; t.y = p.y;
  // 가속 손가락은 버튼에서 벗어나면 가속을 놓는다
  if (t.gas && !inGas(p.x, p.y)) t.gas = false;
  syncTouches();
}
function onUp(id){ touches.delete(id); syncTouches(); }

cv.addEventListener('touchstart', e => { e.preventDefault();
  for (const t of e.changedTouches) onDown(t.identifier, t.clientX, t.clientY); }, {passive:false});
cv.addEventListener('touchmove',  e => { e.preventDefault();
  for (const t of e.changedTouches) onMove(t.identifier, t.clientX, t.clientY); }, {passive:false});
cv.addEventListener('touchend',   e => { e.preventDefault();
  for (const t of e.changedTouches) onUp(t.identifier); }, {passive:false});
cv.addEventListener('touchcancel',e => { e.preventDefault();
  for (const t of e.changedTouches) onUp(t.identifier); }, {passive:false});
cv.addEventListener('mousedown',  e => {
  onDown('m', e.clientX, e.clientY);
  // onDown 이 이름 입력창을 열었다면 기본 동작을 막는다.
  // 안 막으면 브라우저가 포커스를 캔버스로 가져가면서 곧바로 blur 가 터지고,
  // blur 커밋이 빈 값으로 이름을 덮어쓴다. (터치 경로는 이미 preventDefault 라 무사했다)
  if (nickOpen) e.preventDefault();
});
addEventListener('mousemove',     e => onMove('m', e.clientX, e.clientY));
addEventListener('mouseup',       () => onUp('m'));

/* ═══════════════════════════════════════════════════
   사운드 — WebAudio 합성 (외부 파일 0개)
   엔진음은 속도에 따라 음정이 올라간다. 이게 있으면 속도 체감이 확 다르다.
   ═══════════════════════════════════════════════════ */
const Sound = {
  ac: null, muted: false, engine: null, engGain: null, engFilter: null,
  init(){
    if (this.ac) return;
    try { this.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return; }
    const ac = this.ac;
    this.master = ac.createGain(); this.master.gain.value = 0.5; this.master.connect(ac.destination);
    // 엔진: 톱니 + 로우패스. 게임 중에만 소리를 키운다.
    this.engine = ac.createOscillator(); this.engine.type = 'sawtooth';
    this.engFilter = ac.createBiquadFilter(); this.engFilter.type = 'lowpass'; this.engFilter.frequency.value = 420;
    this.engGain = ac.createGain(); this.engGain.gain.value = 0;
    this.engine.connect(this.engFilter); this.engFilter.connect(this.engGain); this.engGain.connect(this.master);
    this.engine.frequency.value = 60;
    this.engine.start();
  },
  resume(){ if (this.ac && this.ac.state === 'suspended') this.ac.resume(); },
  setEngine(spd, on){
    if (!this.ac || this.muted) { if (this.engGain) this.engGain.gain.value = 0; return; }
    const t = (spd - SPD_BASE) / (SPD_MAX - SPD_BASE);
    this.engine.frequency.setTargetAtTime(52 + t * 78, this.ac.currentTime, 0.08);
    this.engFilter.frequency.setTargetAtTime(320 + t * 900, this.ac.currentTime, 0.1);
    this.engGain.gain.setTargetAtTime(on ? 0.085 : 0, this.ac.currentTime, 0.12);
  },
  blip(freq, dur, type, vol){
    if (!this.ac || this.muted) return;
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type || 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.16, this.ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, this.ac.currentTime + dur);
    o.connect(g); g.connect(this.master); o.start(); o.stop(this.ac.currentTime + dur);
  },
  noise(dur, vol, hp){
    if (!this.ac || this.muted) return;
    const n = Math.floor(this.ac.sampleRate * dur);
    const buf = this.ac.createBuffer(1, n, this.ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
    const src = this.ac.createBufferSource(); src.buffer = buf;
    const f = this.ac.createBiquadFilter(); f.type = hp ? 'highpass' : 'lowpass';
    f.frequency.value = hp ? 1400 : 500;
    const g = this.ac.createGain(); g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(this.master); src.start();
  },
  overtake(){ this.blip(760, 0.06, 'square', 0.10); },
  nearMiss(){ this.noise(0.22, 0.20, true); },
  crash(){ this.noise(0.5, 0.5, false); this.blip(70, 0.45, 'sawtooth', 0.3); },
  ui(){ this.blip(520, 0.05, 'triangle', 0.12); },
  best(){ this.blip(880, 0.09, 'triangle', 0.16); setTimeout(()=>this.blip(1170, 0.12, 'triangle', 0.16), 90); },
  toggleMute(){ this.muted = !this.muted; if (this.muted && this.engGain) this.engGain.gain.value = 0; },
  isMuted(){ return this.muted; },
};

/* ═══════════════════════════════════════════════════
   스프라이트 굽기 — 전부 코드로 그린다
   ═══════════════════════════════════════════════════ */
function bake(w, h, fn){
  const c = document.createElement('canvas');
  const s = 2;                       // 2배로 굽고 축소해서 그린다 (계단 완화)
  c.width = w * s; c.height = h * s;
  const g = c.getContext('2d');
  g.scale(s, s);
  fn(g, w, h);
  return { canvas: c, w, h };
}

// 톱뷰 자동차. 앞이 위를 향한다.
function bakeCar(body, roof, opt){
  opt = opt || {};
  const w = opt.w || 32, h = opt.h || 56;
  return bake(w + 8, h + 8, (g) => {
    const x = 4, y = 4;
    // 그림자
    g.fillStyle = 'rgba(0,0,0,0.35)';
    rr(g, x+1, y+3, w, h, 7); g.fill();
    // 차체
    const grad = g.createLinearGradient(x, 0, x + w, 0);
    grad.addColorStop(0, shade(body, -0.28));
    grad.addColorStop(0.35, body);
    grad.addColorStop(0.62, shade(body, 0.14));
    grad.addColorStop(1, shade(body, -0.34));
    g.fillStyle = grad;
    rr(g, x, y, w, h, 7); g.fill();
    // 바퀴 (차체 밖으로 살짝)
    g.fillStyle = '#14161a';
    const ww = 4, wh = 11;
    g.fillRect(x - 1.5, y + h*0.16, ww, wh);
    g.fillRect(x + w - 2.5, y + h*0.16, ww, wh);
    g.fillRect(x - 1.5, y + h*0.70, ww, wh);
    g.fillRect(x + w - 2.5, y + h*0.70, ww, wh);
    // 앞유리 / 뒷유리
    g.fillStyle = 'rgba(150,205,235,0.92)';
    rr(g, x + w*0.16, y + h*0.14, w*0.68, h*0.16, 3); g.fill();
    g.fillStyle = 'rgba(120,175,205,0.75)';
    rr(g, x + w*0.18, y + h*0.66, w*0.64, h*0.14, 3); g.fill();
    // 루프
    g.fillStyle = roof || shade(body, 0.10);
    rr(g, x + w*0.14, y + h*0.33, w*0.72, h*0.30, 4); g.fill();
    // 하이라이트 한 줄 — 금속 느낌
    g.strokeStyle = 'rgba(255,255,255,0.30)'; g.lineWidth = 1;
    g.beginPath(); g.moveTo(x + w*0.30, y + 3); g.lineTo(x + w*0.30, y + h - 3); g.stroke();

    if (opt.headlights){          // 역주행 차 — 헤드라이트가 나를 향한다
      g.fillStyle = 'rgba(255,246,190,0.95)';
      rr(g, x + w*0.10, y + h - 7, w*0.22, 4, 2); g.fill();
      rr(g, x + w*0.68, y + h - 7, w*0.22, 4, 2); g.fill();
    } else {                      // 같은 방향 — 미등이 나를 향한다
      g.fillStyle = 'rgba(255,90,80,0.9)';
      rr(g, x + w*0.10, y + h - 7, w*0.22, 4, 2); g.fill();
      rr(g, x + w*0.68, y + h - 7, w*0.22, 4, 2); g.fill();
    }
  });
}

function bakeTruck(body){
  const w = 40, h = 88;
  return bake(w + 8, h + 8, (g) => {
    const x = 4, y = 4;
    g.fillStyle = 'rgba(0,0,0,0.35)'; rr(g, x+1, y+3, w, h, 5); g.fill();
    // 적재함
    const grad = g.createLinearGradient(x, 0, x + w, 0);
    grad.addColorStop(0, shade(body, -0.3)); grad.addColorStop(0.5, body); grad.addColorStop(1, shade(body, -0.36));
    g.fillStyle = grad; rr(g, x, y + h*0.22, w, h*0.78, 4); g.fill();
    // 캡
    g.fillStyle = shade(body, 0.22); rr(g, x + 2, y, w - 4, h*0.26, 5); g.fill();
    g.fillStyle = 'rgba(150,205,235,0.9)'; rr(g, x + w*0.16, y + 3, w*0.68, h*0.10, 2); g.fill();
    // 컨테이너 리브
    g.strokeStyle = 'rgba(0,0,0,0.22)'; g.lineWidth = 1;
    for (let i=1;i<6;i++){ const yy = y + h*0.22 + (h*0.78) * (i/6); g.beginPath(); g.moveTo(x+2, yy); g.lineTo(x+w-2, yy); g.stroke(); }
    // 바퀴
    g.fillStyle = '#14161a';
    g.fillRect(x - 1.5, y + h*0.24, 4, 12); g.fillRect(x + w - 2.5, y + h*0.24, 4, 12);
    g.fillRect(x - 1.5, y + h*0.62, 4, 16); g.fillRect(x + w - 2.5, y + h*0.62, 4, 16);
    g.fillStyle = 'rgba(255,90,80,0.9)';
    rr(g, x + w*0.08, y + h - 6, w*0.2, 4, 2); g.fill();
    rr(g, x + w*0.72, y + h - 6, w*0.2, 4, 2); g.fill();
  });
}

function rr(g, x, y, w, h, r){
  g.beginPath();
  g.moveTo(x+r, y);
  g.arcTo(x+w, y,   x+w, y+h, r);
  g.arcTo(x+w, y+h, x,   y+h, r);
  g.arcTo(x,   y+h, x,   y,   r);
  g.arcTo(x,   y,   x+w, y,   r);
  g.closePath();
}
function shade(hex, amt){
  const n = parseInt(hex.slice(1), 16);
  let r = (n>>16)&255, g2 = (n>>8)&255, b = n&255;
  if (amt > 0){ r += (255-r)*amt; g2 += (255-g2)*amt; b += (255-b)*amt; }
  else { r *= (1+amt); g2 *= (1+amt); b *= (1+amt); }
  return 'rgb(' + (r|0) + ',' + (g2|0) + ',' + (b|0) + ')';
}

   그대로 새 게임이 시작돼 버려서, 반드시 버튼을 눌러야 하도록 바꿨다. */
let uiBtns = [];
function btn(x, y, w, h, id, label, primary, sub){
  uiBtns.push({ x, y, w, h, id });
  ctx.save();
  ctx.fillStyle = primary ? 'rgba(255,210,87,0.16)' : 'rgba(255,255,255,0.07)';
  rr(ctx, x, y, w, h, 10); ctx.fill();
  ctx.lineWidth = primary ? 2 : 1.2;
  ctx.strokeStyle = primary ? '#ffd257' : 'rgba(255,255,255,0.30)';
  rr(ctx, x, y, w, h, 10); ctx.stroke();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = primary ? '#ffd257' : 'rgba(255,255,255,0.82)';
  ctx.font = 'bold ' + (primary ? 16 : 14) + 'px Menlo, monospace';
  ctx.fillText(label, x + w/2, y + h/2 + (sub ? -7 : 0));
  if (sub){
    ctx.font = '10px Menlo, monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.fillText(sub, x + w/2, y + h/2 + 11);
  }
  ctx.restore();
}
function uiHit(pt){
  if (!pt) return null;
  for (const b of uiBtns)
    if (pt.x >= b.x && pt.x <= b.x + b.w && pt.y >= b.y && pt.y <= b.y + b.h) return b.id;
  return null;
}

/* ── 디버그 훅 오염 표식 ────────────────────────────────────
   __race 훅으로 판 상태를 건드리거나 살아 있는 내부 객체를 꺼내 가면
   그 판을 '오염' 으로 표시하고 서버 공용 랭킹에는 올리지 않는다.
   로컬 기록(localStorage)은 그대로 남긴다 — 혼자 보는 값이라 남을 속이지 않는다.

   왜 필요한가: 서버의 시간 검사는 "훅으로 무적을 켜고 60초 기다린 뒤
   시간 예산만큼의 점수를 넣고 정상적으로 죽는" 스크립트를 못 막는다.
   서버가 볼 수 있는 건 경과 시간과 최종 점수뿐이고 둘 다 앞뒤가 맞기 때문이다.
   그래서 "이 판은 손을 댔다" 는 사실을 아는 유일한 곳 — 게임 안 — 에서 기록한다.

   표식은 이 스크립트를 감싼 IIFE 클로저 안에만 산다.
   window 에도 __race 에도 노출하지 않는다. 읽기용 게터조차 두지 않는다 —
   보이면 언제 되돌려야 하는지 알 수 있고, setter 를 두면 그 순간 전부 무의미해진다.
   지우는 길은 하나뿐: 디버그 상태가 하나도 안 남은 채로 newRun() 이 다시 도는 것.
   = 타이틀에서 '시작' 을 누르는 정상 경로. 디버그 start() 훅은 newRun() 다음에
   다시 표식을 세우므로 그 경로로는 절대 지워지지 않는다. */
let tainted = false;
// 무적 / x 고정 / 히트박스 표시도 클로저 안에 둔다.
// 예전에는 window.__race._inv 를 읽었는데, 그러면 훅(invincible())을 거치지 않고
// 콘솔에서 __race._inv = 1 만 해도 무적이 켜지고 오염 표식은 안 붙는다.
let dbgInv = false, dbgPin = null, dbgHit = false;
// 훅이 하나라도 불리면 여기를 지난다. 되돌리는 함수는 일부러 만들지 않았다.
const taint = () => { tainted = true; };

/* ── 공용 랭킹 (서버) ──────────────────────────────────────
   세 게임이 같은 출처라서 nginx 를 건드릴 필요가 없다.
   /plane/ 프록시의 끝 슬래시가 접두사를 잘라내므로
   /plane/api/rank 로 보내면 릴레이 서버의 /api/rank 로 들어간다.
   실패해도 게임은 그대로 돌아야 한다 — 전부 삼킨다. */
const Rank = (function(){
  const API = '/plane/api/rank';
  function ls(k, v){
    try {
      if (v === undefined) return localStorage.getItem(k) || '';
      localStorage.setItem(k, v);
    } catch(e){}
    return '';
  }
  function who(){ return ls('arcade-name') || ls('overtake-name') || ''; }
  // 런 토큰은 클로저 변수로만 들고 있는다. localStorage 에 두면 새로고침·다른 탭에서
  // 같은 표를 다시 쓰게 되는데, 서버는 1회용으로 보고 'token used' 로 거절한다.
  let tok = '';
  // 보낼 곳이 없는 상황(오프라인 file:// 플레이, fetch 가 없는 옛 브라우저)을 한 곳에서 판단한다.
  // 그냥 두면 콘솔이 CORS/에러로 가득 찬다.
  function off(){
    try { return location.protocol === 'file:' || typeof fetch !== 'function'; }
    catch(e){ return true; }
  }
  // 어떤 실패도 게임 코드로 새면 안 된다 — 거부(reject)가 아니라 항상 null 로 끝난다.
  function post(url, body){
    try {
      return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                          body: JSON.stringify(body) })
        .then(function(r){ return r.json(); })
        .catch(function(){ return null; });
    } catch(e){ return Promise.resolve(null); }
  }
  return {
    get uid(){ return ls('arcade-uid'); },
    get name(){ return who(); },
    // 판이 진짜로 시작하는 순간에 부른다. 서버가 경과 시간을 이 토큰의 발급 시각으로 직접 재므로,
    // 타이틀 화면에서 미리 받아 두면 시간만 부풀어 위조 여유를 준다.
    start(game){
      tok = '';                                  // 지난 판의 표가 남아 있으면 여기서 버린다
      if (off()) return Promise.resolve(null);
      const body = { game: game };
      const uid = ls('arcade-uid');
      if (uid) body.uid = uid;                   // 없으면 키째로 빼서 서버가 새로 발급하게 한다
      return post(API + '/start', body).then(function(d){
        if (!d || !d.ok) return null;            // 429(IP 한도) 포함 — 조용히 이번 판 제출을 포기한다
        // 서명 없는 옛 uid 는 서버가 무시하고 새로 발급한다. 그냥 덮어쓰면 된다.
        if (d.uid) ls('arcade-uid', d.uid);
        tok = d.tok || '';
        return d;
      }).catch(function(){ return null; });
    },
    submit(game, score, meta){
      if (off()) return Promise.resolve(null);
      const t = tok;
      tok = '';                                  // 먼저 비운다 — 같은 표로 두 번 제출되는 경로를 없앤다
      if (!t) return Promise.resolve(null);      // 시작 때 표를 못 받았으면 낼 근거가 없다
      // uid 는 보내지 않는다 (v2). 서버가 토큰에서 꺼내 쓴다.
      return post(API, { game: game, tok: t, score: Math.round(score),
                         name: who(), meta: meta || {} });
    },
  };
})();

const RANK_MAX = 10;
function loadRanks(){
  // v2 = 거리 기준. 예전 초 기준 기록(overtake-ranks)과 섞으면 순위가 엉킨다.
  try { const r = JSON.parse(localStorage.getItem('overtake-ranks-v2') || '[]');
        return Array.isArray(r) ? r : []; } catch(e){ return []; }
}
function saveRanks(r){
  try { localStorage.setItem('overtake-ranks-v2', JSON.stringify(r.slice(0, RANK_MAX))); } catch(e){}
}
let ranks = loadRanks();
let myRankIdx = -1;                 // 방금 넣은 기록의 순위 (하이라이트용)
function addRank(entry){
  ranks = loadRanks();
  ranks.push(entry);
  // 예전 기록(v2 초기)에는 score 가 없다 — 그 땐 주행거리가 곧 기록이었으니 dist 로 떨어진다.
  const sk = r => (r.score != null ? r.score : (r.dist || 0));
  ranks.sort((a, b) => sk(b) - sk(a));
  ranks = ranks.slice(0, RANK_MAX);
  saveRanks(ranks);
  return ranks.indexOf(entry);      // 10위 밖이면 -1
}

let overTick = 0;            // 충돌 화면이 시작 화면으로 넘어가기까지 남은 프레임

function newRun(){
  // 새 판이 시작될 때만 오염 표식을 지운다. 단, 무적 같은 디버그 상태가 아직 켜져 있으면
  // 지우지 않는다 — 안 그러면 '무적 켜 놓고 정상 경로로 시작' 이 깨끗한 판이 돼 버린다.
  // 디버그 start() 훅은 이 함수를 부른 뒤 다시 taint() 하므로 여기서 지워지지 않는다.
  tainted = (dbgInv || dbgPin != null || dbgHit);
  for (let i=0;i<MAX_CAR;i++) cars[i].on = false;
  for (let i=0;i<MAX_PART;i++) parts[i].on = false;
  for (let i=0;i<MAX_PROP;i++) props[i].on = false;
  player.x = LW/2; player.y = PLAYER.y; player.spd = SPD_START; player.vx = 0; player.tilt = 0; player.hurt = 0;
  scroll = 0; shake = 0; flash = 0;
  G = {
    time: 0,               // 프레임
    overtakes: 0,
    nearMiss: 0,
    dist: 0,                 // 실제로 달린 거리 (유닛). 순수한 주행거리다.
    bonus: 0,                // 아슬아슬 보너스 거리 (유닛)
    combo: 0,                // 현재 아슬아슬 콤보
    comboBest: 0,
    comboT: 0,               // 콤보가 끊길 때까지 남은 프레임
    pops: [],                // 화면에 띄우는 '+38m' 표시
    spawnTick: 8,
    wallTick: 0,
    oncTick: 0,
    banner: 0, bannerText: '',
    oncWarn: null,
    oncLane: -1,           // 역주행이 오는 차선 (정주행 스폰 금지)
    newBest: false,
    finished: false,
  };
  // 배경 소품 미리 배치
  for (let i=0;i<MAX_PROP;i++){
    props[i].on = true;
    props[i].x = (i % 2 === 0) ? (ROAD.x - 24 - Math.random()*16) : (ROAD.x + ROAD.w + 8 + Math.random()*16);
    props[i].y = -Math.random() * LH * 2;
    props[i].kind = 0;
  }
}

const sec = () => G.time / 60;

// 기록 = 주행거리 + 아슬아슬 보너스. 둘 다 유닛이라 그냥 더한다.
const scoreOf = (g) => (g.dist || 0) + (g.bonus || 0);
// 현재 속도의 보너스 배율 (기본 1.0 → 최고 NEAR_SPD_SCALE)
function spdMul(){
  const t = (player.spd - SPD_BASE) / (SPD_MAX - SPD_BASE);
  return 1 + (NEAR_SPD_SCALE - 1) * Math.max(0, Math.min(1, t));
}
function comboMul(){
  return 1 + Math.min(G.combo, NEAR_COMBO_MAX) * NEAR_COMBO_STEP;
}

/* ═══════════════════════════════════════════════════
   난이도 — 시간에 따라 값이 자란다
   ═══════════════════════════════════════════════════ */
function diff(){
  const t = sec();
  // 램프를 0 이 아니라 0.25 에서 시작한다 — 시작 직후부터 차가 제법 있어야 한다.
  // 최대치 도달도 55초로 당겼다.
  const ramp = Math.min(1, 0.32 + t / 40);
  return {
    // 교통량: 스폰 간격이 좁아진다
    interval: Math.round(36 - 25 * ramp),                // 시작 28 → 최소 11 프레임
    // 상대 속도: 느린 차가 조금씩 빨라져 추월 여유가 줄어든다
    // 순항(7.0) 보다 느려야 기본 속도로도 계속 추월이 일어난다.
    // 후반에는 최고 속도가 순항에 붙어서, 추월하려면 가속을 밟아야 한다.
    // 폭을 넓혔다 — 느린 차와 빠른 차가 섞여야 차선별 속도 차가 커진다.
    npcMin: 2.5 + 1.5 * ramp,                            // 3.0 → 4.0
    npcMax: 4.9 + 2.1 * ramp,                            // 5.6 → 7.0
    truckChance: 0.20 + 0.12 * ramp,
    laneChange: t < T_LANECHANGE ? 0 : Math.min(0.62, 0.22 + (t - T_LANECHANGE) / 40),
    wallEvery: t < T_WALL ? 1e9 : Math.max(140, 360 - (t - T_WALL) * 6.5),
    oncEvery:  t < T_ONCOMING ? 1e9 : Math.max(95, 270 - (t - T_ONCOMING) * 5.4),
    ramp,
  };
}

/* ═══════════════════════════════════════════════════
   스폰
   ═══════════════════════════════════════════════════ */
// 어떤 차가 lane 으로 들어가도 안전한가 (차선 변경 판단용)
function laneClearFor(c, lane){
  const tx = laneX(lane);
  for (let j=0;j<MAX_CAR;j++){
    const a = cars[j];
    if (!a.on || a === c) continue;
    if (Math.abs(a.x - tx) >= (a.w + c.w) * 0.5 + 8) continue;
    if (Math.abs(a.y - c.y) < (a.h + c.h) * 0.5 + 46) return false;
  }
  return true;
}

// 같은 방향 차량끼리 겹치지 않게 한다.
// 뒤차가 앞차보다 빠르면 앞차 속도로 수렴시키고, 그래도 붙으면 물리적으로 밀어낸다.
// 이게 없으면 같은 차선에서 속도 차이만큼 그대로 겹쳐 지나간다.
function trafficAvoid(){
  for (let i=0;i<MAX_CAR;i++){
    const b = cars[i];
    if (!b.on || b.kind === 'onc') continue;
    let lead = null, bestGap = 1e9;
    for (let j=0;j<MAX_CAR;j++){
      if (j === i) continue;
      const a = cars[j];
      if (!a.on || a.kind === 'onc') continue;
      if (a.y >= b.y) continue;                                    // 앞(위)에 있는 차만
      if (Math.abs(a.x - b.x) >= (a.w + b.w) * 0.5 + 2) continue;  // 같은 폭에 걸린 차만
      const gap = (b.y - a.y) - (a.h + b.h) * 0.5;
      if (gap < bestGap){ bestGap = gap; lead = a; }
    }
    if (!lead) continue;
    if (bestGap < 95 && b.spd > lead.spd) b.spd = Math.max(lead.spd, b.spd - 0.22);
    if (bestGap < 3){                                              // 겹치기 직전 — 밀어낸다
      b.y = lead.y + (lead.h + b.h) * 0.5 + 3;
      b.spd = lead.spd;
    }
  }
}

// 정면(역주행)과 겹치는 정주행 차가 남았으면 급하게 옆으로 뺀다.
// 위 장치들로 거의 안 생기지만, 생겼을 때 겹쳐 보이지 않게 하는 마지막 안전망이다.
function oncAvoid(){
  for (let i=0;i<MAX_CAR;i++){
    const o = cars[i];
    if (!o.on || o.kind !== 'onc') continue;
    for (let j=0;j<MAX_CAR;j++){
      const c = cars[j];
      if (!c.on || c.kind === 'onc') continue;
      if (Math.abs(c.x - o.x) >= (c.w + o.w) * 0.5 + 10) continue;
      if (Math.abs(c.y - o.y) >= (c.h + o.h) * 0.5 + 70) continue;
      const dir = (c.x < ROAD.x + ROAD.w - LANE_W) ? 1 : -1;
      c.x += dir * 3.2;
      c.x = Math.max(ROAD.x + c.w*0.5 + 2, Math.min(ROAD.x + ROAD.w - c.w*0.5 - 2, c.x));
      c.changing = false; c.pendingLane = -1; c.blinker = 1;
      if (frame % 6 === 0) spawnPart(c.x, c.y + c.h*0.4, dir*0.6, 1.4, 12, 'rgba(230,235,240,', 2);
    }
  }
}

function laneFree(lane, y, h){
  for (let i=0;i<MAX_CAR;i++){
    const c = cars[i];
    if (!c.on) continue;
    if (Math.abs(c.x - laneX(lane)) > LANE_W * 0.7) continue;
    if (y - h*0.5 < c.y + c.h*0.5 + 42 && y + h*0.5 > c.y - c.h*0.5 - 42) return false;
  }
  return true;
}

function spawnTraffic(d){
  const isTruck = Math.random() < d.truckChance;
  const h = isTruck ? 88 : 56;
  const y = -h - 20;

  // 차선 하나가 막혔다고 이 틱을 버리지 않는다 — 최대 3곳을 시도한다.
  // (막힌 차선만 뽑아서 스폰이 계속 취소되면 밀도가 오르지 않는다)
  let lane = -1;
  for (let k = 0; k < 3; k++){
    let l = Math.floor(Math.random() * LANES);
    if (l === G.oncLane) l = (l + 1 + Math.floor(Math.random() * (LANES - 1))) % LANES;
    if (l === G.oncLane) continue;
    if (laneFree(l, y, h)){ lane = l; break; }
  }
  if (lane < 0) return;
  const c = spawnCar(); if (!c) return;
  c.on = true; c.lane = lane; c.y = y;
  c.kind = isTruck ? 'truck' : 'npc';
  c.w = isTruck ? 40 : 32; c.h = h;
  initLaneOff(c);
  c.x = laneX(lane) + laneOff(c);
  c.spr = isTruck ? SPR.truck[Math.floor(Math.random()*SPR.truck.length)]
                  : SPR.npc[Math.floor(Math.random()*SPR.npc.length)];
  // 트럭은 느리다 — 추월 대상이 되기 좋게
  const lo = d.npcMin, hi = d.npcMax;
  c.spd = isTruck ? lo * 0.82 + Math.random() * 0.5 : lo + Math.random() * (hi - lo);
  c.passed = false; c.nearMissed = false;
  c.changing = false; c.blinker = 0;
  // 차선 변경 예정?
  if (!isTruck && Math.random() < d.laneChange){
    const dir = (lane === 0) ? 1 : (lane === LANES-1) ? -1 : (Math.random() < 0.5 ? -1 : 1);
    const want = lane + dir;
    c.pendingLane = (want === G.oncLane) ? -1 : want;
    c.pendingAt = 30 + Math.floor(Math.random() * 60);
  } else c.pendingLane = -1;
}

// 차량 벽 — 한 차선만 비운다. 속도를 죽이고 그 틈으로 들어가야 한다.
function spawnWall(d){
  // 역주행이 오는 차선이 있으면 그 차선을 통로로 삼는다 (벽이 정면 관통을 만들지 않게)
  const gap = (G.oncLane >= 0) ? G.oncLane : Math.floor(Math.random() * LANES);
  const y = -170;
  for (let l=0;l<LANES;l++){
    if (l === gap) continue;
    if (l === G.oncLane) continue;
    if (!laneFree(l, y, 56)) continue;
    const c = spawnCar(); if (!c) continue;
    c.on = true; c.lane = l; c.y = y - Math.random()*14;
    c.kind = 'npc'; c.w = 32; c.h = 56;
    // 벽은 흔들림을 줄인다 — 통로가 32px 미만으로 좁아지면 통과가 불가능해진다
    initLaneOff(c, 0.4);
    c.x = laneX(l) + laneOff(c);
    c.spr = SPR.npc[Math.floor(Math.random()*SPR.npc.length)];
    c.spd = d.npcMin + Math.random() * 0.6;      // 벽은 느리게 — 브레이크를 강제한다
    c.passed = false; c.nearMissed = false;
    c.changing = false; c.blinker = 0; c.pendingLane = -1;
  }
  G.banner = 80; G.bannerText = '밀집 — 틈을 노려라';
}

// 역주행 예고 — 실제 차보다 먼저 차선을 붉게 경고한다.
// 닫히는 속도가 초당 ~16px(=960px/s) 이라 예고 없이 내보내면 반응 시간이 0.6초뿐이다.
// 예고 45프레임(0.75초) + 진입 후 주행 시간까지 합쳐 약 1.5초를 준다.
// 역주행이 들어갈 차선은 정주행 차가 가장 적은 쪽을 고른다.
function pickOncLane(){
  let best = 0, bestN = 1e9;
  for (let l=0;l<2;l++){
    let n = 0;
    for (let i=0;i<MAX_CAR;i++){
      const c = cars[i];
      if (!c.on || c.kind === 'onc') continue;
      if (Math.abs(c.x - laneX(l)) > LANE_W * 0.6) continue;
      if (c.y > player.y + 60) continue;          // 이미 지나간 차는 셈에서 뺀다
      n++;
    }
    if (n < bestN){ bestN = n; best = l; }
  }
  return best;
}

function warnOncoming(){
  const lane = pickOncLane();
  G.oncWarn = { lane, t: 60, tries: 0 };
  G.oncLane = lane;
  // 그 차선에 있던 정주행 차들은 옆으로 피한다 (역주행을 피하는 것처럼 읽힌다)
  for (let i=0;i<MAX_CAR;i++){
    const c = cars[i];
    if (!c.on || c.kind === 'onc') continue;
    if (Math.abs(c.x - laneX(lane)) > LANE_W * 0.6) continue;
    const alt = (lane + 1 < LANES) ? lane + 1 : lane - 1;
    if (laneClearFor(c, alt)){
      c.changing = true; c.flee = true;
      c.targetX = laneX(alt) + laneOff(c);
      c.changeSpd = (c.targetX > c.x) ? 1.0 : -1.0;
      c.lane = alt; c.pendingLane = -1; c.blinker = 1;
    }
  }
  G.banner = 70; G.bannerText = '⚠ 역주행';
  Sound.blip(300, 0.12, 'square', 0.10);
  setTimeout(()=>Sound.blip(300, 0.12, 'square', 0.10), 220);
}

// 역주행 차선이 정주행 차 없이 비어 있는가 (플레이어 앞쪽까지)
function oncLaneClear(lane){
  const lx = laneX(lane);
  for (let i=0;i<MAX_CAR;i++){
    const c = cars[i];
    if (!c.on || c.kind === 'onc') continue;
    if (Math.abs(c.x - lx) > (c.w + 32) * 0.5 + 4) continue;
    if (c.y < player.y + 80) return false;        // 앞쪽에 아직 차가 있다
  }
  return true;
}

// 역주행 — 마주 달려온다. 체감 속도가 두 배.
function spawnOncoming(d, forceLane){
  const lane = (forceLane !== undefined) ? forceLane : Math.floor(Math.random() * 2);
  const y = -200;
  if (!laneFree(lane, y, 56)) return;
  const c = spawnCar(); if (!c) return;
  c.on = true; c.lane = lane; c.y = y;
  c.kind = 'onc'; c.w = 32; c.h = 56;
  initLaneOff(c, 0.7);
  c.x = laneX(lane) + laneOff(c);
  c.spr = SPR.onc[Math.floor(Math.random()*SPR.onc.length)];
  c.spd = -(2.6 + Math.random() * 1.8 + d.ramp * 1.4);   // 음수 = 역주행
  c.passed = false; c.nearMissed = false;
  c.changing = false; c.blinker = 0; c.pendingLane = -1;
}

/* ═══════════════════════════════════════════════════
   업데이트
   ═══════════════════════════════════════════════════ */
function updatePlayer(){
  // ── 좌우
  let ax = 0;
  if (Input.touch){
    const dx = Input.touch.x - player.x;
    ax = Math.max(-1, Math.min(1, dx / 26));
  } else {
    if (Input.left)  ax -= 1;
    if (Input.right) ax += 1;
  }
  const LAT_ACC = 0.62, LAT_MAX = 5.4, LAT_FRIC = 0.80;
  player.vx += ax * LAT_ACC;
  if (ax === 0) player.vx *= LAT_FRIC;
  player.vx = Math.max(-LAT_MAX, Math.min(LAT_MAX, player.vx));
  player.x += player.vx;

  // 자동 테스트용 — 특정 x 에 고정 (안전지대 검사)
  if (dbgPin != null){ player.x = dbgPin; player.vx = 0; }

  // 가드레일 — 즉사가 아니라 튕기고 감속. 즉사로 하면 너무 짜다.
  const half = PLAYER.w / 2;
  const lo = ROAD.x + half - 2, hi = ROAD.x + ROAD.w - half + 2;
  if (player.x < lo){
    player.x = lo; player.vx = Math.abs(player.vx) * 0.35;
    player.spd = Math.max(SPD_MIN, player.spd - 0.28);
    if (frame % 4 === 0){ spawnPart(player.x - half, player.y, -1.5, 1.5, 16, '#ffd66b', 2); Sound.blip(180, 0.04, 'square', 0.06); }
  }
  if (player.x > hi){
    player.x = hi; player.vx = -Math.abs(player.vx) * 0.35;
    player.spd = Math.max(SPD_MIN, player.spd - 0.28);
    if (frame % 4 === 0){ spawnPart(player.x + half, player.y, 1.5, 1.5, 16, '#ffd66b', 2); Sound.blip(180, 0.04, 'square', 0.06); }
  }

  // ── 가속 (브레이크 없음)
  //    ① 키보드 ↑ / W   ② 화면의 ▲ 버튼   ③ 조향 손가락을 위로 끌기 — 셋 다 가속
  let ay = 0;
  if (Input.up || Input.gas) ay = 1;
  else if (Input.touch){
    const dy = Input.touch.baseY - Input.touch.y;
    if (dy > 12) ay = Math.min(1, dy / 70);
  }

  if (ay > 0) player.spd += ACCEL * ay;
  else        player.spd -= COAST;                   // 떼면 기본 속도로 복귀
  player.spd = Math.max(SPD_BASE, Math.min(SPD_MAX, player.spd));

  // 기울기 (좌우 이동감)
  player.tilt += ((player.vx / LAT_MAX) * 0.20 - player.tilt) * 0.18;
  if (player.hurt > 0) player.hurt--;

  // 타이어 먼지 / 배기
  if (frame % 3 === 0){
    const t = (player.spd - SPD_BASE) / (SPD_MAX - SPD_BASE);
    spawnPart(player.x - 9 + Math.random()*18, player.y + PLAYER.h/2,
              (Math.random()-0.5)*0.6, 2.2 + t*2.5, 14, 'rgba(210,220,230,', 2);
  }
}

function updateWorld(){
  const d = diff();

  // 스폰
  G.spawnTick--;
  if (G.spawnTick <= 0){ spawnTraffic(d); G.spawnTick = d.interval + Math.floor(Math.random()*10); }
  G.wallTick++;
  if (G.wallTick >= d.wallEvery){ spawnWall(d); G.wallTick = 0; }
  G.oncTick++;
  if (G.oncTick >= d.oncEvery && !G.oncWarn){ warnOncoming(); G.oncTick = 0; }
  if (G.oncWarn){
    G.oncWarn.t--;
    if (G.oncWarn.t <= 0){
      // 아직 그 차선에 정주행 차가 남아 있으면 내보내지 않는다.
      // 겹쳐 지나가는 것보다 이번 역주행을 건너뛰는 편이 낫다.
      if (oncLaneClear(G.oncWarn.lane)){
        spawnOncoming(d, G.oncWarn.lane); G.oncWarn = null;
      } else if (G.oncWarn.tries < 3){
        G.oncWarn.tries++; G.oncWarn.t = 24;      // 조금 더 기다린다
      } else {
        G.oncWarn = null; G.oncLane = -1;         // 포기 — 다음 기회에
      }
    }
  }

  // 차량 이동
  for (let i=0;i<MAX_CAR;i++){
    const c = cars[i];
    if (!c.on) continue;

    // 상대 속도 = 내 속도 - 상대 속도.  역주행(음수)이면 더해져서 훨씬 빠르게 다가온다.
    c.y += (player.spd - c.spd);

    // 차선 변경 예약 처리 — 옆 차선이 비었을 때만 들어간다
    if (c.pendingLane >= 0){
      c.pendingAt--;
      if (c.pendingAt <= 0){
        if (c.pendingLane === G.oncLane){ c.pendingLane = -1; c.blinker = 0; }
        else if (laneClearFor(c, c.pendingLane)){
          c.changing = true; c.targetX = laneX(c.pendingLane) + laneOff(c);
          c.changeSpd = (c.targetX > c.x) ? 1.0 : -1.0;
          c.lane = c.pendingLane; c.pendingLane = -1; c.blinker = 1;
        } else {
          c.pendingAt = 24;              // 막혔다 — 잠시 뒤 다시 시도
        }
      } else if (c.pendingAt < 40) c.blinker = 1;      // 미리 깜빡인다 (예고)
    }
    if (c.changing){
      // 이동 중에도 목표 지점이 막히면 그 프레임은 멈춘다 (옆구리 관통 방지)
      const step = c.changeSpd * (c.flee ? 2.1 : 1.15);
      const nx = c.x + step;
      let blocked = false;
      for (let j=0;j<MAX_CAR;j++){
        const a = cars[j];
        if (!a.on || a === c || a.kind === 'onc') continue;
        if (Math.abs(a.x - nx) < (a.w + c.w) * 0.5 + 1 &&
            Math.abs(a.y - c.y) < (a.h + c.h) * 0.5 + 2){ blocked = true; break; }
      }
      if (!blocked) c.x = nx;
      if ((c.changeSpd > 0 && c.x >= c.targetX) || (c.changeSpd < 0 && c.x <= c.targetX)){
        c.x = c.targetX; c.changing = false; c.blinker = 0; c.flee = false;
      }
    } else if (c.oxAmp > 0){
      // ── 차선 안에서 좌우로 흔들린다 (경계선 안전지대 제거)
      c.oxPh += c.oxSpd;
      const want = laneX(c.lane) + laneOff(c);
      let step = want - c.x;
      step = Math.max(-0.6, Math.min(0.6, step));
      const nx = c.x + step;
      let blocked = false;
      for (let j=0;j<MAX_CAR;j++){
        const a = cars[j];
        if (!a.on || a === c) continue;
        if (Math.abs(a.x - nx) < (a.w + c.w) * 0.5 + 2 &&
            Math.abs(a.y - c.y) < (a.h + c.h) * 0.5 + 2){ blocked = true; break; }
      }
      if (!blocked){
        // 가드레일 밖으로는 나가지 않는다
        c.x = Math.max(ROAD.x + c.w*0.5 + 2, Math.min(ROAD.x + ROAD.w - c.w*0.5 - 2, nx));
      }
    }

    // 추월 판정 — 내 뒤로 넘어가는 순간
    if (!c.passed && c.y > player.y + PLAYER.h * 0.5){
      c.passed = true;
      if (c.kind !== 'onc'){ G.overtakes++; if (G.overtakes % 5 === 0) Sound.overtake(); }
    }
    // 아슬아슬 — 옆을 스칠 때
    if (!c.nearMissed){
      const dy = Math.abs(c.y - player.y);
      const dx = Math.abs(c.x - player.x);
      // 판정 밖에서만 — 히트박스가 차체 그대로가 됐으니 경계도 정확히 (c.w+PLAYER.w)/2 다
      if (dy < (c.h + PLAYER.h) * 0.45 && dx < NEAR_MISS_X + (c.w + PLAYER.w) * 0.5 && dx >= (c.w + PLAYER.w) * 0.5){
        c.nearMissed = true; G.nearMiss++;
        // 콤보는 '스친 것들 사이 간격' 으로 이어진다. 끊겼으면 1부터 다시.
        G.combo = (G.comboT > 0) ? G.combo + 1 : 1;
        G.comboT = COMBO_HOLD;
        if (G.combo > G.comboBest) G.comboBest = G.combo;
        const gain = NEAR_BASE * spdMul() * comboMul();
        G.bonus += gain;
        // 얼마 벌었는지 그 자리에 띄운다 — 안 보이면 없는 규칙이나 마찬가지다
        G.pops.push({ x: c.x, y: c.y, m: gain * M_PER_UNIT, life: 46, combo: G.combo });
        if (G.pops.length > 12) G.pops.shift();
        Sound.nearMiss();
        for (let q=0;q<4;q++)
          spawnPart(c.x + (player.x > c.x ? c.w*0.5 : -c.w*0.5), c.y + (Math.random()-0.5)*c.h,
                    (Math.random()-0.5)*1.2, 3, 12, 'rgba(255,240,170,', 2);
      }
    }

    if (c.y > LH + 120 || c.y < -400) c.on = false;
  }

  // 같은 방향 차량끼리 겹치지 않게 정리 (이동 뒤에 한 번)
  trafficAvoid();
  oncAvoid();

  // 역주행이 전부 지나갔으면 그 차선을 다시 열어 준다
  if (G.oncLane >= 0 && !G.oncWarn){
    let stillThere = false;
    for (let i=0;i<MAX_CAR;i++) if (cars[i].on && cars[i].kind === 'onc'){ stillThere = true; break; }
    if (!stillThere) G.oncLane = -1;
  }

  // 배경 소품
  for (let i=0;i<MAX_PROP;i++){
    const p = props[i];
    if (!p.on) continue;
    p.y += player.spd;
    if (p.y > LH + 40){
      p.y = -40 - Math.random() * 200;
      p.x = (Math.random() < 0.5) ? (ROAD.x - 26 - Math.random()*16) : (ROAD.x + ROAD.w + 8 + Math.random()*16);
    }
  }

  scroll += player.spd;
  G.dist += player.spd;
}

/* 둥근 사각형 두 개의 충돌 — 실루엣 그대로 판정한다.
   둥근 사각형은 (반폭-r, 반높이-r) 크기의 사각형에 반지름 r 원을 민코프스키 합한 도형이다.
   따라서 "속 사각형 두 개의 거리 ≤ r1+r2" 가 정확한 판정식이 된다.
   그냥 AABB 로 하면 모서리 바깥의 빈 공간에서도 죽어서 억울하다. */
function hitRR(dx, dy, aw, ah, ar, bw, bh, br){
  const gx = dx - ((aw*0.5 - ar) + (bw*0.5 - br));
  const gy = dy - ((ah*0.5 - ar) + (bh*0.5 - br));
  const r = ar + br;
  if (gx <= 0 && gy <= 0) return true;             // 속 사각형끼리 이미 겹쳤다
  const ox = Math.max(gx, 0), oy = Math.max(gy, 0);
  return ox*ox + oy*oy <= r*r;
}
const carR = c => (c.kind === 'truck' ? TRUCK_R : CAR_R);

function collide(){
  if (dbgInv) return;                                // 자동 테스트용 무적 (클로저 변수 — 콘솔에서 직접 못 켠다)
  const px = player.x, py = player.y;
  for (let i=0;i<MAX_CAR;i++){
    const c = cars[i];
    if (!c.on) continue;
    if (Math.abs(c.x - px) >= (c.w + PLAYER.w) * 0.5) continue;    // 빠른 제외
    if (Math.abs(c.y - py) >= (c.h + PLAYER.h) * 0.5) continue;
    if (hitRR(Math.abs(c.x - px), Math.abs(c.y - py),
              c.w, c.h, carR(c), PLAYER.w, PLAYER.h, CAR_R)){
      crash(c);
      return;
    }
  }
}

function crash(c){
  G.finished = true;
  shake = 26; flash = 1;
  Sound.crash();
  Sound.setEngine(player.spd, false);
  for (let q=0;q<40;q++){
    const a = Math.random() * Math.PI * 2, v = 1 + Math.random() * 5;
    spawnPart(player.x, player.y - 10, Math.cos(a)*v, Math.sin(a)*v - 1,
              28 + Math.random()*22, q % 3 === 0 ? 'rgba(255,210,120,' : 'rgba(255,120,80,', 2 + Math.random()*2);
  }
  for (let q=0;q<14;q++)
    spawnPart(player.x, player.y, (Math.random()-0.5)*3, (Math.random()-0.5)*3 + 1.5, 40, 'rgba(180,190,200,', 3);

  const t = sec(), d = G.dist, sc = scoreOf(G);
  lastRun = { sec: t, overtakes: G.overtakes, nearMiss: G.nearMiss,
              dist: d, bonus: G.bonus, score: sc, comboBest: G.comboBest,
              kmh: Math.round(player.spd * KMH), newBest: false };
  // 최고 기록도 '기록'(주행+보너스) 기준이다. 주행거리만으로 재면
  // 아슬아슬 보너스가 순위에는 들어가는데 BEST 에는 안 들어가 서로 어긋난다.
  G.newBest = sc > bestDist;
  if (G.newBest){
    bestDist = sc; bestOver = G.overtakes;
    try { localStorage.setItem('overtake-best-d', String(sc)); localStorage.setItem('overtake-best-ot', String(G.overtakes)); } catch(e){}
    Sound.best();
  }
  lastRun.newBest = G.newBest;
  myRankIdx = addRank({ dist: d, bonus: G.bonus, score: sc, sec: t,
                        overtakes: G.overtakes, nearMiss: G.nearMiss,
                        combo: G.comboBest, name: nick, ts: Date.now() });
  // 서버 공용 랭킹에도 올린다. 단위는 내부 유닛이 아니라 미터여야 다른 게임과 축이 맞는다.
  // 한 판에 한 번만 (crash 가 두 번 불리는 경로를 대비).
  // 디버그 훅이 닿은 판은 서버로 보내지 않는다. 위의 로컬 기록/BEST 는 그대로 쓴다.
  if (!G._sent && !tainted){
    G._sent = 1;
    Rank.submit('race', sc * M_PER_UNIT, { sec: +t.toFixed(1), overtakes: G.overtakes,
                                           nearMiss: G.nearMiss, combo: G.comboBest });
  }
  lastRun.rank = myRankIdx;
  overTick = 100;              // 약 1.7초 충돌 장면을 보여준 뒤 결과 화면으로
  state = S.OVER;
}

function updateParts(){
  for (let i=0;i<MAX_PART;i++){
    const p = parts[i];
    if (!p.on) continue;
    p.x += p.vx; p.y += p.vy; p.vy *= 0.985; p.vx *= 0.985;
    if (--p.life <= 0) p.on = false;
  }
}

function updatePlay(){
  G.time++;
  if (G.banner > 0) G.banner--;
  if (G.comboT > 0) G.comboT--;
  else G.combo = 0;
  for (let i = G.pops.length - 1; i >= 0; i--){
    const q = G.pops[i];
    q.y -= 1.1; q.life--;
    if (q.life <= 0) G.pops.splice(i, 1);
  }
  updatePlayer();
  updateWorld();
  collide();
  updateParts();
  Sound.setEngine(player.spd, true);
  if (shake > 0) shake *= 0.88;
  if (flash > 0) flash *= 0.86;
}

let shakeX = 0, shakeY = 0;

function drawRoad(){
  // 노면
  const g = ctx.createLinearGradient(ROAD.x, 0, ROAD.x + ROAD.w, 0);
  g.addColorStop(0, '#2c3138'); g.addColorStop(0.5, '#353b44'); g.addColorStop(1, '#2c3138');
  ctx.fillStyle = g;
  ctx.fillRect(ROAD.x, 0, ROAD.w, LH);

  // 차선 점선
  ctx.strokeStyle = 'rgba(235,240,245,0.55)';
  ctx.lineWidth = 3;
  ctx.setLineDash([26, 24]);
  ctx.lineDashOffset = -(scroll % 50);
  for (let i=1;i<LANES;i++){
    const x = ROAD.x + LANE_W * i;
    ctx.beginPath(); ctx.moveTo(x, -10); ctx.lineTo(x, LH+10); ctx.stroke();
  }
  ctx.setLineDash([]);

  // 가장자리 실선
  ctx.strokeStyle = 'rgba(245,248,252,0.75)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(ROAD.x + 3, 0); ctx.lineTo(ROAD.x + 3, LH); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ROAD.x + ROAD.w - 3, 0); ctx.lineTo(ROAD.x + ROAD.w - 3, LH); ctx.stroke();

  // 가드레일 (스크롤하는 기둥)
  ctx.fillStyle = '#8d97a4';
  ctx.fillRect(ROAD.x - 7, 0, 5, LH);
  ctx.fillRect(ROAD.x + ROAD.w + 2, 0, 5, LH);
  ctx.fillStyle = 'rgba(255,255,255,0.20)';
  const step = 34, off = scroll % step;
  for (let y = -step + off; y < LH + step; y += step){
    ctx.fillRect(ROAD.x - 7, y, 5, 8);
    ctx.fillRect(ROAD.x + ROAD.w + 2, y, 5, 8);
  }
}

function drawProps(){
  for (let i=0;i<MAX_PROP;i++){
    const p = props[i];
    if (!p.on) continue;
    const s = SPR.tree;
    ctx.drawImage(s.canvas, p.x - s.w/2, p.y - s.h/2, s.w, s.h);
  }
}

function drawCar(spr, x, y, tilt, blink){
  if (!spr) return;                 // 스프라이트가 비어도 루프가 죽지 않게
  ctx.save();
  ctx.translate(x, y);
  if (tilt) ctx.rotate(tilt);
  ctx.drawImage(spr.canvas, -spr.w/2, -spr.h/2, spr.w, spr.h);
  ctx.restore();
  if (blink && Math.floor(frame / 8) % 2 === 0){
    ctx.fillStyle = '#ffcf3d';
    ctx.beginPath(); ctx.arc(x + (blink > 0 ? 1 : -1) * 17, y - 14, 3.2, 0, 6.3); ctx.fill();
  }
}

// 역주행 예고 — 해당 차선 위쪽을 붉게 깜빡인다
function drawOncWarn(){
  if (!G || !G.oncWarn) return;
  const w = G.oncWarn;
  const x = ROAD.x + LANE_W * w.lane;
  const pulse = 0.30 + Math.abs(Math.sin(frame * 0.28)) * 0.40;
  const g = ctx.createLinearGradient(0, 0, 0, 260);
  g.addColorStop(0, 'rgba(255,60,60,' + pulse.toFixed(3) + ')');
  g.addColorStop(1, 'rgba(255,60,60,0)');
  ctx.fillStyle = g;
  ctx.fillRect(x, 0, LANE_W, 260);
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.globalAlpha = pulse + 0.25;
  ctx.fillStyle = '#ffffff'; ctx.font = 'bold 26px Menlo, monospace';
  ctx.fillText('▼', x + LANE_W/2, 74);
  ctx.font = 'bold 10px Menlo, monospace';
  ctx.fillText('역주행', x + LANE_W/2, 100);
  ctx.restore();
}

// 역주행 차의 헤드라이트 — 나를 향해 아래로 뻗는다.
// 색만으로 구분하면 황색 NPC 와 헷갈리므로, 형태로 확실히 분리한다.
function drawHeadlights(c){
  const yb = c.y + c.h * 0.5;
  const flick = 0.82 + Math.sin(frame * 0.9 + c.x) * 0.10;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const sx of [-1, 1]){
    const x0 = c.x + sx * c.w * 0.28;
    const g = ctx.createLinearGradient(x0, yb, x0, yb + 120);
    g.addColorStop(0, 'rgba(255,244,190,' + (0.42 * flick).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(255,244,190,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(x0 - 5, yb);
    ctx.lineTo(x0 + 5, yb);
    ctx.lineTo(x0 + 22, yb + 120);
    ctx.lineTo(x0 - 22, yb + 120);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function drawCars(){
  for (let i=0;i<MAX_CAR;i++){
    const c = cars[i];
    if (!c.on) continue;
    if (c.y < -140 || c.y > LH + 140) continue;
    if (c.kind === 'onc') drawHeadlights(c);
    const blink = c.blinker ? (c.changing ? c.changeSpd : (c.pendingLane > c.lane ? 1 : -1)) : 0;
    drawCar(c.spr, c.x, c.y, 0, blink);
    // 역주행은 경고 화살표를 위에 띄운다
    if (c.kind === 'onc' && c.y < player.y - 40){
      ctx.save();
      ctx.globalAlpha = 0.55 + Math.sin(frame*0.3)*0.3;
      ctx.fillStyle = '#ff5c5c';
      ctx.beginPath();
      ctx.moveTo(c.x, c.y - c.h*0.5 - 16);
      ctx.lineTo(c.x - 7, c.y - c.h*0.5 - 26);
      ctx.lineTo(c.x + 7, c.y - c.h*0.5 - 26);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }
}

function drawPlayer(){
  const spr = (player.hurt > 0 && Math.floor(frame/3)%2===0) ? SPR.playerHit : SPR.player;
  // 속도선 (스피드 라인)
  const t = (player.spd - SPD_BASE) / (SPD_MAX - SPD_BASE);
  if (t > 0.35){
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,' + ((t-0.35) * 0.30).toFixed(3) + ')';
    ctx.lineWidth = 2;
    for (let i=0;i<7;i++){
      const x = ROAD.x + 12 + ((i * 47 + (scroll*1.7) % 47) % (ROAD.w - 24));
      const y = ((i * 131 + scroll * 2.4) % (LH + 120)) - 60;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 26 + t*30); ctx.stroke();
    }
    ctx.restore();
  }
  drawCar(spr, player.x, player.y, player.tilt, 0);
}

// 히트박스 확인용 — window.__race.showHit(true) 로 켠다 (테스트/검증 전용)
function drawHitboxes(){
  ctx.save();
  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(92,255,158,0.95)';
  rr(ctx, player.x - PLAYER.w/2, player.y - PLAYER.h/2, PLAYER.w, PLAYER.h, CAR_R); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,90,80,0.95)';
  for (let i=0;i<MAX_CAR;i++){
    const c = cars[i];
    if (!c.on) continue;
    rr(ctx, c.x - c.w/2, c.y - c.h/2, c.w, c.h, carR(c)); ctx.stroke();
  }
  ctx.restore();
}

function drawParts(){
  for (let i=0;i<MAX_PART;i++){
    const p = parts[i];
    if (!p.on) continue;
    const a = p.life / p.max;
    ctx.fillStyle = (p.col.charAt(0) === 'r') ? (p.col + a.toFixed(2) + ')') : p.col;
    ctx.globalAlpha = (p.col.charAt(0) === 'r') ? 1 : a;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (0.4 + a*0.6), 0, 6.3); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

// 아슬아슬로 번 거리를 스친 자리에 띄운다
function drawPops(){
  if (!G || !G.pops.length) return;
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const q of G.pops){
    const a = Math.min(1, q.life / 22);
    ctx.globalAlpha = a;
    ctx.fillStyle = q.combo >= 5 ? '#ff9c7a' : '#ffe9a8';
    ctx.font = 'bold 13px Menlo, monospace';
    ctx.fillText('+' + Math.round(q.m) + 'm', q.x, q.y);
    if (q.combo > 1){
      ctx.font = 'bold 9px Menlo, monospace';
      ctx.fillStyle = 'rgba(255,233,168,0.8)';
      ctx.fillText(q.combo + '연속', q.x, q.y + 13);
    }
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function fmtTime(s){
  const m = Math.floor(s / 60), r = s - m*60;
  return (m > 0 ? (m + ':' + (r < 10 ? '0' : '') + r.toFixed(1)) : r.toFixed(1) + '초');
}
// 주행 거리 (내부 유닛 → m / km)
//  fine=true 면 km 도 소수 세 자리 = 1m 단위로 보여 준다.
//  2자리(10m 단위)로 끊으면 1km 를 넘는 순간 숫자가 10배 굵어져서,
//  하필 제일 빨리 달릴 때 계기판이 "느려진" 것처럼 보인다.
//  1m 단위로 두면 마지막 자리가 초속(m/s) 만큼 넘어가 속도가 그대로 눈에 보인다.
function fmtDist(u, fine){
  const m = u * M_PER_UNIT;
  if (m < 1000) return Math.round(m) + ' m';
  return (m / 1000).toFixed(fine ? 3 : 2) + ' km';
}

function drawHUD(){
  ctx.save();
  ctx.textBaseline = 'middle';

  // 상단 바
  ctx.fillStyle = 'rgba(10,13,16,0.82)';
  ctx.fillRect(0, 0, LW, 52);

  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.font = '9px Menlo, monospace';
  ctx.fillText('기록', 14, 15);
  ctx.fillStyle = '#ffffff'; ctx.font = 'bold 22px Menlo, monospace';
  ctx.fillText(fmtDist(scoreOf(G), true), 14, 34);

  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.font = '9px Menlo, monospace';
  ctx.fillText('추월', LW - 14, 15);
  ctx.fillStyle = '#5cff9e'; ctx.font = 'bold 22px Menlo, monospace';
  ctx.fillText(String(G.overtakes), LW - 14, 34);

  // 속도계
  ctx.textAlign = 'center';
  const kmh = Math.round(player.spd * KMH);
  ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.font = '9px Menlo, monospace';
  ctx.fillText('km/h', LW/2, 15);
  const t = (player.spd - SPD_BASE) / (SPD_MAX - SPD_BASE);
  ctx.fillStyle = t > 0.8 ? '#ff7a5c' : t > 0.5 ? '#ffd257' : '#9fd6ff';
  ctx.font = 'bold 20px Menlo, monospace';
  ctx.fillText(String(kmh), LW/2, 34);

  // 속도 게이지
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.fillRect(LW/2 - 44, 44, 88, 4);
  ctx.fillStyle = t > 0.8 ? '#ff7a5c' : t > 0.5 ? '#ffd257' : '#9fd6ff';
  ctx.fillRect(LW/2 - 44, 44, 88 * t, 4);

  // 시간 + 아슬아슬 (보조 지표)
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(255,255,255,0.40)'; ctx.font = '10px Menlo, monospace';
  // 기록이 어디서 왔는지 항상 보이게 — 보너스가 안 보이면 규칙이 없는 거나 같다.
  // 오른쪽 BEST 와 부딪히지 않게 이 줄은 짧게 유지하고, 아슬아슬은 아래 줄로 뺀다.
  ctx.fillText(fmtTime(sec()) + '  ·  주행 ' + fmtDist(G.dist, true), 14, 66);

  // 아슬아슬 줄 — 지금까지 번 보너스 / 속도 배율 / 콤보를 한 덩어리로
  const sm = spdMul();
  if (G.bonus > 0 || G.combo > 0 || sm > 1.05){
    const cx = 14; let cy = 82;
    ctx.font = 'bold 11px Menlo, monospace';
    let bx2 = cx;
    if (G.bonus > 0){
      ctx.fillStyle = '#ffe9a8';
      const t1 = '아슬 +' + fmtDist(G.bonus);
      ctx.fillText(t1, bx2, cy); bx2 += ctx.measureText(t1).width + 10;
    }
    if (sm > 1.05){
      ctx.fillStyle = sm > 1.9 ? '#ff9c7a' : 'rgba(255,210,87,0.9)';
      const t2 = '속도 x' + sm.toFixed(1);
      ctx.fillText(t2, bx2, cy); bx2 += ctx.measureText(t2).width + 10;
    }
    if (G.combo > 0){
      ctx.fillStyle = '#ffd257';
      ctx.fillText(G.combo + '연속 x' + comboMul().toFixed(1), bx2, cy);
      // 콤보 게이지 — 남은 시간이 줄어드는 게 보여야 이어 갈 마음이 든다
      const w = 120, pct = G.comboT / COMBO_HOLD;
      ctx.fillStyle = 'rgba(255,210,87,0.18)'; ctx.fillRect(cx, cy + 8, w, 3);
      ctx.fillStyle = 'rgba(255,210,87,0.9)';  ctx.fillRect(cx, cy + 8, w * pct, 3);
    }
  }
  // 최고 기록
  if (bestDist > 0){
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.font = '10px Menlo, monospace';
    ctx.fillText('BEST ' + fmtDist(bestDist), LW - 14, 66);
  }

  // 구간 배너 — 차량 위에 겹쳐도 읽히도록 어두운 알약 배경을 깐다
  if (G.banner > 0){
    const a = Math.min(1, G.banner / 20);
    const warn = G.bannerText.charAt(0) === '⚠';
    ctx.textAlign = 'center';
    ctx.globalAlpha = a;
    ctx.font = 'bold 16px Menlo, monospace';
    const tw = ctx.measureText(G.bannerText).width;
    const bw = tw + 34, bh = 30, bx = LW/2 - bw/2, by = 84;
    ctx.fillStyle = 'rgba(8,10,13,0.86)';
    rr(ctx, bx, by, bw, bh, 15); ctx.fill();
    ctx.strokeStyle = warn ? 'rgba(255,107,107,0.85)' : 'rgba(255,210,87,0.75)';
    ctx.lineWidth = 1.4;
    rr(ctx, bx, by, bw, bh, 15); ctx.stroke();
    ctx.fillStyle = warn ? '#ff8b8b' : '#ffd257';
    ctx.fillText(G.bannerText, LW/2, by + bh/2 + 1);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

/* ═══════════════════════════════════════════════════
   상태 전환 + 루프
   ═══════════════════════════════════════════════════ */
function handleInput(){
  // 이름 입력창 / 공용 랭킹 화면이 떠 있으면 게임은 입력을 받지 않는다
  if (nickOpen || (window.ArcadeRankUI && window.ArcadeRankUI.isOpen())){
    Input.consumeTap(); Input.consumeTapPos(); Input.pressed = {}; return;
  }

  if (Input.wasPressed('MUTE')){ Sound.toggleMute(); Sound.ui(); }

  if (state === S.TITLE){
    const id = uiHit(Input.consumeTapPos());
    Input.consumeTap();
    if (id === 'play' || Input.wasPressed('OK')){
      Sound.init(); Sound.resume(); Sound.ui();
      myRankIdx = -1;
      newRun(); state = S.PLAY;
      // 런 토큰은 판이 진짜로 시작하는 이 순간에 받는다 (타이틀 화면이 아니라).
      // 서버가 경과 시간을 토큰 발급 시각부터 재기 때문에, 미리 받아 두면 시간이 부풀어
      // 위조 여유가 생긴다. 실패해도 조용히 넘어가고 게임은 그대로 돈다.
      Rank.start('race');
    } else if (id === 'rank'){
      Sound.ui(); if (window.ArcadeRankUI) window.ArcadeRankUI.open();
    } else if (id === 'mine'){
      ranks = loadRanks(); Sound.ui(); state = S.RANK;
    } else if (id === 'home'){
      Sound.ui(); goHome();
    }
    return;
  }
  if (state === S.RANK){
    const id = uiHit(Input.consumeTapPos());
    Input.consumeTap();
    if (id === 'close' || Input.wasPressed('PAUSE') || Input.wasPressed('OK')){ Sound.ui(); state = S.TITLE; }
    else if (id === 'name'){ Sound.ui(); openNick(); }
    else if (id === 'home'){ Sound.ui(); goHome(); }
    return;
  }
  if (state === S.PLAY){
    if (Input.wasPressed('PAUSE')){ state = S.PAUSE; Sound.setEngine(player.spd, false); Sound.ui(); }
    Input.consumeTap(); Input.consumeTapPos();
    return;
  }
  if (state === S.PAUSE){
    Input.consumeTapPos();
    if (Input.wasPressed('PAUSE') || Input.consumeTap()){ state = S.PLAY; Sound.ui(); }
    return;
  }
  if (state === S.OVER){
    if (overTick > 0) overTick--;
    // 충돌 장면만 잠깐 보여주고 결과/버튼 화면으로 넘어간다.
    // 여기서는 어떤 입력도 새 게임을 시작하지 않는다 — 반드시 '다시 시도' 버튼을 눌러야 한다.
    Input.consumeTap(); Input.consumeTapPos();
    if (overTick <= 0) state = S.TITLE;
    return;
  }
}

const STEP = 1000 / 60;
let acc = 0, last = performance.now();
let fpsSamples = [];

function loop(now){
  const dt = now - last; last = now;
  fpsSamples.push(1000 / Math.max(1, dt));
  if (fpsSamples.length > 60) fpsSamples.shift();

  acc += Math.min(dt, 100);          // 탭 전환 후 몰아서 돌지 않게 상한
  let guard = 0;
  while (acc >= STEP && guard++ < 5){
    frame++;
    handleInput();
    if (state === S.PLAY) updatePlay();
    else { updateParts(); if (shake > 0) shake *= 0.88; if (flash > 0) flash *= 0.86; }
    acc -= STEP;
  }
  render();
  requestAnimationFrame(loop);
}

newRun();
state = S.TITLE;
requestAnimationFrame(loop);

/* ═══════════════════════════════════════════════════
   자동 테스트용 훅
   ═══════════════════════════════════════════════════ */
window.__input = Input;          // 자동 테스트가 키 입력을 흉내내는 통로
/* 훅은 지우지 않는다 — 자동 테스트가 전부 이 통로로 게임을 몬다.
   대신 "상태를 바꾸거나 살아 있는 내부 객체를 넘겨주는" 훅은 전부 taint() 를 지난다.
   반대로 숫자 하나만 돌려주는 읽기 전용 게터는 표식을 세우지 않는다 —
   특히 state 는 공용 상단 바(arcade-bar)가 0.35초마다 읽으므로 여기 넣으면
   아무것도 안 해도 모든 판이 오염된다.
   consts / gas 처럼 원래 내부 객체를 그대로 넘기던 것은 복사본으로 바꿨다.
   훅을 안 거치고 __race.consts.PLAYER.w = 0 로 판정을 없앨 수 있었기 때문이다. */
window.__race = {
  get state(){ return state; },                       // 상단 바가 폴링한다 — 표식 없음
  get G(){ taint(); return G; },
  get player(){ taint(); return player; },
  get cars(){ taint(); return cars; },
  get liveCars(){ taint(); return liveCars(); },
  get sec(){ return G ? sec() : 0; },
  get fps(){ return fpsSamples.length ? fpsSamples.reduce((a,b)=>a+b,0)/fpsSamples.length : 0; },
  get diff(){ taint(); return G ? diff() : null; },   // 난이도 객체는 살아 있는 참조다
  // 아슬아슬 보너스 검증용
  get score(){ return G ? scoreOf(G) : 0; },
  get bonus(){ return G ? G.bonus : 0; },
  get combo(){ return G ? G.combo : 0; },
  get nearMiss(){ return G ? G.nearMiss : 0; },
  get spdMul(){ return G ? spdMul() : 1; },
  get comboMul(){ return G ? comboMul() : 1; },
  get nearConsts(){ return { NEAR_BASE, NEAR_SPD_SCALE, NEAR_COMBO_MAX, NEAR_COMBO_STEP, COMBO_HOLD, M_PER_UNIT }; },
  // 아슬아슬을 인위적으로 한 번 발생시킨다 (보너스 계산 검증용)
  forceNear(){ if (!G) return null; taint(); const before = G.bonus;
    G.combo = (G.comboT > 0) ? G.combo + 1 : 1; G.comboT = COMBO_HOLD;
    if (G.combo > G.comboBest) G.comboBest = G.combo;
    const gain = NEAR_BASE * spdMul() * comboMul();
    G.bonus += gain; G.nearMiss++;
    return { gain, gainM: gain * M_PER_UNIT, combo: G.combo, spdMul: spdMul(), comboMul: comboMul(), before }; },
  setSpd(v){ taint(); player.spd = Math.max(SPD_BASE, Math.min(SPD_MAX, v)); },
  fmt(u, fine){ return fmtDist(u, fine); },
  get best(){ return bestDist; },
  get lastRun(){ return lastRun; },
  // GAS 는 내부 객체다 — 복사본을 준다 (버튼 판정 영역을 콘솔에서 못 늘리게)
  get gas(){ return { on: Input.gas || Input.up, box: Object.assign({}, GAS) }; },
  // 겹친 차량 쌍 수 — 관통 검증용. 0 이어야 한다. (숫자 스냅샷이라 표식 없음)
  get overlaps(){
    const out = [];
    for (let i=0;i<MAX_CAR;i++){
      const a = cars[i]; if (!a.on) continue;
      for (let j=i+1;j<MAX_CAR;j++){
        const b = cars[j]; if (!b.on) continue;
        if (Math.abs(a.x-b.x) < (a.w+b.w)*0.5 - 2 && Math.abs(a.y-b.y) < (a.h+b.h)*0.5 - 2)
          out.push({ a:a.kind, b:b.kind, dx:Math.round(Math.abs(a.x-b.x)), dy:Math.round(Math.abs(a.y-b.y)) });
      }
    }
    return out;
  },
  get kinds(){ const o = {npc:0,truck:0,onc:0,changing:0};
    for (let i=0;i<MAX_CAR;i++){ const c = cars[i]; if (!c.on) continue;
      o[c.kind]++; if (c.changing || c.pendingLane >= 0) o.changing++; }
    return o; },
  // 자동 테스트도 같은 시작 경로를 타야 제출 경로가 검증된다.
  // newRun() 이 표식을 지우므로 그 "뒤에" 다시 세운다 — 훅으로 시작한 판은 늘 오염이다.
  start(){ Sound.init(); newRun(); state = 'PLAY'; Rank.start('race'); taint(); },
  setTime(s){ taint(); if (G) G.time = Math.round(s * 60); },
  invincible(v){ taint(); dbgInv = !!v; },
  pin(x){ taint(); dbgPin = x; },           // 플레이어를 x 에 고정 (안전지대 검사용)
  showHit(v){ taint(); dbgHit = !!v; },     // 히트박스 외곽선 표시
  collideOnce(){ taint(); collide(); },     // 판정 경계 측정용
  get hitRR(){ return hitRR; },
  // 스프라이트 실제 크기 vs 판정 크기 — 싱크 검증용
  hitInfo(){
    return {
      player: { spr: [SPR.player.w - 8, SPR.player.h - 8], hit: [PLAYER.w, PLAYER.h], r: CAR_R },
      npc:    { spr: [SPR.npc[0].w - 8, SPR.npc[0].h - 8], hit: [32, 56], r: CAR_R },
      truck:  { spr: [SPR.truck[0].w - 8, SPR.truck[0].h - 8], hit: [40, 88], r: TRUCK_R },
    };
  },
  laneEdges(){ const o = []; for (let i=1;i<LANES;i++) o.push(ROAD.x + LANE_W * i); return o; },
  get carOffsets(){ const o = []; for (let i=0;i<MAX_CAR;i++){ const c = cars[i];
    if (c.on) o.push(Math.round(c.x - laneX(c.lane))); } return o; },
  kill(){ taint(); if (G && state === 'PLAY') crash(cars[0]); },
  // 회피 AI 가 쓸 정보: 앞쪽 위험 지도 (숫자 스냅샷)
  threats(){
    const out = [];
    for (let i=0;i<MAX_CAR;i++){
      const c = cars[i];
      if (!c.on) continue;
      const rel = player.spd - c.spd;               // 다가오는 속도
      if (c.y > player.y + 40) continue;
      out.push({ x: c.x, y: c.y, w: c.w, h: c.h, rel, kind: c.kind,
                 eta: rel > 0.01 ? (player.y - c.y) / rel : 9999 });
    }
    return out;
  },
  // 랭킹 / 이름 (자동 테스트용)
  get ranks(){ taint(); return ranks; },              // 살아 있는 배열이다
  get myRank(){ return myRankIdx; },
  get nick(){ return nick; },
  get nickOpen(){ return nickOpen; },
  get buttons(){ return uiBtns.map(b => ({ id: b.id, x: Math.round(b.x + b.w/2), y: Math.round(b.y + b.h/2) })); },
  tap(id){ taint(); const b = uiBtns.find(b => b.id === id); if (!b) return false;
           Input.tapPos = { x: b.x + b.w/2, y: b.y + b.h/2 }; Input.tapAnywhere = true; return true; },
  go(s){ taint(); state = s; },
  clearRanks(){ taint(); try { localStorage.removeItem('overtake-ranks-v2'); } catch(e){} ranks = []; myRankIdx = -1; },
  // 값만 담은 새 객체. ROAD / PLAYER 는 얕은 복사로 끊어 준다.
  get consts(){ return { LW, LH, ROAD: Object.assign({}, ROAD),
            LANES, LANE_W, SPD_BASE, SPD_MAX, PLAYER: Object.assign({}, PLAYER),
            T_LANECHANGE, T_WALL, T_ONCOMING }; },
};
// 훅 묶음 자체를 얼려서 delete / 재정의로 게터를 걷어내지 못하게 한다.
// (게터를 갈아치워도 표식은 클로저에 있어 안 지워지지만, 굳이 길을 열어 둘 이유가 없다)
Object.freeze(window.__race);
try { Object.defineProperty(window, '__race', { value: window.__race, writable: false, configurable: false }); } catch(e){}
})();
</script>

<script>
/* arcade-rankui — 세 게임과 메인이 함께 쓰는 랭킹 화면.
   서버가 3게임을 한 번에 주므로(/plane/api/rank) 요청 1회로 전부 채운다.
   이름은 사람이 넣는 값이다 — 절대 innerHTML 로 그리지 않는다(textContent 만).
   세 게임이 같은 출처라 여기서 XSS 가 터지면 전부 털린다. */
(function(){
  'use strict';
  if (window.ArcadeRankUI) return;
  var API = '/plane/api/rank';
  var wrap = document.getElementById('arkWrap');
  if (!wrap) return;
  var tabs = document.getElementById('arkTabs'), list = document.getElementById('arkList');
  var mine = document.getElementById('arkMine'), nm = document.getElementById('arkNm');
  var ok = document.getElementById('arkOk'), open = false, data = null, cur = null;

  function ls(k, v){
    try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }
    catch(e){ return null; }
  }
  // 이 게임이 뭔지 경로로 짐작해서 그 탭을 먼저 연다
  var SELF = (function(){
    try {
      var p = location.pathname;
      if (p.indexOf('/race') === 0) return 'race';
      if (p.indexOf('/plane') === 0) return 'plane';
      if (p.indexOf('/jumprope') === 0) return 'jumprope';
    } catch(e){}
    return null;
  })();

  function row(e, isMe){
    var li = document.createElement('li');
    if (isMe) li.className = 'me';
    var a = document.createElement('span'); a.className = 'rk'; a.textContent = e.r;
    var w = document.createElement('span'); w.className = 'who';
    var n = document.createElement('span'); n.className = 'nm'; n.textContent = e.name;
    w.appendChild(n);
    if (e.sub){ var s = document.createElement('span'); s.className = 'sb'; s.textContent = e.sub; w.appendChild(s); }
    var c = document.createElement('span'); c.className = 'sc'; c.textContent = e.disp;
    li.appendChild(a); li.appendChild(w); li.appendChild(c);
    return li;
  }
  function draw(){
    tabs.textContent = ''; list.textContent = ''; mine.textContent = '';
    if (!data){
      var li0 = document.createElement('li'); li0.className = 'empty';
      li0.textContent = '불러오는 중…'; list.appendChild(li0); return;
    }
    if (data.err){
      var li1 = document.createElement('li'); li1.className = 'empty';
      li1.textContent = '랭킹 서버에 연결하지 못했습니다'; list.appendChild(li1); return;
    }
    var keys = Object.keys(data.games);
    keys.forEach(function(k){
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = data.games[k].label || k;
      if (k === cur) b.className = 'sel';
      b.addEventListener('click', function(){ cur = k; draw(); });
      tabs.appendChild(b);
    });
    var g = data.games[cur];
    if (!g || !g.top || !g.top.length){
      var li2 = document.createElement('li'); li2.className = 'empty';
      li2.textContent = '아직 기록이 없습니다 — 1등 하세요';
      list.appendChild(li2); return;
    }
    // v2: 응답 항목에 uid 가 없다. 게임 구간마다 오는 meTag(내 지문)와 각 행의 me 를 비교한다.
    // meTag 는 내 기록이 그 게임 목록에 있을 때만 온다 — 없으면 강조할 행도 없다.
    for (var i = 0; i < g.top.length; i++)
      list.appendChild(row(g.top[i], !!g.meTag && g.top[i].me === g.meTag));
    if (g.me && g.me.rank > g.top.length) mine.textContent = '내 기록 ' + g.me.rank + '위 · ' + g.me.disp;
  }
  function load(){
    data = null; draw();
    // file:// 로 직접 열었으면 부를 서버가 없다 (README 가 안내하는 오프라인 플레이)
    try { if (location.protocol === 'file:'){ data = { err: 1 }; draw(); return; } } catch(e){}
    // uid 는 볼 때마다 새로 읽는다. v2 에서는 서버가 '판을 시작하는 순간' 에 발급하므로,
    // 페이지가 뜰 때 한 번만 읽어 두면 첫 판을 끝내고 열었을 때 내 기록을 못 찾는다.
    // (지어내면 안 된다 — 서명 없는 uid 는 서버가 그냥 버린다.)
    var uid = ls('arcade-uid') || '';
    // uid 가 없으면 파라미터째로 뺀다 — 서버는 서명된 uid 만 받고, 빈 값은 그냥 버려진다.
    fetch(API + '?n=10' + (uid ? '&uid=' + encodeURIComponent(uid) : ''), { cache: 'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d || !d.ok) throw new Error('bad');
        data = d;
        if (!cur || !data.games[cur]) cur = (SELF && data.games[SELF]) ? SELF : Object.keys(data.games)[0];
        draw();
      })
      .catch(function(){ data = { err: 1 }; draw(); });
  }
  function show(){
    if (open) return;
    open = true;
    nm.value = ls('arcade-name') || ls('overtake-name') || '';
    wrap.classList.add('on');
    load();
  }
  function hide(){
    if (!open) return;
    open = false;
    wrap.classList.remove('on');
    try { nm.blur(); } catch(e){}
  }
  function save(){
    var v = (nm.value || '').trim().slice(0, 8);
    ls('arcade-name', v); ls('overtake-name', v);
    ok.textContent = '저장됨';
    setTimeout(function(){ ok.textContent = ''; }, 1400);
  }
  document.getElementById('arkX').addEventListener('click', hide);
  document.getElementById('arkNb').addEventListener('click', save);
  nm.addEventListener('keydown', function(e){
    e.stopPropagation();                       // 게임 전역 키 핸들러로 새지 않게
    if (e.key === 'Enter'){ e.preventDefault(); save(); nm.blur(); }
  });
  nm.addEventListener('keyup', function(e){ e.stopPropagation(); });
  wrap.addEventListener('click', function(e){ if (e.target === wrap) hide(); });
  // 열려 있는 동안 키가 게임으로 새지 않게 (캡처 단계에서 먼저 잡는다)
  ['keydown','keyup','keypress'].forEach(function(t){
    window.addEventListener(t, function(e){
      if (!open) return;
      if (e.key === 'Escape'){ hide(); e.preventDefault(); }
      e.stopPropagation();
    }, true);
  });
  // 캔버스 게임이 window 에 걸어 둔 핸들러로 이벤트가 새지 않게 막는다.
  // 반드시 "버블 단계" 여야 한다 — 캡처로 걸면 오버레이 안의 버튼(탭·닫기·저장)에
  // 이벤트가 닿기도 전에 삼켜서 아무것도 안 눌린다. (실제로 그렇게 만들었다가 잡았다)
  ['touchstart','touchmove','touchend','mousedown','mouseup','click','pointerdown'].forEach(function(t){
    wrap.addEventListener(t, function(e){ e.stopPropagation(); }, false);
  });

  window.ArcadeRankUI = { open: show, close: hide, isOpen: function(){ return open; }, reload: load };
})();
</script>

<script>
/* arcade-bar — 게임 목록으로 돌아가기 + 랭킹 열기.
   캔버스 화면마다 버튼을 그리는 대신 DOM 으로 한 번만 둔다 —
   어느 화면에 있든 같은 자리에 있고, 세 게임이 똑같이 동작한다.
   플레이 중에는 숨긴다. 안 그러면 조작하다 실수로 눌러 게임이 날아간다. */
(function(){
  'use strict';
  var bar = document.getElementById('arkBar');
  if (!bar) return;
  try { if (location.protocol === 'file:'){ bar.remove(); return; } } catch(e){ return; }

  document.getElementById('arkRank').addEventListener('click', function(){
    if (window.ArcadeRankUI) window.ArcadeRankUI.open();
  });

  // 플레이 중인가? 게임마다 알아내는 방법이 다르다.
  var TITLE_IDS = ['titleScreen', 'title', 'menuScreen', 'startScreen'];
  function playing(){
    try {
      if (window.__race && window.__race.state) return window.__race.state === 'PLAY';
      // 탄막 게임은 __game.state 로 노출한다 (screen 이 아니다). PAUSE 는 바를 보여 준다 —
      // 멈춰 있을 때 목록으로 나갈 길이 있어야 한다.
      var gs = window.__game && (window.__game.state || window.__game.screen);
      if (gs) return String(gs) === 'PLAY';
    } catch(e){}
    // DOM 기반 게임(줄넘기): 타이틀 화면이 보이면 플레이 중이 아니다
    var found = false;
    for (var i = 0; i < TITLE_IDS.length; i++){
      var t = document.getElementById(TITLE_IDS[i]);
      if (!t) continue;
      found = true;
      try { if (getComputedStyle(t).display !== 'none' && t.offsetParent !== null) return false; }
      catch(e){}
    }
    return found ? true : false;    // 판단 근거가 없으면 '플레이 중 아님' 으로 본다 (보여 준다)
  }
  function tick(){
    var hideIt = playing() || (window.ArcadeRankUI && window.ArcadeRankUI.isOpen());
    bar.classList.toggle('on', !hideIt);
  }
  tick();
  setInterval(tick, 350);
})();
</script>
</body>
</html>
