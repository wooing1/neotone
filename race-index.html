<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>쌩쌩 추월</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#0a0d10;overflow:hidden;
    font-family:'Menlo','Consolas',monospace;-webkit-tap-highlight-color:transparent;
    touch-action:none;overscroll-behavior:none}
  #wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
  canvas{display:block;image-rendering:auto}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════
   쌩쌩 추월 (OVERTAKE)
   톱뷰 · 자유 좌우 이동 · 가속만 (브레이크 없음) · 생존 시간 경쟁

   설계 메모
   - 논리 해상도 고정(400×700) + 레터박스. 어느 화면에서도 판정이 같다.
   - 고정 타임스텝 60fps + 누산기. 프레임이 밀려도 게임 속도는 일정하다.
   - 좌표계는 "도로 좌표"다. 스크롤은 내 속도만큼 흐르고,
     상대 차량은 (내 속도 - 상대 속도)만큼 화면에서 내려간다.
     브레이크가 없으니 가속은 되돌릴 수 없는 선택이다 — 밟는 만큼 추월이 늘지만
     앞 차가 닫히는 속도도 같이 커진다. 위험은 핸들로만 푼다.
   - 스프라이트는 전부 코드로 굽는다(오프스크린 캔버스). 외부 에셋 0개.
   - 온라인을 나중에 붙일 수 있게, "내 차"와 "남의 차"를 같은 draw 함수로 그리고
     월드 시뮬레이션을 updateWorld() 한 곳에 모아 두었다.
   ═══════════════════════════════════════════════════════════════ */

const LW = 400, LH = 700;                  // 논리 해상도
const ROAD = { x: 44, w: 312 };            // 도로 영역 (양옆은 가드레일/풀)
const LANES = 4;
const LANE_W = ROAD.w / LANES;             // 78
const laneX = i => ROAD.x + LANE_W * (i + 0.5);

// ── 속도 (도로 단위/프레임). 화면 픽셀과 1:1 로 쓴다.
//    브레이크는 없다. 가속 페달만 있고, 떼면 기본 속도로 서서히 돌아온다.
//    그래서 "속도를 죽여 시간을 버는" 선택지가 없고, 위험은 핸들로만 푼다.
//    대신 가속은 순수한 욕심 — 추월이 늘지만 닫히는 속도도 같이 커진다.
const SPD_BASE = 7.0, SPD_MAX = 15.0, SPD_START = SPD_BASE;
const SPD_MIN = SPD_BASE;                  // 이 아래로는 내려가지 않는다
const ACCEL = 0.090, COAST = 0.040;        // COAST = 페달 뗐을 때 기본 속도로 복귀
const KMH = 16;                            // 표시용 환산 (기본 112 / 최고 240 km/h)

const PLAYER = { w: 32, h: 56, y: LH - 150 };
const HIT_INSET_X = 3, HIT_INSET_Y = 5;    // 판정은 스프라이트보다 살짝 안쪽

const NEAR_MISS_X = 26;                    // 이 안으로 스치면 아슬아슬 보너스

// 화면 위 가속 버튼 (▲). 모바일에서 끌면서 가속까지 하기 어려워 버튼을 따로 둔다.
const GAS = { x: LW - 62, y: LH - 78, r: 40 };
function inGas(x, y){ const dx = x - GAS.x, dy = y - GAS.y; return dx*dx + dy*dy < (GAS.r + 12) * (GAS.r + 12); }

/* ── 난이도 일정 (초 단위) ─────────────────────────────────
   요청하신 순서: 교통량·상대속도 → 앞 차 차선 변경 → 역주행
   "짧고 빠른 이동"을 만드는 장치로 밀집 편성(차량 벽)을 함께 넣었다. */
const T_LANECHANGE = 7;     // 차선 변경 NPC 등장
const T_WALL       = 14;    // 차량 벽(틈 하나) 편성 등장
const T_ONCOMING   = 22;    // 역주행 등장

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d', { alpha: false });

let renderScale = 1, drawScale = 1;
function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const availW = window.innerWidth, availH = window.innerHeight;
  const s = Math.min(availW / LW, availH / LH);
  cv.style.width = (LW * s) + 'px';
  cv.style.height = (LH * s) + 'px';
  cv.width = Math.round(LW * s * dpr);
  cv.height = Math.round(LH * s * dpr);
  renderScale = s * dpr;
  ctx.setTransform(renderScale, 0, 0, renderScale, 0, 0);
  ctx.imageSmoothingEnabled = true;
}
window.addEventListener('resize', resize);
resize();

/* ═══════════════════════════════════════════════════
   입력 — PC 키보드 + 모바일 드래그
   ═══════════════════════════════════════════════════ */
const Input = {
  left: false, right: false, up: false,
  touch: null,           // 조향용 {x, y, baseY}
  gas: false,            // ▲ 버튼을 누르고 있는지
  pressed: {},           // 한 번만 먹는 키
  tapAnywhere: false,
  wasPressed(k){ if (this.pressed[k]){ this.pressed[k] = false; return true; } return false; },
  consumeTap(){ const t = this.tapAnywhere; this.tapAnywhere = false; return t; },
};
// id → {x, y, baseY, gas}
const touches = new Map();
function syncTouches(){
  let steer = null, gas = false;
  touches.forEach(t => { if (t.gas) gas = true; else steer = t; });
  Input.touch = steer;
  Input.gas = gas;
}
const KEYMAP = {
  ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right',
  ArrowUp:'up', KeyW:'up',        // 브레이크 없음 — 아래 방향키는 쓰지 않는다
};
addEventListener('keydown', e => {
  const k = KEYMAP[e.code];
  if (k){ Input[k] = true; e.preventDefault(); }
  if (e.code === 'KeyR') Input.pressed.RETRY = true;
  if (e.code === 'KeyM') Input.pressed.MUTE = true;
  if (e.code === 'Space' || e.code === 'Enter'){ Input.pressed.OK = true; Input.tapAnywhere = true; e.preventDefault(); }
  if (e.code === 'Escape') Input.pressed.PAUSE = true;
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) Input[k] = false; });

// 화면을 끌면 손가락 x 로 차가 따라오고, 위/아래로 끌면 가속/브레이크
function toLogical(cx, cy){
  const r = cv.getBoundingClientRect();
  return { x: (cx - r.left) / r.width * LW, y: (cy - r.top) / r.height * LH };
}
function onDown(id, cx, cy){
  const p = toLogical(cx, cy);
  // 플레이 중에 ▲ 버튼 위를 누르면 그 손가락은 가속 전용이 된다
  const isGas = (state === S.PLAY) && inGas(p.x, p.y);
  touches.set(id, { x: p.x, y: p.y, baseY: p.y, gas: isGas });
  syncTouches();
  Input.tapAnywhere = true;
}
function onMove(id, cx, cy){
  const t = touches.get(id);
  if (!t) return;
  const p = toLogical(cx, cy);
  t.x = p.x; t.y = p.y;
  // 가속 손가락은 버튼에서 벗어나면 가속을 놓는다
  if (t.gas && !inGas(p.x, p.y)) t.gas = false;
  syncTouches();
}
function onUp(id){ touches.delete(id); syncTouches(); }

cv.addEventListener('touchstart', e => { e.preventDefault();
  for (const t of e.changedTouches) onDown(t.identifier, t.clientX, t.clientY); }, {passive:false});
cv.addEventListener('touchmove',  e => { e.preventDefault();
  for (const t of e.changedTouches) onMove(t.identifier, t.clientX, t.clientY); }, {passive:false});
cv.addEventListener('touchend',   e => { e.preventDefault();
  for (const t of e.changedTouches) onUp(t.identifier); }, {passive:false});
cv.addEventListener('touchcancel',e => { e.preventDefault();
  for (const t of e.changedTouches) onUp(t.identifier); }, {passive:false});
cv.addEventListener('mousedown',  e => onDown('m', e.clientX, e.clientY));
addEventListener('mousemove',     e => onMove('m', e.clientX, e.clientY));
addEventListener('mouseup',       () => onUp('m'));

/* ═══════════════════════════════════════════════════
   사운드 — WebAudio 합성 (외부 파일 0개)
   엔진음은 속도에 따라 음정이 올라간다. 이게 있으면 속도 체감이 확 다르다.
   ═══════════════════════════════════════════════════ */
const Sound = {
  ac: null, muted: false, engine: null, engGain: null, engFilter: null,
  init(){
    if (this.ac) return;
    try { this.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return; }
    const ac = this.ac;
    this.master = ac.createGain(); this.master.gain.value = 0.5; this.master.connect(ac.destination);
    // 엔진: 톱니 + 로우패스. 게임 중에만 소리를 키운다.
    this.engine = ac.createOscillator(); this.engine.type = 'sawtooth';
    this.engFilter = ac.createBiquadFilter(); this.engFilter.type = 'lowpass'; this.engFilter.frequency.value = 420;
    this.engGain = ac.createGain(); this.engGain.gain.value = 0;
    this.engine.connect(this.engFilter); this.engFilter.connect(this.engGain); this.engGain.connect(this.master);
    this.engine.frequency.value = 60;
    this.engine.start();
  },
  resume(){ if (this.ac && this.ac.state === 'suspended') this.ac.resume(); },
  setEngine(spd, on){
    if (!this.ac || this.muted) { if (this.engGain) this.engGain.gain.value = 0; return; }
    const t = (spd - SPD_BASE) / (SPD_MAX - SPD_BASE);
    this.engine.frequency.setTargetAtTime(52 + t * 78, this.ac.currentTime, 0.08);
    this.engFilter.frequency.setTargetAtTime(320 + t * 900, this.ac.currentTime, 0.1);
    this.engGain.gain.setTargetAtTime(on ? 0.085 : 0, this.ac.currentTime, 0.12);
  },
  blip(freq, dur, type, vol){
    if (!this.ac || this.muted) return;
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type || 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.16, this.ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, this.ac.currentTime + dur);
    o.connect(g); g.connect(this.master); o.start(); o.stop(this.ac.currentTime + dur);
  },
  noise(dur, vol, hp){
    if (!this.ac || this.muted) return;
    const n = Math.floor(this.ac.sampleRate * dur);
    const buf = this.ac.createBuffer(1, n, this.ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
    const src = this.ac.createBufferSource(); src.buffer = buf;
    const f = this.ac.createBiquadFilter(); f.type = hp ? 'highpass' : 'lowpass';
    f.frequency.value = hp ? 1400 : 500;
    const g = this.ac.createGain(); g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(this.master); src.start();
  },
  overtake(){ this.blip(760, 0.06, 'square', 0.10); },
  nearMiss(){ this.noise(0.22, 0.20, true); },
  crash(){ this.noise(0.5, 0.5, false); this.blip(70, 0.45, 'sawtooth', 0.3); },
  ui(){ this.blip(520, 0.05, 'triangle', 0.12); },
  best(){ this.blip(880, 0.09, 'triangle', 0.16); setTimeout(()=>this.blip(1170, 0.12, 'triangle', 0.16), 90); },
  toggleMute(){ this.muted = !this.muted; if (this.muted && this.engGain) this.engGain.gain.value = 0; },
  isMuted(){ return this.muted; },
};

/* ═══════════════════════════════════════════════════
   스프라이트 굽기 — 전부 코드로 그린다
   ═══════════════════════════════════════════════════ */
function bake(w, h, fn){
  const c = document.createElement('canvas');
  const s = 2;                       // 2배로 굽고 축소해서 그린다 (계단 완화)
  c.width = w * s; c.height = h * s;
  const g = c.getContext('2d');
  g.scale(s, s);
  fn(g, w, h);
  return { canvas: c, w, h };
}

// 톱뷰 자동차. 앞이 위를 향한다.
function bakeCar(body, roof, opt){
  opt = opt || {};
  const w = opt.w || 32, h = opt.h || 56;
  return bake(w + 8, h + 8, (g) => {
    const x = 4, y = 4;
    // 그림자
    g.fillStyle = 'rgba(0,0,0,0.35)';
    rr(g, x+1, y+3, w, h, 7); g.fill();
    // 차체
    const grad = g.createLinearGradient(x, 0, x + w, 0);
    grad.addColorStop(0, shade(body, -0.28));
    grad.addColorStop(0.35, body);
    grad.addColorStop(0.62, shade(body, 0.14));
    grad.addColorStop(1, shade(body, -0.34));
    g.fillStyle = grad;
    rr(g, x, y, w, h, 7); g.fill();
    // 바퀴 (차체 밖으로 살짝)
    g.fillStyle = '#14161a';
    const ww = 4, wh = 11;
    g.fillRect(x - 1.5, y + h*0.16, ww, wh);
    g.fillRect(x + w - 2.5, y + h*0.16, ww, wh);
    g.fillRect(x - 1.5, y + h*0.70, ww, wh);
    g.fillRect(x + w - 2.5, y + h*0.70, ww, wh);
    // 앞유리 / 뒷유리
    g.fillStyle = 'rgba(150,205,235,0.92)';
    rr(g, x + w*0.16, y + h*0.14, w*0.68, h*0.16, 3); g.fill();
    g.fillStyle = 'rgba(120,175,205,0.75)';
    rr(g, x + w*0.18, y + h*0.66, w*0.64, h*0.14, 3); g.fill();
    // 루프
    g.fillStyle = roof || shade(body, 0.10);
    rr(g, x + w*0.14, y + h*0.33, w*0.72, h*0.30, 4); g.fill();
    // 하이라이트 한 줄 — 금속 느낌
    g.strokeStyle = 'rgba(255,255,255,0.30)'; g.lineWidth = 1;
    g.beginPath(); g.moveTo(x + w*0.30, y + 3); g.lineTo(x + w*0.30, y + h - 3); g.stroke();

    if (opt.headlights){          // 역주행 차 — 헤드라이트가 나를 향한다
      g.fillStyle = 'rgba(255,246,190,0.95)';
      rr(g, x + w*0.10, y + h - 7, w*0.22, 4, 2); g.fill();
      rr(g, x + w*0.68, y + h - 7, w*0.22, 4, 2); g.fill();
    } else {                      // 같은 방향 — 미등이 나를 향한다
      g.fillStyle = 'rgba(255,90,80,0.9)';
      rr(g, x + w*0.10, y + h - 7, w*0.22, 4, 2); g.fill();
      rr(g, x + w*0.68, y + h - 7, w*0.22, 4, 2); g.fill();
    }
  });
}

function bakeTruck(body){
  const w = 40, h = 88;
  return bake(w + 8, h + 8, (g) => {
    const x = 4, y = 4;
    g.fillStyle = 'rgba(0,0,0,0.35)'; rr(g, x+1, y+3, w, h, 5); g.fill();
    // 적재함
    const grad = g.createLinearGradient(x, 0, x + w, 0);
    grad.addColorStop(0, shade(body, -0.3)); grad.addColorStop(0.5, body); grad.addColorStop(1, shade(body, -0.36));
    g.fillStyle = grad; rr(g, x, y + h*0.22, w, h*0.78, 4); g.fill();
    // 캡
    g.fillStyle = shade(body, 0.22); rr(g, x + 2, y, w - 4, h*0.26, 5); g.fill();
    g.fillStyle = 'rgba(150,205,235,0.9)'; rr(g, x + w*0.16, y + 3, w*0.68, h*0.10, 2); g.fill();
    // 컨테이너 리브
    g.strokeStyle = 'rgba(0,0,0,0.22)'; g.lineWidth = 1;
    for (let i=1;i<6;i++){ const yy = y + h*0.22 + (h*0.78) * (i/6); g.beginPath(); g.moveTo(x+2, yy); g.lineTo(x+w-2, yy); g.stroke(); }
    // 바퀴
    g.fillStyle = '#14161a';
    g.fillRect(x - 1.5, y + h*0.24, 4, 12); g.fillRect(x + w - 2.5, y + h*0.24, 4, 12);
    g.fillRect(x - 1.5, y + h*0.62, 4, 16); g.fillRect(x + w - 2.5, y + h*0.62, 4, 16);
    g.fillStyle = 'rgba(255,90,80,0.9)';
    rr(g, x + w*0.08, y + h - 6, w*0.2, 4, 2); g.fill();
    rr(g, x + w*0.72, y + h - 6, w*0.2, 4, 2); g.fill();
  });
}

function rr(g, x, y, w, h, r){
  g.beginPath();
  g.moveTo(x+r, y);
  g.arcTo(x+w, y,   x+w, y+h, r);
  g.arcTo(x+w, y+h, x,   y+h, r);
  g.arcTo(x,   y+h, x,   y,   r);
  g.arcTo(x,   y,   x+w, y,   r);
  g.closePath();
}
function shade(hex, amt){
  const n = parseInt(hex.slice(1), 16);
  let r = (n>>16)&255, g2 = (n>>8)&255, b = n&255;
  if (amt > 0){ r += (255-r)*amt; g2 += (255-g2)*amt; b += (255-b)*amt; }
  else { r *= (1+amt); g2 *= (1+amt); b *= (1+amt); }
  return 'rgb(' + (r|0) + ',' + (g2|0) + ',' + (b|0) + ')';
}

const SPR = {};
function bakeAll(){
  SPR.player   = bakeCar('#ff5c3a', '#d8452a');
  SPR.playerHit= bakeCar('#ffd0c0', '#ffb59e');
  SPR.npc = [
    bakeCar('#4d7fd6'), bakeCar('#3fb583'), bakeCar('#c9d0da'),
    bakeCar('#8d6bd6'), bakeCar('#5a6472'), bakeCar('#b7566b'),
  ];
  SPR.truck = [ bakeTruck('#7d8794'), bakeTruck('#5e6b8a') ];
  SPR.onc = [ bakeCar('#f0f2f5', '#d8dde5', {headlights:true}),
              bakeCar('#ffd257', '#e8b93f', {headlights:true}) ];
  SPR.tree = bake(26, 26, (g) => {
    g.fillStyle = 'rgba(0,0,0,0.3)'; g.beginPath(); g.ellipse(14, 16, 9, 5, 0, 0, 6.3); g.fill();
    g.fillStyle = '#2f5c3a'; g.beginPath(); g.arc(13, 12, 10, 0, 6.3); g.fill();
    g.fillStyle = '#3d7549'; g.beginPath(); g.arc(11, 10, 7, 0, 6.3); g.fill();
  });
}
bakeAll();

/* ═══════════════════════════════════════════════════
   상태 / 오브젝트 풀
   ═══════════════════════════════════════════════════ */
const S = { TITLE:'TITLE', PLAY:'PLAY', PAUSE:'PAUSE', OVER:'OVER' };
let state = S.TITLE;

const MAX_CAR = 48;
const cars = [];
for (let i=0;i<MAX_CAR;i++) cars.push({
  on:false, x:0, y:0, w:32, h:56, spd:0, lane:0, kind:'npc', spr:null,
  passed:false, nearMissed:false,
  // 차선 변경
  changing:false, targetX:0, blinker:0, changeSpd:0, flee:false,
});
function spawnCar(){
  for (let i=0;i<MAX_CAR;i++) if (!cars[i].on) return cars[i];
  return null;
}
function liveCars(){ let n=0; for (let i=0;i<MAX_CAR;i++) if (cars[i].on) n++; return n; }

const MAX_PART = 160;
const parts = [];
for (let i=0;i<MAX_PART;i++) parts.push({on:false,x:0,y:0,vx:0,vy:0,life:0,max:0,col:'#fff',r:2});
let partCur = 0;
function spawnPart(x,y,vx,vy,life,col,r){
  for (let n=0;n<MAX_PART;n++){
    const i = partCur; partCur = (partCur+1) % MAX_PART;
    const p = parts[i];
    if (!p.on){ p.on=true; p.x=x; p.y=y; p.vx=vx; p.vy=vy; p.life=life; p.max=life; p.col=col; p.r=r||2; return; }
  }
}

// 배경 소품 (속도감용)
const MAX_PROP = 24;
const props = [];
for (let i=0;i<MAX_PROP;i++) props.push({on:false,x:0,y:0,kind:0});

const player = { x: LW/2, y: PLAYER.y, spd: SPD_START, vx: 0, tilt: 0, hurt: 0 };

let G = null;
let bestTime = 0, bestOver = 0;
let lastRun = null;          // 마지막 주행 기록 (시작 화면에 표시)
try {
  bestTime = parseFloat(localStorage.getItem('overtake-best') || '0') || 0;
  bestOver = parseInt(localStorage.getItem('overtake-best-ot') || '0', 10) || 0;
} catch(e){}

let frame = 0, scroll = 0, shake = 0, flash = 0;
let overTick = 0;            // 충돌 화면이 시작 화면으로 넘어가기까지 남은 프레임

function newRun(){
  for (let i=0;i<MAX_CAR;i++) cars[i].on = false;
  for (let i=0;i<MAX_PART;i++) parts[i].on = false;
  for (let i=0;i<MAX_PROP;i++) props[i].on = false;
  player.x = LW/2; player.y = PLAYER.y; player.spd = SPD_START; player.vx = 0; player.tilt = 0; player.hurt = 0;
  scroll = 0; shake = 0; flash = 0;
  G = {
    time: 0,               // 프레임
    overtakes: 0,
    nearMiss: 0,
    dist: 0,
    spawnTick: 8,
    wallTick: 0,
    oncTick: 0,
    banner: 0, bannerText: '',
    oncWarn: null,
    oncLane: -1,           // 역주행이 오는 차선 (정주행 스폰 금지)
    newBest: false,
    finished: false,
  };
  // 배경 소품 미리 배치
  for (let i=0;i<MAX_PROP;i++){
    props[i].on = true;
    props[i].x = (i % 2 === 0) ? (ROAD.x - 24 - Math.random()*16) : (ROAD.x + ROAD.w + 8 + Math.random()*16);
    props[i].y = -Math.random() * LH * 2;
    props[i].kind = 0;
  }
}

const sec = () => G.time / 60;

/* ═══════════════════════════════════════════════════
   난이도 — 시간에 따라 값이 자란다
   ═══════════════════════════════════════════════════ */
function diff(){
  const t = sec();
  // 램프를 0 이 아니라 0.25 에서 시작한다 — 시작 직후부터 차가 제법 있어야 한다.
  // 최대치 도달도 55초로 당겼다.
  const ramp = Math.min(1, 0.25 + t / 55);
  return {
    // 교통량: 스폰 간격이 좁아진다
    interval: Math.round(40 - 27 * ramp),                // 시작 33 → 최소 13 프레임
    // 상대 속도: 느린 차가 조금씩 빨라져 추월 여유가 줄어든다
    // 순항(7.0) 보다 느려야 기본 속도로도 계속 추월이 일어난다.
    // 후반에는 최고 속도가 순항에 붙어서, 추월하려면 가속을 밟아야 한다.
    npcMin: 2.8 + 1.6 * ramp,                            // 3.2 → 4.4
    npcMax: 4.6 + 2.4 * ramp,                            // 5.2 → 7.0
    truckChance: 0.18 + 0.10 * ramp,
    laneChange: t < T_LANECHANGE ? 0 : Math.min(0.52, 0.18 + (t - T_LANECHANGE) / 55),
    wallEvery: t < T_WALL ? 1e9 : Math.max(170, 400 - (t - T_WALL) * 5.5),
    oncEvery:  t < T_ONCOMING ? 1e9 : Math.max(110, 300 - (t - T_ONCOMING) * 4.6),
    ramp,
  };
}

/* ═══════════════════════════════════════════════════
   스폰
   ═══════════════════════════════════════════════════ */
// 어떤 차가 lane 으로 들어가도 안전한가 (차선 변경 판단용)
function laneClearFor(c, lane){
  const tx = laneX(lane);
  for (let j=0;j<MAX_CAR;j++){
    const a = cars[j];
    if (!a.on || a === c) continue;
    if (Math.abs(a.x - tx) >= (a.w + c.w) * 0.5 + 8) continue;
    if (Math.abs(a.y - c.y) < (a.h + c.h) * 0.5 + 46) return false;
  }
  return true;
}

// 같은 방향 차량끼리 겹치지 않게 한다.
// 뒤차가 앞차보다 빠르면 앞차 속도로 수렴시키고, 그래도 붙으면 물리적으로 밀어낸다.
// 이게 없으면 같은 차선에서 속도 차이만큼 그대로 겹쳐 지나간다.
function trafficAvoid(){
  for (let i=0;i<MAX_CAR;i++){
    const b = cars[i];
    if (!b.on || b.kind === 'onc') continue;
    let lead = null, bestGap = 1e9;
    for (let j=0;j<MAX_CAR;j++){
      if (j === i) continue;
      const a = cars[j];
      if (!a.on || a.kind === 'onc') continue;
      if (a.y >= b.y) continue;                                    // 앞(위)에 있는 차만
      if (Math.abs(a.x - b.x) >= (a.w + b.w) * 0.5 + 2) continue;  // 같은 폭에 걸린 차만
      const gap = (b.y - a.y) - (a.h + b.h) * 0.5;
      if (gap < bestGap){ bestGap = gap; lead = a; }
    }
    if (!lead) continue;
    if (bestGap < 95 && b.spd > lead.spd) b.spd = Math.max(lead.spd, b.spd - 0.22);
    if (bestGap < 3){                                              // 겹치기 직전 — 밀어낸다
      b.y = lead.y + (lead.h + b.h) * 0.5 + 3;
      b.spd = lead.spd;
    }
  }
}

// 정면(역주행)과 겹치는 정주행 차가 남았으면 급하게 옆으로 뺀다.
// 위 장치들로 거의 안 생기지만, 생겼을 때 겹쳐 보이지 않게 하는 마지막 안전망이다.
function oncAvoid(){
  for (let i=0;i<MAX_CAR;i++){
    const o = cars[i];
    if (!o.on || o.kind !== 'onc') continue;
    for (let j=0;j<MAX_CAR;j++){
      const c = cars[j];
      if (!c.on || c.kind === 'onc') continue;
      if (Math.abs(c.x - o.x) >= (c.w + o.w) * 0.5 + 10) continue;
      if (Math.abs(c.y - o.y) >= (c.h + o.h) * 0.5 + 70) continue;
      const dir = (c.x < ROAD.x + ROAD.w - LANE_W) ? 1 : -1;
      c.x += dir * 3.2;
      c.x = Math.max(ROAD.x + c.w*0.5 + 2, Math.min(ROAD.x + ROAD.w - c.w*0.5 - 2, c.x));
      c.changing = false; c.pendingLane = -1; c.blinker = 1;
      if (frame % 6 === 0) spawnPart(c.x, c.y + c.h*0.4, dir*0.6, 1.4, 12, 'rgba(230,235,240,', 2);
    }
  }
}

function laneFree(lane, y, h){
  for (let i=0;i<MAX_CAR;i++){
    const c = cars[i];
    if (!c.on) continue;
    if (Math.abs(c.x - laneX(lane)) > LANE_W * 0.7) continue;
    if (y - h*0.5 < c.y + c.h*0.5 + 42 && y + h*0.5 > c.y - c.h*0.5 - 42) return false;
  }
  return true;
}

function spawnTraffic(d){
  const isTruck = Math.random() < d.truckChance;
  const h = isTruck ? 88 : 56;
  const y = -h - 20;

  // 차선 하나가 막혔다고 이 틱을 버리지 않는다 — 최대 3곳을 시도한다.
  // (막힌 차선만 뽑아서 스폰이 계속 취소되면 밀도가 오르지 않는다)
  let lane = -1;
  for (let k = 0; k < 3; k++){
    let l = Math.floor(Math.random() * LANES);
    if (l === G.oncLane) l = (l + 1 + Math.floor(Math.random() * (LANES - 1))) % LANES;
    if (l === G.oncLane) continue;
    if (laneFree(l, y, h)){ lane = l; break; }
  }
  if (lane < 0) return;
  const c = spawnCar(); if (!c) return;
  c.on = true; c.lane = lane; c.x = laneX(lane); c.y = y;
  c.kind = isTruck ? 'truck' : 'npc';
  c.w = isTruck ? 40 : 32; c.h = h;
  c.spr = isTruck ? SPR.truck[Math.floor(Math.random()*SPR.truck.length)]
                  : SPR.npc[Math.floor(Math.random()*SPR.npc.length)];
  // 트럭은 느리다 — 추월 대상이 되기 좋게
  const lo = d.npcMin, hi = d.npcMax;
  c.spd = isTruck ? lo * 0.82 + Math.random() * 0.5 : lo + Math.random() * (hi - lo);
  c.passed = false; c.nearMissed = false;
  c.changing = false; c.blinker = 0;
  // 차선 변경 예정?
  if (!isTruck && Math.random() < d.laneChange){
    const dir = (lane === 0) ? 1 : (lane === LANES-1) ? -1 : (Math.random() < 0.5 ? -1 : 1);
    const want = lane + dir;
    c.pendingLane = (want === G.oncLane) ? -1 : want;
    c.pendingAt = 30 + Math.floor(Math.random() * 60);
  } else c.pendingLane = -1;
}

// 차량 벽 — 한 차선만 비운다. 속도를 죽이고 그 틈으로 들어가야 한다.
function spawnWall(d){
  // 역주행이 오는 차선이 있으면 그 차선을 통로로 삼는다 (벽이 정면 관통을 만들지 않게)
  const gap = (G.oncLane >= 0) ? G.oncLane : Math.floor(Math.random() * LANES);
  const y = -170;
  for (let l=0;l<LANES;l++){
    if (l === gap) continue;
    if (l === G.oncLane) continue;
    if (!laneFree(l, y, 56)) continue;
    const c = spawnCar(); if (!c) continue;
    c.on = true; c.lane = l; c.x = laneX(l); c.y = y - Math.random()*14;
    c.kind = 'npc'; c.w = 32; c.h = 56;
    c.spr = SPR.npc[Math.floor(Math.random()*SPR.npc.length)];
    c.spd = d.npcMin + Math.random() * 0.6;      // 벽은 느리게 — 브레이크를 강제한다
    c.passed = false; c.nearMissed = false;
    c.changing = false; c.blinker = 0; c.pendingLane = -1;
  }
  G.banner = 80; G.bannerText = '밀집 — 틈을 노려라';
}

// 역주행 예고 — 실제 차보다 먼저 차선을 붉게 경고한다.
// 닫히는 속도가 초당 ~16px(=960px/s) 이라 예고 없이 내보내면 반응 시간이 0.6초뿐이다.
// 예고 45프레임(0.75초) + 진입 후 주행 시간까지 합쳐 약 1.5초를 준다.
// 역주행이 들어갈 차선은 정주행 차가 가장 적은 쪽을 고른다.
function pickOncLane(){
  let best = 0, bestN = 1e9;
  for (let l=0;l<2;l++){
    let n = 0;
    for (let i=0;i<MAX_CAR;i++){
      const c = cars[i];
      if (!c.on || c.kind === 'onc') continue;
      if (Math.abs(c.x - laneX(l)) > LANE_W * 0.6) continue;
      if (c.y > player.y + 60) continue;          // 이미 지나간 차는 셈에서 뺀다
      n++;
    }
    if (n < bestN){ bestN = n; best = l; }
  }
  return best;
}

function warnOncoming(){
  const lane = pickOncLane();
  G.oncWarn = { lane, t: 60, tries: 0 };
  G.oncLane = lane;
  // 그 차선에 있던 정주행 차들은 옆으로 피한다 (역주행을 피하는 것처럼 읽힌다)
  for (let i=0;i<MAX_CAR;i++){
    const c = cars[i];
    if (!c.on || c.kind === 'onc') continue;
    if (Math.abs(c.x - laneX(lane)) > LANE_W * 0.6) continue;
    const alt = (lane + 1 < LANES) ? lane + 1 : lane - 1;
    if (laneClearFor(c, alt)){
      c.changing = true; c.flee = true;
      c.targetX = laneX(alt);
      c.changeSpd = (c.targetX > c.x) ? 1.0 : -1.0;
      c.lane = alt; c.pendingLane = -1; c.blinker = 1;
    }
  }
  G.banner = 70; G.bannerText = '⚠ 역주행';
  Sound.blip(300, 0.12, 'square', 0.10);
  setTimeout(()=>Sound.blip(300, 0.12, 'square', 0.10), 220);
}

// 역주행 차선이 정주행 차 없이 비어 있는가 (플레이어 앞쪽까지)
function oncLaneClear(lane){
  const lx = laneX(lane);
  for (let i=0;i<MAX_CAR;i++){
    const c = cars[i];
    if (!c.on || c.kind === 'onc') continue;
    if (Math.abs(c.x - lx) > (c.w + 32) * 0.5 + 4) continue;
    if (c.y < player.y + 80) return false;        // 앞쪽에 아직 차가 있다
  }
  return true;
}

// 역주행 — 마주 달려온다. 체감 속도가 두 배.
function spawnOncoming(d, forceLane){
  const lane = (forceLane !== undefined) ? forceLane : Math.floor(Math.random() * 2);
  const y = -200;
  if (!laneFree(lane, y, 56)) return;
  const c = spawnCar(); if (!c) return;
  c.on = true; c.lane = lane; c.x = laneX(lane); c.y = y;
  c.kind = 'onc'; c.w = 32; c.h = 56;
  c.spr = SPR.onc[Math.floor(Math.random()*SPR.onc.length)];
  c.spd = -(2.6 + Math.random() * 1.8 + d.ramp * 1.4);   // 음수 = 역주행
  c.passed = false; c.nearMissed = false;
  c.changing = false; c.blinker = 0; c.pendingLane = -1;
}

/* ═══════════════════════════════════════════════════
   업데이트
   ═══════════════════════════════════════════════════ */
function updatePlayer(){
  // ── 좌우
  let ax = 0;
  if (Input.touch){
    const dx = Input.touch.x - player.x;
    ax = Math.max(-1, Math.min(1, dx / 26));
  } else {
    if (Input.left)  ax -= 1;
    if (Input.right) ax += 1;
  }
  const LAT_ACC = 0.62, LAT_MAX = 5.4, LAT_FRIC = 0.80;
  player.vx += ax * LAT_ACC;
  if (ax === 0) player.vx *= LAT_FRIC;
  player.vx = Math.max(-LAT_MAX, Math.min(LAT_MAX, player.vx));
  player.x += player.vx;

  // 가드레일 — 즉사가 아니라 튕기고 감속. 즉사로 하면 너무 짜다.
  const half = PLAYER.w / 2;
  const lo = ROAD.x + half - 2, hi = ROAD.x + ROAD.w - half + 2;
  if (player.x < lo){
    player.x = lo; player.vx = Math.abs(player.vx) * 0.35;
    player.spd = Math.max(SPD_MIN, player.spd - 0.28);
    if (frame % 4 === 0){ spawnPart(player.x - half, player.y, -1.5, 1.5, 16, '#ffd66b', 2); Sound.blip(180, 0.04, 'square', 0.06); }
  }
  if (player.x > hi){
    player.x = hi; player.vx = -Math.abs(player.vx) * 0.35;
    player.spd = Math.max(SPD_MIN, player.spd - 0.28);
    if (frame % 4 === 0){ spawnPart(player.x + half, player.y, 1.5, 1.5, 16, '#ffd66b', 2); Sound.blip(180, 0.04, 'square', 0.06); }
  }

  // ── 가속 (브레이크 없음)
  //    ① 키보드 ↑ / W   ② 화면의 ▲ 버튼   ③ 조향 손가락을 위로 끌기 — 셋 다 가속
  let ay = 0;
  if (Input.up || Input.gas) ay = 1;
  else if (Input.touch){
    const dy = Input.touch.baseY - Input.touch.y;
    if (dy > 12) ay = Math.min(1, dy / 70);
  }

  if (ay > 0) player.spd += ACCEL * ay;
  else        player.spd -= COAST;                   // 떼면 기본 속도로 복귀
  player.spd = Math.max(SPD_BASE, Math.min(SPD_MAX, player.spd));

  // 기울기 (좌우 이동감)
  player.tilt += ((player.vx / LAT_MAX) * 0.20 - player.tilt) * 0.18;
  if (player.hurt > 0) player.hurt--;

  // 타이어 먼지 / 배기
  if (frame % 3 === 0){
    const t = (player.spd - SPD_BASE) / (SPD_MAX - SPD_BASE);
    spawnPart(player.x - 9 + Math.random()*18, player.y + PLAYER.h/2,
              (Math.random()-0.5)*0.6, 2.2 + t*2.5, 14, 'rgba(210,220,230,', 2);
  }
}

function updateWorld(){
  const d = diff();

  // 스폰
  G.spawnTick--;
  if (G.spawnTick <= 0){ spawnTraffic(d); G.spawnTick = d.interval + Math.floor(Math.random()*10); }
  G.wallTick++;
  if (G.wallTick >= d.wallEvery){ spawnWall(d); G.wallTick = 0; }
  G.oncTick++;
  if (G.oncTick >= d.oncEvery && !G.oncWarn){ warnOncoming(); G.oncTick = 0; }
  if (G.oncWarn){
    G.oncWarn.t--;
    if (G.oncWarn.t <= 0){
      // 아직 그 차선에 정주행 차가 남아 있으면 내보내지 않는다.
      // 겹쳐 지나가는 것보다 이번 역주행을 건너뛰는 편이 낫다.
      if (oncLaneClear(G.oncWarn.lane)){
        spawnOncoming(d, G.oncWarn.lane); G.oncWarn = null;
      } else if (G.oncWarn.tries < 3){
        G.oncWarn.tries++; G.oncWarn.t = 24;      // 조금 더 기다린다
      } else {
        G.oncWarn = null; G.oncLane = -1;         // 포기 — 다음 기회에
      }
    }
  }

  // 차량 이동
  for (let i=0;i<MAX_CAR;i++){
    const c = cars[i];
    if (!c.on) continue;

    // 상대 속도 = 내 속도 - 상대 속도.  역주행(음수)이면 더해져서 훨씬 빠르게 다가온다.
    c.y += (player.spd - c.spd);

    // 차선 변경 예약 처리 — 옆 차선이 비었을 때만 들어간다
    if (c.pendingLane >= 0){
      c.pendingAt--;
      if (c.pendingAt <= 0){
        if (c.pendingLane === G.oncLane){ c.pendingLane = -1; c.blinker = 0; }
        else if (laneClearFor(c, c.pendingLane)){
          c.changing = true; c.targetX = laneX(c.pendingLane);
          c.changeSpd = (c.targetX > c.x) ? 1.0 : -1.0;
          c.lane = c.pendingLane; c.pendingLane = -1; c.blinker = 1;
        } else {
          c.pendingAt = 24;              // 막혔다 — 잠시 뒤 다시 시도
        }
      } else if (c.pendingAt < 40) c.blinker = 1;      // 미리 깜빡인다 (예고)
    }
    if (c.changing){
      // 이동 중에도 목표 지점이 막히면 그 프레임은 멈춘다 (옆구리 관통 방지)
      const step = c.changeSpd * (c.flee ? 2.1 : 1.15);
      const nx = c.x + step;
      let blocked = false;
      for (let j=0;j<MAX_CAR;j++){
        const a = cars[j];
        if (!a.on || a === c || a.kind === 'onc') continue;
        if (Math.abs(a.x - nx) < (a.w + c.w) * 0.5 + 1 &&
            Math.abs(a.y - c.y) < (a.h + c.h) * 0.5 + 2){ blocked = true; break; }
      }
      if (!blocked) c.x = nx;
      if ((c.changeSpd > 0 && c.x >= c.targetX) || (c.changeSpd < 0 && c.x <= c.targetX)){
        c.x = c.targetX; c.changing = false; c.blinker = 0; c.flee = false;
      }
    }

    // 추월 판정 — 내 뒤로 넘어가는 순간
    if (!c.passed && c.y > player.y + PLAYER.h * 0.5){
      c.passed = true;
      if (c.kind !== 'onc'){ G.overtakes++; if (G.overtakes % 5 === 0) Sound.overtake(); }
    }
    // 아슬아슬 — 옆을 스칠 때
    if (!c.nearMissed){
      const dy = Math.abs(c.y - player.y);
      const dx = Math.abs(c.x - player.x);
      if (dy < (c.h + PLAYER.h) * 0.45 && dx < NEAR_MISS_X + (c.w + PLAYER.w) * 0.5 && dx > (c.w + PLAYER.w) * 0.5 - 2){
        c.nearMissed = true; G.nearMiss++;
        Sound.nearMiss();
        for (let q=0;q<4;q++)
          spawnPart(c.x + (player.x > c.x ? c.w*0.5 : -c.w*0.5), c.y + (Math.random()-0.5)*c.h,
                    (Math.random()-0.5)*1.2, 3, 12, 'rgba(255,240,170,', 2);
      }
    }

    if (c.y > LH + 120 || c.y < -400) c.on = false;
  }

  // 같은 방향 차량끼리 겹치지 않게 정리 (이동 뒤에 한 번)
  trafficAvoid();
  oncAvoid();

  // 역주행이 전부 지나갔으면 그 차선을 다시 열어 준다
  if (G.oncLane >= 0 && !G.oncWarn){
    let stillThere = false;
    for (let i=0;i<MAX_CAR;i++) if (cars[i].on && cars[i].kind === 'onc'){ stillThere = true; break; }
    if (!stillThere) G.oncLane = -1;
  }

  // 배경 소품
  for (let i=0;i<MAX_PROP;i++){
    const p = props[i];
    if (!p.on) continue;
    p.y += player.spd;
    if (p.y > LH + 40){
      p.y = -40 - Math.random() * 200;
      p.x = (Math.random() < 0.5) ? (ROAD.x - 26 - Math.random()*16) : (ROAD.x + ROAD.w + 8 + Math.random()*16);
    }
  }

  scroll += player.spd;
  G.dist += player.spd;
}

function collide(){
  if (window.__race && window.__race._inv) return;   // 자동 테스트용 무적
  const px = player.x, py = player.y;
  const pw = PLAYER.w - HIT_INSET_X*2, ph = PLAYER.h - HIT_INSET_Y*2;
  for (let i=0;i<MAX_CAR;i++){
    const c = cars[i];
    if (!c.on) continue;
    const cw = c.w - HIT_INSET_X*2, ch = c.h - HIT_INSET_Y*2;
    if (Math.abs(c.x - px) < (cw + pw) * 0.5 && Math.abs(c.y - py) < (ch + ph) * 0.5){
      crash(c);
      return;
    }
  }
}

function crash(c){
  G.finished = true;
  shake = 26; flash = 1;
  Sound.crash();
  Sound.setEngine(player.spd, false);
  for (let q=0;q<40;q++){
    const a = Math.random() * Math.PI * 2, v = 1 + Math.random() * 5;
    spawnPart(player.x, player.y - 10, Math.cos(a)*v, Math.sin(a)*v - 1,
              28 + Math.random()*22, q % 3 === 0 ? 'rgba(255,210,120,' : 'rgba(255,120,80,', 2 + Math.random()*2);
  }
  for (let q=0;q<14;q++)
    spawnPart(player.x, player.y, (Math.random()-0.5)*3, (Math.random()-0.5)*3 + 1.5, 40, 'rgba(180,190,200,', 3);

  const t = sec();
  lastRun = { sec: t, overtakes: G.overtakes, nearMiss: G.nearMiss,
              dist: G.dist, kmh: Math.round(player.spd * KMH), newBest: false };
  G.newBest = t > bestTime;
  if (G.newBest){
    bestTime = t; bestOver = G.overtakes;
    try { localStorage.setItem('overtake-best', String(t)); localStorage.setItem('overtake-best-ot', String(G.overtakes)); } catch(e){}
    Sound.best();
  }
  lastRun.newBest = G.newBest;
  overTick = 100;              // 약 1.7초 충돌 장면을 보여준 뒤 시작 화면으로
  state = S.OVER;
}

function updateParts(){
  for (let i=0;i<MAX_PART;i++){
    const p = parts[i];
    if (!p.on) continue;
    p.x += p.vx; p.y += p.vy; p.vy *= 0.985; p.vx *= 0.985;
    if (--p.life <= 0) p.on = false;
  }
}

function updatePlay(){
  G.time++;
  if (G.banner > 0) G.banner--;
  updatePlayer();
  updateWorld();
  collide();
  updateParts();
  Sound.setEngine(player.spd, true);
  if (shake > 0) shake *= 0.88;
  if (flash > 0) flash *= 0.86;
}

/* ═══════════════════════════════════════════════════
   렌더
   ═══════════════════════════════════════════════════ */
let shakeX = 0, shakeY = 0;

function drawRoad(){
  // 노면
  const g = ctx.createLinearGradient(ROAD.x, 0, ROAD.x + ROAD.w, 0);
  g.addColorStop(0, '#2c3138'); g.addColorStop(0.5, '#353b44'); g.addColorStop(1, '#2c3138');
  ctx.fillStyle = g;
  ctx.fillRect(ROAD.x, 0, ROAD.w, LH);

  // 차선 점선
  ctx.strokeStyle = 'rgba(235,240,245,0.55)';
  ctx.lineWidth = 3;
  ctx.setLineDash([26, 24]);
  ctx.lineDashOffset = -(scroll % 50);
  for (let i=1;i<LANES;i++){
    const x = ROAD.x + LANE_W * i;
    ctx.beginPath(); ctx.moveTo(x, -10); ctx.lineTo(x, LH+10); ctx.stroke();
  }
  ctx.setLineDash([]);

  // 가장자리 실선
  ctx.strokeStyle = 'rgba(245,248,252,0.75)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(ROAD.x + 3, 0); ctx.lineTo(ROAD.x + 3, LH); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ROAD.x + ROAD.w - 3, 0); ctx.lineTo(ROAD.x + ROAD.w - 3, LH); ctx.stroke();

  // 가드레일 (스크롤하는 기둥)
  ctx.fillStyle = '#8d97a4';
  ctx.fillRect(ROAD.x - 7, 0, 5, LH);
  ctx.fillRect(ROAD.x + ROAD.w + 2, 0, 5, LH);
  ctx.fillStyle = 'rgba(255,255,255,0.20)';
  const step = 34, off = scroll % step;
  for (let y = -step + off; y < LH + step; y += step){
    ctx.fillRect(ROAD.x - 7, y, 5, 8);
    ctx.fillRect(ROAD.x + ROAD.w + 2, y, 5, 8);
  }
}

function drawProps(){
  for (let i=0;i<MAX_PROP;i++){
    const p = props[i];
    if (!p.on) continue;
    const s = SPR.tree;
    ctx.drawImage(s.canvas, p.x - s.w/2, p.y - s.h/2, s.w, s.h);
  }
}

function drawCar(spr, x, y, tilt, blink){
  if (!spr) return;                 // 스프라이트가 비어도 루프가 죽지 않게
  ctx.save();
  ctx.translate(x, y);
  if (tilt) ctx.rotate(tilt);
  ctx.drawImage(spr.canvas, -spr.w/2, -spr.h/2, spr.w, spr.h);
  ctx.restore();
  if (blink && Math.floor(frame / 8) % 2 === 0){
    ctx.fillStyle = '#ffcf3d';
    ctx.beginPath(); ctx.arc(x + (blink > 0 ? 1 : -1) * 17, y - 14, 3.2, 0, 6.3); ctx.fill();
  }
}

// 역주행 예고 — 해당 차선 위쪽을 붉게 깜빡인다
function drawOncWarn(){
  if (!G || !G.oncWarn) return;
  const w = G.oncWarn;
  const x = ROAD.x + LANE_W * w.lane;
  const pulse = 0.30 + Math.abs(Math.sin(frame * 0.28)) * 0.40;
  const g = ctx.createLinearGradient(0, 0, 0, 260);
  g.addColorStop(0, 'rgba(255,60,60,' + pulse.toFixed(3) + ')');
  g.addColorStop(1, 'rgba(255,60,60,0)');
  ctx.fillStyle = g;
  ctx.fillRect(x, 0, LANE_W, 260);
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.globalAlpha = pulse + 0.25;
  ctx.fillStyle = '#ffffff'; ctx.font = 'bold 26px Menlo, monospace';
  ctx.fillText('▼', x + LANE_W/2, 74);
  ctx.font = 'bold 10px Menlo, monospace';
  ctx.fillText('역주행', x + LANE_W/2, 100);
  ctx.restore();
}

// 역주행 차의 헤드라이트 — 나를 향해 아래로 뻗는다.
// 색만으로 구분하면 황색 NPC 와 헷갈리므로, 형태로 확실히 분리한다.
function drawHeadlights(c){
  const yb = c.y + c.h * 0.5;
  const flick = 0.82 + Math.sin(frame * 0.9 + c.x) * 0.10;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const sx of [-1, 1]){
    const x0 = c.x + sx * c.w * 0.28;
    const g = ctx.createLinearGradient(x0, yb, x0, yb + 120);
    g.addColorStop(0, 'rgba(255,244,190,' + (0.42 * flick).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(255,244,190,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(x0 - 5, yb);
    ctx.lineTo(x0 + 5, yb);
    ctx.lineTo(x0 + 22, yb + 120);
    ctx.lineTo(x0 - 22, yb + 120);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function drawCars(){
  for (let i=0;i<MAX_CAR;i++){
    const c = cars[i];
    if (!c.on) continue;
    if (c.y < -140 || c.y > LH + 140) continue;
    if (c.kind === 'onc') drawHeadlights(c);
    const blink = c.blinker ? (c.changing ? c.changeSpd : (c.pendingLane > c.lane ? 1 : -1)) : 0;
    drawCar(c.spr, c.x, c.y, 0, blink);
    // 역주행은 경고 화살표를 위에 띄운다
    if (c.kind === 'onc' && c.y < player.y - 40){
      ctx.save();
      ctx.globalAlpha = 0.55 + Math.sin(frame*0.3)*0.3;
      ctx.fillStyle = '#ff5c5c';
      ctx.beginPath();
      ctx.moveTo(c.x, c.y - c.h*0.5 - 16);
      ctx.lineTo(c.x - 7, c.y - c.h*0.5 - 26);
      ctx.lineTo(c.x + 7, c.y - c.h*0.5 - 26);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }
}

function drawPlayer(){
  const spr = (player.hurt > 0 && Math.floor(frame/3)%2===0) ? SPR.playerHit : SPR.player;
  // 속도선 (스피드 라인)
  const t = (player.spd - SPD_BASE) / (SPD_MAX - SPD_BASE);
  if (t > 0.35){
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,' + ((t-0.35) * 0.30).toFixed(3) + ')';
    ctx.lineWidth = 2;
    for (let i=0;i<7;i++){
      const x = ROAD.x + 12 + ((i * 47 + (scroll*1.7) % 47) % (ROAD.w - 24));
      const y = ((i * 131 + scroll * 2.4) % (LH + 120)) - 60;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 26 + t*30); ctx.stroke();
    }
    ctx.restore();
  }
  drawCar(spr, player.x, player.y, player.tilt, 0);
}

function drawParts(){
  for (let i=0;i<MAX_PART;i++){
    const p = parts[i];
    if (!p.on) continue;
    const a = p.life / p.max;
    ctx.fillStyle = (p.col.charAt(0) === 'r') ? (p.col + a.toFixed(2) + ')') : p.col;
    ctx.globalAlpha = (p.col.charAt(0) === 'r') ? 1 : a;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (0.4 + a*0.6), 0, 6.3); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function fmtTime(s){
  const m = Math.floor(s / 60), r = s - m*60;
  return (m > 0 ? (m + ':' + (r < 10 ? '0' : '') + r.toFixed(1)) : r.toFixed(1) + '초');
}

function drawHUD(){
  ctx.save();
  ctx.textBaseline = 'middle';

  // 상단 바
  ctx.fillStyle = 'rgba(10,13,16,0.82)';
  ctx.fillRect(0, 0, LW, 52);

  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.font = '9px Menlo, monospace';
  ctx.fillText('TIME', 14, 15);
  ctx.fillStyle = '#ffffff'; ctx.font = 'bold 22px Menlo, monospace';
  ctx.fillText(fmtTime(sec()), 14, 34);

  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.font = '9px Menlo, monospace';
  ctx.fillText('추월', LW - 14, 15);
  ctx.fillStyle = '#5cff9e'; ctx.font = 'bold 22px Menlo, monospace';
  ctx.fillText(String(G.overtakes), LW - 14, 34);

  // 속도계
  ctx.textAlign = 'center';
  const kmh = Math.round(player.spd * KMH);
  ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.font = '9px Menlo, monospace';
  ctx.fillText('km/h', LW/2, 15);
  const t = (player.spd - SPD_BASE) / (SPD_MAX - SPD_BASE);
  ctx.fillStyle = t > 0.8 ? '#ff7a5c' : t > 0.5 ? '#ffd257' : '#9fd6ff';
  ctx.font = 'bold 20px Menlo, monospace';
  ctx.fillText(String(kmh), LW/2, 34);

  // 속도 게이지
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.fillRect(LW/2 - 44, 44, 88, 4);
  ctx.fillStyle = t > 0.8 ? '#ff7a5c' : t > 0.5 ? '#ffd257' : '#9fd6ff';
  ctx.fillRect(LW/2 - 44, 44, 88 * t, 4);

  // 아슬아슬 카운터
  if (G.nearMiss > 0){
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(255,240,170,0.75)'; ctx.font = '10px Menlo, monospace';
    ctx.fillText('아슬아슬 ' + G.nearMiss, 14, 66);
  }
  // 최고 기록
  if (bestTime > 0){
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.font = '10px Menlo, monospace';
    ctx.fillText('BEST ' + fmtTime(bestTime), LW - 14, 66);
  }

  // 구간 배너 — 차량 위에 겹쳐도 읽히도록 어두운 알약 배경을 깐다
  if (G.banner > 0){
    const a = Math.min(1, G.banner / 20);
    const warn = G.bannerText.charAt(0) === '⚠';
    ctx.textAlign = 'center';
    ctx.globalAlpha = a;
    ctx.font = 'bold 16px Menlo, monospace';
    const tw = ctx.measureText(G.bannerText).width;
    const bw = tw + 34, bh = 30, bx = LW/2 - bw/2, by = 84;
    ctx.fillStyle = 'rgba(8,10,13,0.86)';
    rr(ctx, bx, by, bw, bh, 15); ctx.fill();
    ctx.strokeStyle = warn ? 'rgba(255,107,107,0.85)' : 'rgba(255,210,87,0.75)';
    ctx.lineWidth = 1.4;
    rr(ctx, bx, by, bw, bh, 15); ctx.stroke();
    ctx.fillStyle = warn ? '#ff8b8b' : '#ffd257';
    ctx.fillText(G.bannerText, LW/2, by + bh/2 + 1);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

// 가속 버튼 — 누르고 있으면 밝아진다
function drawGasButton(){
  const on = Input.gas || Input.up;
  ctx.save();
  ctx.beginPath(); ctx.arc(GAS.x, GAS.y, GAS.r, 0, 6.3);
  ctx.fillStyle = on ? 'rgba(255,210,87,0.30)' : 'rgba(255,255,255,0.09)';
  ctx.fill();
  ctx.lineWidth = on ? 2.4 : 1.6;
  ctx.strokeStyle = on ? 'rgba(255,210,87,0.95)' : 'rgba(255,255,255,0.34)';
  ctx.stroke();
  // ▲
  ctx.fillStyle = on ? '#ffe9a8' : 'rgba(255,255,255,0.68)';
  ctx.beginPath();
  ctx.moveTo(GAS.x, GAS.y - 15);
  ctx.lineTo(GAS.x - 13, GAS.y + 8);
  ctx.lineTo(GAS.x + 13, GAS.y + 8);
  ctx.closePath(); ctx.fill();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 9px Menlo, monospace';
  ctx.fillStyle = on ? 'rgba(255,233,168,0.9)' : 'rgba(255,255,255,0.45)';
  ctx.fillText('가속', GAS.x, GAS.y + 22);
  ctx.restore();
}

function drawTitle(){
  ctx.fillStyle = 'rgba(10,13,16,0.88)';
  ctx.fillRect(0, 0, LW, LH);
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  ctx.fillStyle = '#ffffff'; ctx.font = 'bold 40px Menlo, monospace';
  ctx.fillText('쌩쌩 추월', LW/2, 190);
  ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.font = '11px Menlo, monospace';
  ctx.fillText('O V E R T A K E', LW/2, 222);

  // ── 지난 주행 기록 (죽고 나면 여기로 돌아온다)
  let y = 268;
  if (lastRun){
    const bw = 268, bx = LW/2 - bw/2, bh = 104;
    ctx.fillStyle = 'rgba(20,26,32,0.92)';
    rr(ctx, bx, y, bw, bh, 12); ctx.fill();
    ctx.strokeStyle = lastRun.newBest ? 'rgba(92,255,158,0.55)' : 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 1.2; rr(ctx, bx, y, bw, bh, 12); ctx.stroke();

    ctx.font = '10px Menlo, monospace';
    ctx.fillStyle = lastRun.newBest ? '#5cff9e' : 'rgba(255,255,255,0.42)';
    ctx.fillText(lastRun.newBest ? '★ 최고 기록 ★' : '지난 기록', LW/2, y + 17);

    ctx.font = 'bold 30px Menlo, monospace'; ctx.fillStyle = '#ffffff';
    ctx.fillText(fmtTime(lastRun.sec), LW/2, y + 46);

    ctx.font = '11px Menlo, monospace';
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(255,255,255,0.58)'; ctx.fillText('추월', bx + 22, y + 74);
    ctx.fillStyle = 'rgba(255,255,255,0.58)'; ctx.fillText('아슬아슬', bx + 22, y + 90);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#5cff9e'; ctx.fillText(lastRun.overtakes + ' 대', bx + bw - 22, y + 74);
    ctx.fillStyle = '#ffe9a8'; ctx.fillText(lastRun.nearMiss + ' 회', bx + bw - 22, y + 90);
    ctx.textAlign = 'center';
    y += bh + 16;
  } else y = 292;

  if (bestTime > 0){
    ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.font = '11px Menlo, monospace';
    ctx.fillText('최고 기록  ' + fmtTime(bestTime) + '  ·  추월 ' + bestOver, LW/2, y);
    y += 26;
  }

  ctx.fillStyle = '#ffd257'; ctx.font = 'bold 15px Menlo, monospace';
  ctx.fillText(lastRun ? '화면을 눌러 다시하기' : '화면을 눌러 시작', LW/2, y + 6);
  y += 34;

  ctx.fillStyle = 'rgba(255,255,255,0.68)'; ctx.font = '11px Menlo, monospace';
  const lines = [
    '← →  또는  A D      좌우',
    '↑    또는  W        가속',
    '',
    '브레이크는 없습니다. 핸들로만 피하세요',
    '모바일은 우측 하단 ▲ 버튼으로 가속',
  ];
  lines.forEach((l, i) => ctx.fillText(l, LW/2, y + 22 + i*19));

  ctx.fillStyle = 'rgba(255,255,255,0.22)'; ctx.font = '10px Menlo, monospace';
  ctx.fillText('M 음소거', LW/2, LH - 26);
  ctx.restore();
}

// 충돌 순간만 짧게. 기록은 시작 화면에서 보여주므로 여기서 붙잡지 않는다.
function drawOver(){
  const fade = Math.min(0.62, (100 - overTick) / 100 * 0.9);
  ctx.fillStyle = 'rgba(10,13,16,' + fade.toFixed(3) + ')';
  ctx.fillRect(0, 0, LW, LH);
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ff5c5c'; ctx.font = 'bold 34px Menlo, monospace';
  ctx.fillText('충 돌', LW/2, LH/2 - 20);
  if (lastRun && lastRun.newBest){
    ctx.fillStyle = '#5cff9e'; ctx.font = 'bold 15px Menlo, monospace';
    ctx.fillText('★ 최고 기록 ★', LW/2, LH/2 + 16);
  }
  ctx.restore();
}

function render(){
  ctx.setTransform(renderScale, 0, 0, renderScale, 0, 0);
  drawScale = 1;

  // 바깥 (풀)
  ctx.fillStyle = '#16241b';
  ctx.fillRect(0, 0, LW, LH);

  shakeX = shake > 0.3 ? (Math.random()-0.5) * shake : 0;
  shakeY = shake > 0.3 ? (Math.random()-0.5) * shake : 0;
  ctx.save();
  ctx.translate(shakeX, shakeY);

  drawRoad();
  drawProps();
  if (G){
    drawOncWarn();
    drawCars();
    if (!G.finished) drawPlayer();
    drawParts();
  }
  ctx.restore();

  if (flash > 0.01){
    ctx.fillStyle = 'rgba(255,120,90,' + (flash * 0.5).toFixed(3) + ')';
    ctx.fillRect(0, 0, LW, LH);
  }

  if (state === S.PLAY || state === S.PAUSE){ drawHUD(); drawGasButton(); }
  if (state === S.TITLE) drawTitle();
  if (state === S.OVER) drawOver();
  if (state === S.PAUSE){
    ctx.save();
    ctx.fillStyle = 'rgba(10,13,16,0.6)'; ctx.fillRect(0, 0, LW, LH);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 24px Menlo, monospace';
    ctx.fillText('일시정지', LW/2, LH/2 - 10);
    ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.font = '11px Menlo, monospace';
    ctx.fillText('ESC 또는 화면을 눌러 계속', LW/2, LH/2 + 20);
    ctx.restore();
  }
}

/* ═══════════════════════════════════════════════════
   상태 전환 + 루프
   ═══════════════════════════════════════════════════ */
function handleInput(){
  if (Input.wasPressed('MUTE')){ Sound.toggleMute(); Sound.ui(); }

  if (state === S.TITLE){
    if (Input.consumeTap() || Input.wasPressed('OK')){
      Sound.init(); Sound.resume(); Sound.ui();
      newRun(); state = S.PLAY;
    }
    return;
  }
  if (state === S.PLAY){
    if (Input.wasPressed('PAUSE')){ state = S.PAUSE; Sound.setEngine(player.spd, false); Sound.ui(); }
    if (Input.wasPressed('RETRY')){ newRun(); Sound.ui(); }
    Input.consumeTap();
    return;
  }
  if (state === S.PAUSE){
    if (Input.wasPressed('PAUSE') || Input.consumeTap()){ state = S.PLAY; Sound.ui(); }
    return;
  }
  if (state === S.OVER){
    if (overTick > 0) overTick--;
    // 충돌 직후 오조작을 막고, 잠깐 뒤 자동으로 시작 화면으로 돌아간다
    const canSkip = shake < 6;
    if (overTick <= 0 || (canSkip && (Input.consumeTap() || Input.wasPressed('OK') || Input.wasPressed('RETRY')))){
      Input.consumeTap();
      state = S.TITLE;
    }
    return;
  }
}

const STEP = 1000 / 60;
let acc = 0, last = performance.now();
let fpsSamples = [];

function loop(now){
  const dt = now - last; last = now;
  fpsSamples.push(1000 / Math.max(1, dt));
  if (fpsSamples.length > 60) fpsSamples.shift();

  acc += Math.min(dt, 100);          // 탭 전환 후 몰아서 돌지 않게 상한
  let guard = 0;
  while (acc >= STEP && guard++ < 5){
    frame++;
    handleInput();
    if (state === S.PLAY) updatePlay();
    else { updateParts(); if (shake > 0) shake *= 0.88; if (flash > 0) flash *= 0.86; }
    acc -= STEP;
  }
  render();
  requestAnimationFrame(loop);
}

newRun();
state = S.TITLE;
requestAnimationFrame(loop);

/* ═══════════════════════════════════════════════════
   자동 테스트용 훅
   ═══════════════════════════════════════════════════ */
window.__input = Input;          // 자동 테스트가 키 입력을 흉내내는 통로
window.__race = {
  get state(){ return state; },
  get G(){ return G; },
  get player(){ return player; },
  get cars(){ return cars; },
  get liveCars(){ return liveCars(); },
  get sec(){ return G ? sec() : 0; },
  get fps(){ return fpsSamples.length ? fpsSamples.reduce((a,b)=>a+b,0)/fpsSamples.length : 0; },
  get diff(){ return G ? diff() : null; },
  get best(){ return bestTime; },
  get lastRun(){ return lastRun; },
  get gas(){ return { on: Input.gas || Input.up, box: GAS }; },
  // 겹친 차량 쌍 수 — 관통 검증용. 0 이어야 한다.
  get overlaps(){
    const out = [];
    for (let i=0;i<MAX_CAR;i++){
      const a = cars[i]; if (!a.on) continue;
      for (let j=i+1;j<MAX_CAR;j++){
        const b = cars[j]; if (!b.on) continue;
        if (Math.abs(a.x-b.x) < (a.w+b.w)*0.5 - 2 && Math.abs(a.y-b.y) < (a.h+b.h)*0.5 - 2)
          out.push({ a:a.kind, b:b.kind, dx:Math.round(Math.abs(a.x-b.x)), dy:Math.round(Math.abs(a.y-b.y)) });
      }
    }
    return out;
  },
  get kinds(){ const o = {npc:0,truck:0,onc:0,changing:0};
    for (let i=0;i<MAX_CAR;i++){ const c = cars[i]; if (!c.on) continue;
      o[c.kind]++; if (c.changing || c.pendingLane >= 0) o.changing++; }
    return o; },
  start(){ Sound.init(); newRun(); state = 'PLAY'; },
  setTime(s){ if (G) G.time = Math.round(s * 60); },
  invincible(v){ this._inv = v; },
  kill(){ if (G && state === 'PLAY') crash(cars[0]); },
  // 회피 AI 가 쓸 정보: 앞쪽 위험 지도
  threats(){
    const out = [];
    for (let i=0;i<MAX_CAR;i++){
      const c = cars[i];
      if (!c.on) continue;
      const rel = player.spd - c.spd;               // 다가오는 속도
      if (c.y > player.y + 40) continue;
      out.push({ x: c.x, y: c.y, w: c.w, h: c.h, rel, kind: c.kind,
                 eta: rel > 0.01 ? (player.y - c.y) / rel : 9999 });
    }
    return out;
  },
  consts: { LW, LH, ROAD, LANES, LANE_W, SPD_BASE, SPD_MAX, PLAYER,
            T_LANECHANGE, T_WALL, T_ONCOMING },
};
</script>
